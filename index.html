<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e0d" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Balance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  [hidden]{display:none!important}
  img{max-width:100%}
</style><title>Balance Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  --ground:#f4f3ef; --surface:#ffffff; --surface-2:#fbfaf7; --surface-3:#f0efe9;
  --ink:#111714; --ink-2:#4d564f; --ink-3:#8a918a;
  --line:#e3e1d8; --line-2:#cfccbf;
  --brand:#0f5c4a; --brand-ink:#0f5c4a; --brand-soft:#dcece6; --on-brand:#ffffff;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-ink:#006300; --crit-ink:#a52b2b; --warn-ink:#8a6000;
  --good-soft:#e2f2e2; --crit-soft:#f8e4e4; --warn-soft:#fbf0d8;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948;
  --c9:#6b7f8c; --c10:#9a7b5f; --c11:#7a8c4a; --c12:#8a6fa3;
  --grid:#e8e6de; --track:#eceae2;
  --shadow:0 1px 2px rgba(17,23,20,.05), 0 8px 24px -12px rgba(17,23,20,.14);
  --shadow-lift:0 2px 6px rgba(17,23,20,.08), 0 18px 40px -16px rgba(17,23,20,.26);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0c0e0d; --surface:#161a18; --surface-2:#1b201d; --surface-3:#232925;
  --ink:#f2f4f2; --ink-2:#b4bcb7; --ink-3:#7d8681;
  --line:#272d29; --line-2:#39413c;
  --brand:#4bc79e; --brand-ink:#4bc79e; --brand-soft:#15302a; --on-brand:#08201a;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-ink:#3fc23f; --crit-ink:#f08585; --warn-ink:#e3a72a;
  --good-soft:#12291a; --crit-soft:#2e1a1a; --warn-soft:#2c2415;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --c9:#8399a8; --c10:#b08f6d; --c11:#93a758; --c12:#a284bd;
  --grid:#252b27; --track:#232925;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 18px 40px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0c0e0d; --surface:#161a18; --surface-2:#1b201d; --surface-3:#232925;
  --ink:#f2f4f2; --ink-2:#b4bcb7; --ink-3:#7d8681;
  --line:#272d29; --line-2:#39413c;
  --brand:#4bc79e; --brand-ink:#4bc79e; --brand-soft:#15302a; --on-brand:#08201a;
  --good-ink:#3fc23f; --crit-ink:#f08585; --warn-ink:#e3a72a;
  --good-soft:#12291a; --crit-soft:#2e1a1a; --warn-soft:#2c2415;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --c9:#8399a8; --c10:#b08f6d; --c11:#93a758; --c12:#a284bd;
  --grid:#252b27; --track:#232925;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 18px 40px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}

html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Archivo","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

#shell{max-width:600px;margin:0 auto;padding:0 16px 96px;min-height:100%}
#topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  margin:0 -16px; padding:10px 16px; border-bottom:1px solid var(--line);
}
.mesrow{display:flex;align-items:center;gap:8px}
.mesnav{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:17px;line-height:1;flex:none}
.mesnav:hover{background:var(--surface-3);border-color:var(--line-2)}
.mestitle{flex:1;min-width:0;text-align:center}
.mestitle .m{font-family:"Instrument Serif",Georgia,serif;font-size:25px;line-height:1.05;letter-spacing:.2px;
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mestitle .y{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-top:1px}
.hoybtn{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--brand-ink);
  padding:4px 8px;border-radius:8px;background:var(--brand-soft);margin-top:3px;display:inline-block}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px;padding-block:16px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
h2.sec{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:23px;margin:0;letter-spacing:.2px;text-wrap:balance}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;
  box-shadow:var(--shadow-lift);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--hero-accent,var(--brand))}
.hero .lbl{font-size:12.5px;color:var(--ink-2);font-weight:500}
.hero .big{font-family:"Instrument Serif",Georgia,serif;font-size:46px;line-height:1.02;margin:4px 0 2px;
  letter-spacing:-.5px;color:var(--hero-accent,var(--ink))}
.hero .sub{font-size:12.5px;color:var(--ink-3)}
.miniflow{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:2px;margin-top:14px;
  border-top:1px solid var(--line);padding-top:12px}
.miniflow div{display:flex;flex-direction:column;gap:2px}
.miniflow .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.miniflow .v{font-size:15px;font-weight:600}

.segs{display:flex;gap:3px;background:var(--surface-3);padding:3px;border-radius:15px}
.segs button{flex:1;padding:9px 6px;border-radius:12px;font-weight:600;font-size:14px;color:var(--ink-3);transition:background .15s,color .15s}
.segs button[aria-selected=true]{background:var(--brand);color:var(--on-brand);box-shadow:var(--shadow)}
.segs button[aria-selected=true] small{color:var(--on-brand);opacity:.8}
.segs button small{font-size:10.5px;font-weight:700;color:var(--ink-3);margin-left:2px;vertical-align:1px}
.segs.mini button{padding:7px 6px;font-size:12.5px;border-radius:10px}
.hero .segs.mini{padding:3px;border-radius:12px}
.hero .segs.mini button{padding:6px 6px;font-size:12px;border-radius:9px}

/* proyectado vs real */
.dosdonuts{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;align-items:start}
.dosdonuts .donutwrap{width:100%;max-width:170px;margin:0 auto}
.dosdonuts .cap{text-align:center;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink-3);margin-top:8px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:9px 10px;align-items:center;font-size:12.5px;margin-top:14px}
.cmp .hd{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-3);text-align:right}
.cmp .hd:first-child{text-align:left}
.cmp .nm{display:flex;align-items:center;gap:7px;min-width:0;font-weight:600;font-size:13px}
.cmp .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cmp .n{text-align:right;color:var(--ink-2)}
.cmp .d{text-align:right;font-weight:700}
.cmp .d.ok{color:var(--good-ink)} .cmp .d.crit{color:var(--crit-ink)} .cmp .d.none{color:var(--ink-3);font-weight:500}
.cmp .tt{border-top:1px solid var(--line);padding-top:9px;font-weight:700;color:var(--ink)}

.donutwrap{position:relative;width:min(200px,62vw);margin:2px auto 6px}
.donutwrap svg{display:block;width:100%;height:auto;overflow:visible}
.dseg{cursor:pointer;transition:opacity .18s}
.dseg:hover{opacity:.72}
.dseg.off{opacity:.28}
.dseg.sel{filter:brightness(1.08)}
.slicebox{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:6px 10px;
  margin:4px auto 0;max-width:340px;padding:10px 12px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);
  font-size:13.5px;animation:aparece .18s ease-out}
.slicebox .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slicebox .v{font-weight:700}
.slicebox .p{font-size:12px;color:var(--ink-2);background:var(--surface-3);padding:2px 7px;border-radius:999px}
@keyframes aparece{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.donutmid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;padding:0 12%}
.donutmid .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.donutmid .v{font-size:clamp(17px,5.2vw,22px);font-weight:700;letter-spacing:-.4px;line-height:1.15;margin-top:2px}
.donutmid .s{font-size:10.5px;color:var(--ink-3);margin-top:2px}

.compbar{display:flex;gap:2px;height:13px;border-radius:7px;overflow:hidden;background:var(--track)}
.compbar span{display:block;min-width:3px;border-radius:2px}
.compbar span:first-child{border-radius:7px 2px 2px 7px}
.compbar span:last-child{border-radius:2px 7px 7px 2px}

.catlist{display:flex;flex-direction:column;gap:3px}
.catrow{border-radius:14px;padding:11px 12px;border:1px solid transparent;transition:background .15s}
.catrow:hover{background:var(--surface-2)}
.catrow.open{background:var(--surface-2);border-color:var(--line)}
.cathead{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.catname{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.catname b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none;vertical-align:middle}
.catnums{text-align:right;flex:none;line-height:1.25}
.catnums .a{font-weight:600;font-size:14.5px;display:block}
.catnums .b{font-size:11.5px;color:var(--ink-3);display:block}
.meter{margin-top:9px;height:9px;border-radius:5px;background:var(--track);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:5px;display:block;transition:width .45s cubic-bezier(.2,.7,.3,1)}
.metertag{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.tag-ok{background:var(--good-soft);color:var(--good-ink)}
.tag-warn{background:var(--warn-soft);color:var(--warn-ink)}
.tag-crit{background:var(--crit-soft);color:var(--crit-ink)}
.tag-none{background:var(--surface-3);color:var(--ink-3)}
.subs{display:flex;flex-direction:column;gap:9px;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line-2)}
.subrow .top{display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:baseline}
.subrow .top span:first-child{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subrow .top span:last-child{flex:none;color:var(--ink-2)}
.subrow .top em{font-style:normal;color:var(--ink-3);font-size:11.5px;margin-left:6px}
.subbar{height:6px;border-radius:3px;background:var(--track);margin-top:4px;overflow:hidden}
.subbar i{display:block;height:100%;border-radius:3px}
.sinusar{font-size:11.5px;color:var(--ink-3);line-height:1.5;padding-top:2px}
.subtag{font-size:10.5px;font-weight:600;margin-top:3px}
.subtag.ok{color:var(--good-ink)} .subtag.warn{color:var(--warn-ink)} .subtag.crit{color:var(--crit-ink)}
.libre{font-style:normal;font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  padding:1px 4px;border-radius:4px;background:var(--surface-3);color:var(--ink-3);margin-left:5px;vertical-align:1px}
.pgrupo{border:1px solid var(--line);border-radius:13px;padding:11px;background:var(--surface-2);
  display:flex;flex-direction:column;gap:9px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead b{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}
.phead .tt{font-size:12px;color:var(--ink-2);font-weight:600;text-align:right}
.phead .tt small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.psub{display:flex;align-items:center;gap:9px}
.psub span{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psub input{flex:0 0 130px;padding:8px 10px;font-size:14px}

.vchart{display:flex;align-items:flex-end;gap:4px;height:150px;position:relative;padding-top:18px}
.vcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;min-width:0}
.vcol .bar{border-radius:4px 4px 2px 2px;min-height:3px;transition:height .5s cubic-bezier(.2,.7,.3,1)}
.vcol .bar.dim{opacity:.45}
.vcol .val{position:absolute;left:0;right:0;text-align:center;font-size:9.5px;font-weight:600;color:var(--ink-2);top:0}
.vaxis{display:flex;gap:4px;margin-top:6px}
.vaxis span{flex:1;text-align:center;font-size:9.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;min-width:0;overflow:hidden}
.vaxis span.now{color:var(--ink);font-weight:700}
.gridline{position:absolute;left:0;right:0;border-top:1px solid var(--grid);pointer-events:none}

.movs{display:flex;flex-direction:column}
.mov{display:flex;align-items:center;gap:11px;padding:10px 6px;width:100%;text-align:left;
  border-bottom:1px solid var(--line);border-radius:8px;transition:background .15s}
.mov:last-child{border-bottom:none}
.mov:hover{background:var(--surface-2)}
.mov .bar{width:3px;align-self:stretch;border-radius:2px;flex:none;min-height:30px}
.mov .txt{flex:1;min-width:0}
.mov .txt b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .txt span{display:block;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .amt{font-weight:600;font-size:14.5px;flex:none}
.mov .amt.in{color:var(--good-ink)}
.chip{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:1px 5px;border-radius:5px;
  background:var(--surface-3);color:var(--ink-3);margin-left:5px;vertical-align:1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:13px;
  font-weight:600;font-size:14.5px;background:var(--surface-3);color:var(--ink);border:1px solid transparent;transition:filter .15s}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--brand);color:var(--on-brand)}
.btn.out{background:var(--surface);border-color:var(--line-2);color:var(--ink-2)}
.btn.dan{background:var(--crit-soft);color:var(--crit-ink)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px}
.row>*{flex:1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);
  font-size:15px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:var(--surface)}
textarea{resize:vertical;min-height:74px;line-height:1.5}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}

.composer{display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;min-height:46px;max-height:140px;resize:none;border-radius:23px;padding:12px 16px;line-height:1.45;overflow-y:auto}
.cbtn{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);
  box-shadow:var(--shadow);transition:transform .1s,background .15s}
.cbtn:active{transform:scale(.93)}
.cbtn:disabled{opacity:.4;transform:none}
.cbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cbtn.rec{background:var(--crit);color:#fff;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.heard{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;line-height:1.5}
.hint{font-size:12px;color:var(--ink-3);line-height:1.55}
.hint code{background:var(--surface-3);padding:1px 5px;border-radius:5px;font-family:inherit;font-weight:600;color:var(--ink-2);font-size:11.5px}

.draft{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:9px}
.draft.warnrow{border-color:var(--warn);background:var(--warn-soft)}
.draft .l1{display:flex;gap:8px;align-items:center}
.draft .l1 input[type=text]{flex:1}
.draft .del{width:34px;height:34px;flex:none;border-radius:10px;background:var(--surface-3);color:var(--ink-3);display:grid;place-items:center;font-size:17px}
.draft .del:hover{background:var(--crit-soft);color:var(--crit-ink)}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:2px}
#tabs .t{flex:1;max-width:110px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 1px;
  border-radius:12px;color:var(--ink-3);font-size:9.5px;font-weight:600;transition:color .15s,background .15s;white-space:nowrap;overflow:hidden}
#tabs .t .ico{position:relative;display:block;width:21px;height:21px}
@media (max-width:380px){#tabs .t{font-size:8.5px;letter-spacing:-.01em}}

<script>
"use strict";
/* =========================================================================
   Balance Personal — gastos, presupuestos, ingresos y ahorro, mes a mes.
   Categorías y subcategorías totalmente editables. Carga por voz en criollo.
   ========================================================================= */

const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MESES_CORTO=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const PALETA=["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8","--c9","--c10","--c11","--c12"];

const fmtMoney=new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});
const $=(s,r)=>(r||document).querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function money(n){return fmtMoney.format(Math.round(Number(n)||0));}
function moneyShort(n){const a=Math.abs(n);
  if(a>=1e6)return (n/1e6).toLocaleString("es-AR",{maximumFractionDigits:1})+"M";
  if(a>=1e3)return Math.round(n/1e3)+"k"; return String(Math.round(n));}
function pct(n){return (Math.round(n*10)/10).toLocaleString("es-AR",{maximumFractionDigits:1})+"%";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9ñ\s]/g," ").replace(/\s+/g," ").trim();}
function normNum(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9ñ.,$\s]/g," ").replace(/\s+/g," ").trim();}
function mesKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function keyMas(k,n){const[y,m]=k.split("-").map(Number);return mesKey(new Date(y,m-1+n,1));}
function hoyISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fechaCorta(iso){if(!iso)return"";const p=String(iso).split("-");return p.length<3?"":(Number(p[2])+" "+MESES_CORTO[Number(p[1])-1]);}
function colorDe(i){return "var("+PALETA[((i%PALETA.length)+PALETA.length)%PALETA.length]+")";}
function titulizar(s){s=String(s||"").trim();return s?s.charAt(0).toUpperCase()+s.slice(1):"";}

/* estado de una barra frente a su tope — el mismo criterio en toda la app:
   amarillo = todavía falta, verde = completo, rojo = pasado */
function estadoTope(gastado,tope){ if(!(tope>0)) return "none"; const r=(Number(gastado)||0)/tope; return r<0.99?"warn":(r<=1.01?"ok":"crit"); }
function colorEstado(est,neutro){ return est==="crit"?"var(--crit)":est==="warn"?"var(--warn)":est==="ok"?"var(--good)":neutro; }
function textoEstado(est,gastado,tope,vFalta){
  const p=tope>0?pct(gastado/tope*100):"";
  return est==="crit"?`${p} · ${money(gastado-tope)} de más`:est==="ok"?`${p} · completo`
    :est==="warn"?`${p} · ${vFalta||"faltan"} ${money(tope-gastado)}`:"Sin tope";
}

/* ============================ datos por defecto ============================ */

const CATS_DEF=[
  {id:"departamento",nombre:"Departamento",color:0,subs:["Alquiler","Expensas","TCG"]},
  {id:"comida",      nombre:"Comida",      color:1,subs:["Verdura","Carne","Súper","Pescado"]},
  {id:"deporte",     nombre:"Deporte",     color:2,subs:["Gimnasio","Boxeo","Fútbol","Natación","Pádel"]},
  {id:"servicios",   nombre:"Servicios",   color:3,subs:["Edesur","Gas"]},
  {id:"salidas",     nombre:"Salidas",     color:4,subs:[]},
  {id:"auto",        nombre:"Auto",        color:5,subs:["Patente","Cuota","Seguro"]},
  {id:"tarjetas",    nombre:"Tarjetas",    color:6,subs:["Mercado Libre","Mastercard","Visa"]},
  {id:"otros",       nombre:"Otros",       color:7,subs:[]}
];

/* sinónimos que el dictado reconoce, además de los nombres de subcategoría */
const SINONIMOS={
  departamento:["alquiler","expensas","tcg","abl","rentas","inmobiliario","portero","administracion","consorcio","departamento","depto"],
  comida:["super","supermercado","almacen","carne","carniceria","verdura","verduleria","fruta","fruteria","panaderia",
    "pan","fiambre","fiambreria","leche","huevos","lacteos","feria","chino","dietetica","pollo","pescado","pescaderia",
    "mercado","comida","asado","milanesas","galletitas","yerba","aceite","fideos","arroz","harina","queso","jamon",
    "gaseosa","vino","coto","carrefour","dia","jumbo","disco","vea","chango","changomas","mayorista","diarco"],
  deporte:["gimnasio","gym","boxeo","futbol","natacion","pileta","padel","tenis","running","crossfit","spinning",
    "yoga","pilates","entrenador","profe","club","cancha","suplementos","proteina","creatina","deporte"],
  servicios:["edesur","de sur","sur","edenor","luz","electricidad","gas","metrogas","agua","aysa","internet","wifi",
    "fibertel","telefono","celular","abono","cable","netflix","spotify","disney","hbo","max","streaming","chatgpt",
    "claude","icloud","personal","claro","movistar","flow","directv","telecentro","servicio","servicios"],
  salidas:["resto","restaurante","restaurant","bar","birra","cerveza","salida","salidas","cine","teatro","boliche",
    "delivery","pedidosya","rappi","cafe","cafeteria","heladeria","helado","pizza","hamburguesa","joda","previa",
    "recital","cumple","regalo","almuerzo","cena","merienda","salimos","after","tragos","fernet"],
  auto:["patente","seguro","nafta","combustible","gasoil","ypf","shell","axion","peaje","cochera","estacionamiento",
    "vtv","mecanico","gomeria","lavadero","service","cubiertas","bateria","grua","auto","cuota del auto","prenda",
    "uber","cabify","didi","taxi","remis","colectivo","bondi","sube","subte","tren","micro","pasaje"],
  tarjetas:["mercado libre","mercadolibre","meli","mastercard","master","visa","tarjeta","tarjetas","resumen",
    "resumen tarjeta","amex","american express","naranja","cabal"],
  otros:["otros","varios","imprevisto","regalos","donacion","banco","comision","farmacia","remedios","medico",
    "dentista","prepaga","osde","swiss","psicologo","peluqueria","barberia","ropa","zapatillas","curso","libro",
    "veterinaria","mascota","perro","gato","ferreteria","limpieza","mueble","efectivo","nafta moto"]
};

const FUENTES_DEF=["Sueldo","Ganancias"];
const INSTR_DEF=["Plazo fijo","Dólares","Cripto","Acciones / CEDEARs","Fondo común","Efectivo guardado","Otro"];

function diccionarioBase(cats){
  const d={};
  for(const cat in SINONIMOS) for(const w of SINONIMOS[cat]){const k=norm(w); if(k) d[k]=cat;}
  for(const c of (cats||CATS_DEF)) for(const s of (c.subs||[])){const k=norm(s); if(k) d[k]=c.id;}
  return d;
}

const CONFIG_DEF=()=>({
  cats:CATS_DEF.map(c=>({...c,subs:[...c.subs]})),
  dicc:diccionarioBase(CATS_DEF),
  fuentes:[...FUENTES_DEF],
  instrumentos:[...INSTR_DEF],
  fijos:[], arrastre:true, v:2
});
/* presupuestos: tope por categoría (para las que no tienen subcategorías)
   presupuestosSub: tope por subcategoría — su suma es el tope de la categoría */
const MES_DEF=()=>({gastos:[],ingresos:[],inversiones:[],presupuestos:{},presupuestosSub:{},presupuestosIng:{},
  creado:new Date().toISOString()});

/* ============================ almacenamiento ============================ */

const store={
  db:null, listos:false, usaDb:false, config:CONFIG_DEF(), meses:{}, _colas:{},

  async init(){
    try{
      this.db=await Promise.race([
        (window.claude&&window.claude.use)?window.claude.use("db"):Promise.resolve(null),
        new Promise(r=>setTimeout(()=>r(null),11000))
      ]);
    }catch(e){this.db=null;}

    if(this.db){
      this.usaDb=true;
      await new Promise(resolve=>{
        let a=false,b=false; const chk=()=>{if(a&&b)resolve();};

        /* los documentos que entrega la base vienen congelados (Object.freeze):
           se clonan siempre antes de tocarlos, si no cualquier push() explota */
        const clonar=o=>JSON.parse(JSON.stringify(o));

        this.db.doc("config/general").onSnapshot(s=>{
          /* mientras haya una escritura nuestra en vuelo, lo local manda */
          if(s.exists && !this._pend["config/general"]){
            const nuevo=this.migrar({...CONFIG_DEF(),...clonar(s.data())});
            const cambio=JSON.stringify(nuevo)!==JSON.stringify(this.config);
            this.config=nuevo;
            if(this.listos&&cambio) App.pedirRender();
          }
          a=true;chk();
        },()=>{a=true;chk();});

        this.db.collection("meses").onSnapshot(q=>{
          const m={};
          q.docs.forEach(d=>{
            const path="meses/"+d.id;
            m[d.id]=(this._pend[path]&&this.meses[d.id]) ? this.meses[d.id] : {...MES_DEF(),...clonar(d.data())};
          });
          /* meses recién creados acá que todavía no llegaron al servidor */
          for(const k in this.meses) if(this._pend["meses/"+k]&&!m[k]) m[k]=this.meses[k];
          const cambio=JSON.stringify(m)!==JSON.stringify(this.meses);
          this.meses=m; b=true;chk();
          if(this.listos&&cambio) App.pedirRender();
        },()=>{b=true;chk();});

        setTimeout(resolve,9000);
      });
    }else{ this.leerLocal(); }
  },

  /* compatibilidad con datos guardados por versiones anteriores */
  migrar(c){
    c.cats=(c.cats||[]).map(x=>({...x,subs:Array.isArray(x.subs)?x.subs:[]}));
    if(!c.cats.length) c.cats=CATS_DEF.map(x=>({...x,subs:[...x.subs]}));
    if(!Array.isArray(c.fuentes)||!c.fuentes.length) c.fuentes=[...FUENTES_DEF];
    if(!Array.isArray(c.instrumentos)||!c.instrumentos.length) c.instrumentos=[...INSTR_DEF];
    if(!Array.isArray(c.fijos)) c.fijos=[];
    /* el diccionario base se regenera siempre (así llegan sinónimos nuevos);
       lo que el usuario enseñó vive en `aprendidas` y pisa a lo base */
    if(!c.aprendidas||typeof c.aprendidas!=="object") c.aprendidas={};
    c.dicc={...diccionarioBase(c.cats),...c.aprendidas};
    return c;
  },

  leerLocal(){
    try{
      const c=localStorage.getItem("pdm_config");
      if(c) this.config=this.migrar({...CONFIG_DEF(),...JSON.parse(c)});
      const m=localStorage.getItem("pdm_meses");
      if(m) this.meses=JSON.parse(m)||{};
    }catch(e){}
  },
  guardarLocal(){
    try{
      localStorage.setItem("pdm_config",JSON.stringify(this.config));
      localStorage.setItem("pdm_meses",JSON.stringify(this.meses));
    }catch(e){}
  },

  /* una escritura por documento a la vez; el contenido se congela al encolar
     para que refleje exactamente el estado de ese momento */
  _pend:{},
  _escribir(path,data){
    if(!this.usaDb){this.guardarLocal();return Promise.resolve();}
    const payload=JSON.parse(JSON.stringify(data));
    this._pend[path]=(this._pend[path]||0)+1;
    const prev=this._colas[path]||Promise.resolve();
    const next=prev.catch(()=>{}).then(()=>this.db.doc(path).set(payload))
      .catch(err=>{
        const c=err&&err.code;
        if(c==="quota_exceeded") App.toast("No hay más espacio. Borrá meses viejos desde Ajustes.");
        else if(c==="revoked"||c==="not_granted") App.toast("Se perdió el acceso a los datos guardados.");
        else App.toast("No se pudo guardar. Probá de nuevo.");
        this.guardarLocal();
      })
      .finally(()=>{ this._pend[path]--; if(this._pend[path]<=0) delete this._pend[path]; });
    this._colas[path]=next; return next;
  },

  guardarConfig(){App.pedirRender();return this._escribir("config/general",this.config);},
  guardarMes(k){App.pedirRender();return this._escribir("meses/"+k,this.meses[k]);},
  mes(k){return this.meses[k]||null;},
  cat(id){return this.config.cats.find(c=>c.id===id)||null;},

  ensureMes(key){
    if(this.meses[key]) return this.meses[key];
    const m=MES_DEF();
    const previos=Object.keys(this.meses).filter(k=>k<key).sort();
    if(previos.length){
      const ult=this.meses[previos[previos.length-1]];
      m.presupuestos={...(ult.presupuestos||{})};
      m.presupuestosSub={};
      for(const c in (ult.presupuestosSub||{})) m.presupuestosSub[c]={...ult.presupuestosSub[c]};
      m.presupuestosIng={...(ult.presupuestosIng||{})};
    }
    let n=0;
    for(const f of (this.config.fijos||[])){
      m.gastos.push({id:uid(),fecha:key+"-01",monto:Number(f.monto)||0,cat:f.cat,concepto:f.concepto||"Fijo",fijo:true});
      n++;
    }
    this.meses[key]=m; this.guardarMes(key);
    if(n) App.toast("Mes preparado con "+n+" gasto"+(n===1?"":"s")+" fijo"+(n===1?"":"s")+".");
    return m;
  }
};

/* ============================ cálculos ============================ */

const calc={
  gastado(k){const m=store.mes(k);return m?m.gastos.reduce((s,g)=>s+(Number(g.monto)||0),0):0;},
  ingresos(k){const m=store.mes(k);return m?m.ingresos.reduce((s,g)=>s+(Number(g.monto)||0),0):0;},
  invertido(k){const m=store.mes(k);return m?m.inversiones.reduce((s,g)=>s+(Number(g.monto)||0),0):0;},
  /* tope de una subcategoría */
  topeSub(mes,catId,sub){
    if(!mes) return 0;
    return Number(((mes.presupuestosSub||{})[catId]||{})[sub])||0;
  },

  /* tope de una categoría: la suma de sus subcategorías cuando las tiene
     cargadas; si no, el tope suelto que se le haya puesto a la categoría */
  topeCat(mes,cat){
    if(!mes||!cat) return {monto:0,porSubs:false};
    if(cat.subs&&cat.subs.length){
      const suma=cat.subs.reduce((a,s)=>a+this.topeSub(mes,cat.id,s),0);
      if(suma>0) return {monto:suma,porSubs:true};
    }
    return {monto:Number((mes.presupuestos||{})[cat.id])||0,porSubs:false};
  },

  presupuesto(k){
    const m=store.mes(k); if(!m) return 0;
    let t=0;
    for(const c of store.config.cats) t+=this.topeCat(m,c).monto;
    /* categorías borradas que todavía tienen un tope guardado */
    for(const id in (m.presupuestos||{}))
      if(!store.cat(id)) t+=Number(m.presupuestos[id])||0;
    return t;
  },
  neto(k){return this.ingresos(k)-this.gastado(k)-this.invertido(k);},

  /* qué topes del mes siguen sin gasto, cuáles tienen saldo y cuáles se pasaron */
  alertas(key){
    const cats=this.porCategoria(key);
    const sinCargar=[], conSaldo=[], pasados=[];
    for(const c of store.config.cats){
      const b=cats[c.id]; if(!b) continue;
      const filas=b.porSubs
        ? b.lista.filter(x=>x.tope>0).map(x=>({cat:c,nombre:x.nombre,tope:x.tope,gastado:x.monto}))
        : (b.presup>0?[{cat:c,nombre:null,tope:b.presup,gastado:b.gastado}]:[]);
      for(const f of filas){
        const e=estadoTope(f.gastado,f.tope);
        if(f.gastado<=0) sinCargar.push(f);
        else if(e==="warn") conSaldo.push(f);
        else if(e==="crit") pasados.push(f);
        /* "completo" (dentro del 1 %) no es una alerta */
      }
    }
    /* ingresos esperados que todavía no entraron (o entraron de menos) */
    for(const f of this.porFuente(key)){
      if(!(f.esperado>0)) continue;
      const fila={cat:{nombre:"Ingreso",color:0},ing:true,nombre:f.nombre,tope:f.esperado,gastado:f.monto};
      if(f.monto<=0) sinCargar.push(fila); else if(f.monto<f.esperado*0.99) conSaldo.push(fila);
    }
    conSaldo.sort((a,b)=>(b.tope-b.gastado)-(a.tope-a.gastado));
    pasados.sort((a,b)=>(b.gastado-b.tope)-(a.gastado-a.tope));
    return {sinCargar,conSaldo,pasados};
  },

  /* gasto estimado a fin de mes: por cada categoría (o subcategoría, si los topes
     están ahí) lo mayor entre el tope y lo ya gastado */
  estimado(k){
    const cats=this.porCategoria(k); let t=0;
    for(const c of Object.values(cats)){
      if(c.porSubs) t+=c.lista.reduce((s,x)=>s+Math.max(x.tope||0,x.monto||0),0);
      else t+=Math.max(c.presup||0,c.gastado||0);
    }
    return t;
  },

  arrastre(k){
    if(!store.config.arrastre) return 0;
    return Object.keys(store.meses).filter(x=>x<k).sort().reduce((a,x)=>a+this.neto(x),0);
  },

  porCategoria(key){
    const m=store.mes(key), out={};
    for(const c of store.config.cats){
      const t=this.topeCat(m,c);
      out[c.id]={cat:c,gastado:0,presup:t.monto,porSubs:t.porSubs,conceptos:{}};
    }
    if(m) for(const g of m.gastos){
      let b=out[g.cat];
      if(!b) b=out[g.cat]={cat:{id:g.cat,nombre:"Sin categoría",color:11,subs:[]},
        gastado:0,presup:Number((m.presupuestos||{})[g.cat])||0,porSubs:false,conceptos:{}};
      const v=Number(g.monto)||0;
      b.gastado+=v;
      const cn=(g.concepto||"Sin detalle").trim();
      b.conceptos[cn]=(b.conceptos[cn]||0)+v;
    }

    for(const k in out){
      const c=out[k], subs=c.cat.subs||[];
      const gastadoPorSub={};
      for(const n in c.conceptos) gastadoPorSub[norm(n)]=(gastadoPorSub[norm(n)]||0)+c.conceptos[n];

      /* primero las subcategorías definidas (aunque estén en cero, si tienen tope) */
      const filas=[];
      for(const s of subs){
        const tope=this.topeSub(m,c.cat.id,s);
        const monto=gastadoPorSub[norm(s)]||0;
        if(tope>0||monto>0) filas.push({nombre:s,monto,tope,definida:true});
      }
      /* después lo que se cargó con un nombre que no está en la lista */
      const cubiertos=new Set(subs.map(s=>norm(s)));
      for(const n in c.conceptos)
        if(!cubiertos.has(norm(n))) filas.push({nombre:n,monto:c.conceptos[n],tope:0,definida:false});

      filas.sort((a,b)=> (b.monto-a.monto) || (b.tope-a.tope) || a.nombre.localeCompare(b.nombre));
      c.lista=filas;
      c.sinUsar=subs.filter(s=>!(gastadoPorSub[norm(s)]>0) && !(this.topeSub(m,c.cat.id,s)>0));
    }
    return out;
  },

  /* ingresos esperados por fuente (el "tope" de los ingresos) */
  ingEsperadoDe(mes,f){ return Number(((mes||{}).presupuestosIng||{})[f])||0; },
  ingEsperado(k){ const m=store.mes(k); if(!m) return 0; return Object.values(m.presupuestosIng||{}).reduce((s,v)=>s+(Number(v)||0),0); },
  /* ingreso estimado: por fuente, lo mayor entre lo esperado y lo ya cobrado */
  ingEstimado(k){ return this.porFuente(k).reduce((s,f)=>s+Math.max(f.esperado,f.monto),0); },

  porFuente(key){
    const m=store.mes(key); const acc={};
    for(const f of store.config.fuentes) acc[f]={nombre:f,monto:0,esperado:this.ingEsperadoDe(m,f),conceptos:{}};
    if(m) for(const i of m.ingresos){
      const f=(i.fuente||"Otros").trim();
      if(!acc[f]) acc[f]={nombre:f,monto:0,esperado:this.ingEsperadoDe(m,f),conceptos:{}};
      const v=Number(i.monto)||0; acc[f].monto+=v;
      const c=(i.concepto||f).trim(); acc[f].conceptos[c]=(acc[f].conceptos[c]||0)+v;
    }
    return Object.values(acc)
      .map(f=>({...f,lista:Object.entries(f.conceptos).map(([nombre,monto])=>({nombre,monto})).sort((a,b)=>b.monto-a.monto)}))
      .filter(x=>x.monto>0||x.esperado>0)
      .sort((a,b)=>(b.monto-a.monto)||(b.esperado-a.esperado));
  },

  ahorroAcumulado(){return Object.keys(store.meses).reduce((s,k)=>s+this.invertido(k),0);},
  porInstrumento(){
    const out={};
    for(const k of Object.keys(store.meses)) for(const i of store.meses[k].inversiones){
      const n=(i.instrumento||"Otro").trim(); out[n]=(out[n]||0)+(Number(i.monto)||0);
    }
    return Object.entries(out).map(([nombre,monto])=>({nombre,monto})).sort((a,b)=>b.monto-a.monto);
  },

  serie(key,n,fn){
    const out=[];
    for(let i=n-1;i>=0;i--){const k=keyMas(key,-i);out.push({key:k,mes:Number(k.split("-")[1]),valor:fn(k)});}
    return out;
  }
};

/* ============================ cartera (ahorro) ============================
   Operaciones encadenadas: pesos → dólares → cripto, y la vuelta. Cada posición
   arrastra su costo en pesos y en dólares para poder separar la ganancia
   "por la cripto" de la ganancia "por el dólar". */

const MONEDAS_DEF={BTC:"bitcoin",ETH:"ethereum",USDT:"tether",USDC:"usd-coin",SOL:"solana",BNB:"binancecoin",XRP:"ripple",
  ADA:"cardano",DOGE:"dogecoin",DOT:"polkadot",AVAX:"avalanche-2",LINK:"chainlink",LTC:"litecoin",TRX:"tron",DAI:"dai",
  POL:"polygon-ecosystem-token",MATIC:"matic-network",TON:"the-open-network",SHIB:"shiba-inu",ATOM:"cosmos",UNI:"uniswap",
  XLM:"stellar",BCH:"bitcoin-cash",NEAR:"near",ARB:"arbitrum",OP:"optimism",PEPE:"pepe",AAVE:"aave",SUI:"sui",APT:"aptos",
  HBAR:"hedera-hashgraph",FIL:"filecoin",ETC:"ethereum-classic",RENDER:"render-token",INJ:"injective-protocol"};
const TIPOS_OP={
  ars_usd:"Compré dólares con pesos", usd_cripto:"Compré cripto con dólares", cripto_usd:"Vendí cripto (a dólares)",
  usd_ars:"Vendí dólares (a pesos)", ars_pesos:"Plazo fijo / pesos guardados", pesos_ars:"Retiré pesos guardados"
};
const fmtUsd=new Intl.NumberFormat("es-AR",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2});
const fmtArsD=new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",minimumFractionDigits:2,maximumFractionDigits:2});
function usd(n){ return fmtUsd.format(Number(n)||0); }
/* precio unitario: monedas baratas necesitan más decimales (SHIB 0,00000582) */
function usdPrecio(n){ n=Number(n)||0; if(n>=1) return usd(n);
  const s=n.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:8}); return "US$ "+s; }
function moneyD(n){ return fmtArsD.format(Number(n)||0); }
function cantidad(n){ n=Number(n)||0; return n.toLocaleString("es-AR",{maximumFractionDigits:Math.abs(n)>=1?4:8}); }
function signo(n,f){ n=Number(n)||0; return (n>0?"+":n<0?"−":"")+f(Math.abs(n)); }
function pctSigno(n){ n=Number(n)||0; return (n>0?"+":n<0?"−":"")+pct(Math.abs(n)); }

const cartera={
  get d(){
    const c=store.config;
    if(!c.cartera||typeof c.cartera!=="object") c.cartera={};
    const k=c.cartera;
    if(!Array.isArray(k.ops)) k.ops=[];
    if(!k.monedas) k.monedas={};
    if(!k.dolar) k.dolar="cripto";
    return k;
  },
  precios:{cripto:{},dolar:null,dolarNombre:"",ts:0,error:null,cargando:false},
  idDe(sym){ sym=String(sym||"").toUpperCase().trim(); return this.d.monedas[sym]||MONEDAS_DEF[sym]||null; },
  cargarCache(){ try{ const p=JSON.parse(localStorage.getItem("bp_precios")||"null"); if(p&&p.cripto){ this.precios={...this.precios,...p,cargando:false}; } }catch(e){} },
  guardarCache(){ try{ const {cargando,...p}=this.precios; localStorage.setItem("bp_precios",JSON.stringify(p)); }catch(e){} },
  precioDe(sym){ const id=this.idDe(sym); const p=id?this.precios.cripto[id]:null; return p?p.usd:null; },
  /* variación del precio en un período: "24h" | "7d" | "30d" | "1y" */
  cambio(sym,per){
    const id=this.idDe(sym); const p=id?this.precios.cripto[id]:null; if(!p) return null;
    if(typeof p.ch==="number") return per==="24h"?p.ch:null;
    const v=p.ch&&p.ch[per||"24h"]; return typeof v==="number"&&isFinite(v)?v:null;
  },
  cambio24(sym){ return this.cambio(sym,"24h"); },
  opsOrdenadas(){ return this.d.ops.slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))||String(a.id).localeCompare(String(b.id))); },

  /* Recorre las operaciones en orden y arma las posiciones abiertas y las cerradas.
     Costo promedio ponderado; los dólares que compran cripto le pasan a la cripto su costo en pesos. */
  posiciones(){
    const P={usd:{cant:0,costoArs:0},cripto:{},pesos:{},cerradas:[],aportadoArs:0,retiradoArs:0,pendientes:[]};
    const cr=s=>P.cripto[s]||(P.cripto[s]={sym:s,cant:0,costoUsd:0,costoArs:0});
    for(const o of this.opsOrdenadas()){
      const ars=Number(o.ars)||0, u=Number(o.usd)||0, q=Number(o.cant)||0;
      switch(o.tipo){
        case "ars_usd":
          if(!(u>0)){ P.pendientes.push(o); P.aportadoArs+=ars; break; }
          P.usd.cant+=u; P.usd.costoArs+=ars; P.aportadoArs+=ars; break;
        case "usd_ars":{
          const prom=P.usd.cant>0?P.usd.costoArs/P.usd.cant:0, costo=prom*u;
          P.usd.cant-=u; P.usd.costoArs-=costo; P.retiradoArs+=ars;
          P.cerradas.push({op:o,det:`${cantidad(u)} US$ → pesos`,gananciaArs:ars-costo,base:costo}); break; }
        case "usd_cripto":{
          const c=cr(o.activo), prom=P.usd.cant>0?P.usd.costoArs/P.usd.cant:(o.tc?Number(o.tc):0), costoArs=prom*u;
          c.cant+=q; c.costoUsd+=u; c.costoArs+=costoArs;
          P.usd.cant-=u; P.usd.costoArs-=Math.min(costoArs,P.usd.costoArs); break; }
        case "cripto_usd":{
          const c=cr(o.activo);
          const promU=c.cant>0?c.costoUsd/c.cant:0, promA=c.cant>0?c.costoArs/c.cant:0;
          const costoU=promU*q, costoA=promA*q;
          c.cant-=q; c.costoUsd-=costoU; c.costoArs-=costoA;
          P.usd.cant+=u; P.usd.costoArs+=costoA; /* la ganancia en pesos se realiza recién al vender los dólares */
          P.cerradas.push({op:o,det:`${cantidad(q)} ${o.activo} → ${usd(u)}`,gananciaUsd:u-costoU,base:costoU,costoArs:costoA}); break; }
        case "ars_pesos":{
          const p=P.pesos[o.activo]||(P.pesos[o.activo]={nombre:o.activo,ars:0});
          p.ars+=ars; P.aportadoArs+=ars; break; }
        case "pesos_ars":{
          const p=P.pesos[o.activo]; if(p) p.ars-=ars; P.retiradoArs+=ars; break; }
      }
    }
    for(const s in P.cripto) if(P.cripto[s].cant<=1e-12) delete P.cripto[s];
    for(const s in P.pesos) if(P.pesos[s].ars<=0.5) delete P.pesos[s];
    if(P.usd.cant<1e-9){ P.usd.cant=0; P.usd.costoArs=0; }
    return P;
  },

  /* valuación a precios de hoy */
  valuar(P){
    const D=this.precios.dolar||null;
    const V={dolar:D,secciones:{},totalArs:0,totalUsd:0,costoArs:0,gananciaUsdCripto:0,sinPrecio:[]};
    const filas=[]; let crUsd=0,crCostoU=0,crCostoA=0,crVal=true;
    for(const s of Object.keys(P.cripto).sort()){
      const c=P.cripto[s], px=this.precioDe(s);
      if(px==null){ V.sinPrecio.push(s); crVal=false; }
      const valUsd=px!=null?c.cant*px:c.costoUsd;
      const f={...c,px,valUsd,ch:this.cambio24(s),chs:{"24h":this.cambio(s,"24h"),"7d":this.cambio(s,"7d"),"30d":this.cambio(s,"30d"),"1y":this.cambio(s,"1y")},
        ganUsd:px!=null?valUsd-c.costoUsd:null,
        valArs:D?valUsd*D:null, ganArs:D?valUsd*D-c.costoArs:null,
        ganFx:D?c.costoUsd*D-c.costoArs:null, ganCripto:(D&&px!=null)?(valUsd-c.costoUsd)*D:null};
      filas.push(f); crUsd+=valUsd; crCostoU+=c.costoUsd; crCostoA+=c.costoArs;
    }
    if(filas.length){
      V.secciones.cripto={nombre:"Cripto",filas,valUsd:crUsd,costoUsd:crCostoU,costoArs:crCostoA,valArs:D?crUsd*D:null,completo:crVal,
        ganUsd:crVal?crUsd-crCostoU:null,ganArs:(D&&crVal)?crUsd*D-crCostoA:null};
      V.gananciaUsdCripto=crVal?crUsd-crCostoU:0;
    }
    if(P.usd.cant>0||P.pendientes.length){
      const tc=P.usd.cant>0?P.usd.costoArs/P.usd.cant:0;
      V.secciones.usd={nombre:"Dólares",cant:P.usd.cant,costoArs:P.usd.costoArs,tcProm:tc,valUsd:P.usd.cant,
        valArs:D?P.usd.cant*D:null,ganArs:D?P.usd.cant*D-P.usd.costoArs:null,pendientes:P.pendientes};
    }
    const pes=Object.values(P.pesos);
    if(pes.length){ const t=pes.reduce((s,p)=>s+p.ars,0); V.secciones.pesos={nombre:"Pesos",filas:pes,valArs:t,valUsd:D?t/D:null}; }
    for(const k in V.secciones){ const s=V.secciones[k]; V.totalArs+=s.valArs||0; V.totalUsd+=s.valUsd||0; }
    V.costoArs=(V.secciones.cripto?V.secciones.cripto.costoArs:0)+(V.secciones.usd?V.secciones.usd.costoArs:0)+(V.secciones.pesos?V.secciones.pesos.valArs:0);
    V.ganArs=D?V.totalArs-V.costoArs:null;
    return V;
  },

  async actualizar(forzar){
    if(this.precios.cargando) return false;
    if(!forzar&&Date.now()-(this.precios.ts||0)<5*60*1000) return false;
    const P=this.posiciones();
    const ids=[...new Set(Object.keys(P.cripto).map(s=>this.idDe(s)).filter(Boolean))];
    this.precios.cargando=true;
    try{
      const [rc,rd]=await Promise.all([
        ids.length?fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids="+ids.join(",")+"&price_change_percentage=24h,7d,30d,1y&per_page=250"):Promise.resolve(null),
        fetch("https://dolarapi.com/v1/dolares/"+encodeURIComponent(this.d.dolar))
      ]);
      if(rc&&rc.ok){
        const arr=await rc.json();
        if(Array.isArray(arr)) for(const c of arr){
          const n=v=>typeof v==="number"&&isFinite(v)?v:null;
          this.precios.cripto[c.id]={usd:Number(c.current_price),ch:{"24h":n(c.price_change_percentage_24h_in_currency),"7d":n(c.price_change_percentage_7d_in_currency),"30d":n(c.price_change_percentage_30d_in_currency),"1y":n(c.price_change_percentage_1y_in_currency)}};
        }
      }
      if(rd&&rd.ok){ const j=await rd.json(); const v=Number(j.venta)||Number(j.compra); if(v>0){ this.precios.dolar=v; this.precios.dolarNombre=j.nombre||this.d.dolar; } }
      this.precios.ts=Date.now(); this.precios.error=null; this.guardarCache();
      this.registrarDia(); return true;
    }catch(e){ this.precios.error="sin conexión"; return false; }
    finally{ this.precios.cargando=false; }
  },
  /* guarda el valor de hoy (uno por día) para el gráfico de evolución */
  registrarDia(){
    try{
      const V=this.valuar(this.posiciones()); if(!(V.totalUsd>0)) return;
      const hoy=hoyISO(), hist=this.d.hist=(this.d.hist||[]);
      const p={d:hoy,usd:Math.round(V.totalUsd*100)/100,ars:Math.round(V.totalArs||0)};
      const i=hist.findIndex(x=>x.d===hoy); if(i>-1) hist[i]=p; else hist.push(p);
      if(hist.length>400) hist.splice(0,hist.length-400);
      store.guardarConfig();
    }catch(e){}
  },
  async buscarMoneda(q){
    try{
      const r=await fetch("https://api.coingecko.com/api/v3/search?query="+encodeURIComponent(q)); const j=await r.json();
      return (j.coins||[]).slice(0,6).map(c=>({id:c.id,sym:String(c.symbol||"").toUpperCase(),nombre:c.name}));
    }catch(e){ return []; }
  },
  hace(ts){ if(!ts) return "nunca"; const m=Math.round((Date.now()-ts)/60000); return m<1?"recién":m<60?`hace ${m} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} d`; }
};

  veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,

const MULT={mil:1000,miles:1000,luca:1000,lucas:1000,lucaso:1000,k:1000,gamba:100,gambas:100,palo:1e6,palos:1e6,
  millon:1e6,millones:1e6,melon:1e6,melones:1e6,palito:1e6,palitos:1e6,kilo:1000,kilos:1000};

const STOP=new Set(["de","en","para","por","del","la","el","los","las","un","una","unos","unas","al","gaste",
  "gastamos","gasto","pague","pagamos","compre","compramos","puse","me","se","fue","fui","que","y","con","sobre",
  "a","lo","le","mi","tipo","como","tambien","ademas","pesos","peso","mangos","guita","plata","total","aprox",
  "aproximadamente","mas","o","menos","salio","costo","valio","hoy","ayer","este","esta","cobre","cobramos",
  "pagaron","recibi","vendi","deposite","meti","saque","guarde","ahorre","inverti","pusimos","despues","luego"]);

const VERBOS_ARRANQUE=new Set(["gaste","gastamos","pague","pagamos","compre","compramos","puse","pusimos","guarde",
  "ahorre","ahorramos","inverti","invertimos","cobre","cobramos","entro","entraron","vendi","deposite","meti","recibi",
  "saque","pagaron","gasto","pago","compra","despues","luego","tambien","ademas"]);

const ING_RE=/\b(cobre|cobramos|ingreso|ingresaron|sueldo|aguinaldo|ganancias|ganancia|me pagaron|pagaron|entro|entraron|factura|honorarios|vendi|vendimos|deposito|depositaron|bono|freelance|changa)\b/;
const INV_RE=/\b(ahorre|ahorramos|inverti|inversion|guarde|plazo fijo|compre dolares|compre dolar|dolares|usd|cripto|bitcoin|usdt|cedear|cedears|acciones|fci|fondo comun|mep)\b/;

function parseMonedaAR(txt){
  const s=String(txt).replace(/[^\d.,]/g,"").trim(); if(!s) return null;
  let t;
  if(/^\d{1,3}(,\d{3})+$/.test(s)) t=s.replace(/,/g,"");
  else if(s.includes(",")) t=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) t=s.replace(/\./g,"");
  else t=s;
  const n=parseFloat(t); return isFinite(n)?n:null;
}
function aNumero(t){
  let s=String(t).replace(/[$\s]/g,""); if(!s) return null;
  if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  /* "779,000" (el dictado a veces separa miles con coma) → 779000 */
  if(/^\d{1,3}(,\d{3})+$/.test(s)) s=s.replace(/,/g,"");
  s=s.replace(/,/g,".");
  if(!/^\d+(\.\d+)?$/.test(s)) return null;
  const n=parseFloat(s); return isFinite(n)?n:null;
}
function evaluarNumero(tokens){
  let total=0,acc=0,vio=false;
  for(const t of tokens){
    if(t==="y") continue;
    if(t==="medio"||t==="media"){acc+=.5;vio=true;continue;}
    if(UNIDADES[t]!==undefined){acc+=UNIDADES[t];vio=true;continue;}
    if(MULT[t]!==undefined){const m=MULT[t]; if(acc===0)acc=1;
      if(m>=1000){total+=acc*m;acc=0;}else{acc*=m;} vio=true;continue;}
    const n=aNumero(t); if(n!==null){acc+=n;vio=true;}
  }
  return vio?total+acc:null;
}
function romper(tok){
  const m=/^([\d.,]+)\s*(k|lucas?|palos?|mil(?:es|lones?)?|millon(?:es)?|melones?|gambas?)$/i.exec(tok);
  return m?[m[1],norm(m[2])]:[tok];
}
function esTokenNumerico(t){
  return t==="y"||t==="medio"||t==="media"||UNIDADES[t]!==undefined||MULT[t]!==undefined||aNumero(t)!==null;
}

/** Busca categoría y subcategoría canónica para un texto libre. */
function buscarDestino(concepto){
  const n=norm(concepto);
  if(!n) return {cat:null,sub:null};

  // 1) coincide exactamente con una subcategoría existente
  for(const c of store.config.cats)
    for(const s of (c.subs||[])) if(norm(s)===n) return {cat:c.id,sub:s};
  // 2) alguna palabra coincide con una subcategoría
  const ws=n.split(" ");
  for(const c of store.config.cats)
    for(const s of (c.subs||[])){
      const ns=norm(s);
      if(ws.includes(ns)||(ns.length>=5&&n.includes(ns))) return {cat:c.id,sub:s};
    }
  // 2b) un alias de subcategoría ("mercado pago" → Tarjetas › Mercado Libre)
  for(const c of store.config.cats){ const s=subPorAlias(c.id,n); if(s) return {cat:c.id,sub:s}; }
  // 3) el nombre de una categoría
  for(const c of store.config.cats) if(n===norm(c.nombre)||ws.includes(norm(c.nombre))) return {cat:c.id,sub:subPorAlias(c.id,n)};
  // 4) diccionario de sinónimos y palabras aprendidas
  //    (solo vale si la categoría a la que apunta todavía existe)
  const d=store.config.dicc||{};
  const via=(k,w)=> store.cat(d[k]) ? {cat:d[k],sub:subCanonica(d[k],w||k)} : null;
  let r;
  if(d[n]&&(r=via(n))) return r;
  for(const w of ws){
    if(d[w]&&(r=via(w))) return r;
    if(w.endsWith("s")&&d[w.slice(0,-1)]&&(r=via(w.slice(0,-1),w))) return r;
    if(d[w+"s"]&&(r=via(w+"s",w))) return r;
  }
  for(const k in d) if(k.length>=5&&n.includes(k)&&(r=via(k))) return r;
  return {cat:null,sub:null};
}
/* otras formas de nombrar una subcategoría; sólo valen si esa subcategoría existe */
const ALIAS_SUB={"mercado pago":"Mercado Libre","mercadopago":"Mercado Libre","mercadolibre":"Mercado Libre","meli":"Mercado Libre",
  "master":"Mastercard","super":"Súper","supermercado":"Súper","chino":"Súper","verduleria":"Verdura","fruta":"Verdura",
  "carniceria":"Carne","pescaderia":"Pescado","gym":"Gimnasio","luz":"Edesur","electricidad":"Edesur","metrogas":"Gas",
  "natatorio":"Natación","pileta":"Natación","expensa":"Expensas","seguro del auto":"Seguro","cuota del auto":"Cuota"};
function subPorAlias(catId,texto){
  const c=store.cat(catId); if(!c||!c.subs) return null;
  const n=norm(texto);
  for(const k in ALIAS_SUB){
    if(n===k||n.split(" ").includes(k)||(k.length>=5&&n.includes(k))){
      const s=c.subs.find(x=>norm(x)===norm(ALIAS_SUB[k])); if(s) return s;
    }
  }
  return null;
}
function subCanonica(catId,palabra){
  const c=store.cat(catId); if(!c) return null;
  const n=norm(palabra);
  for(const s of (c.subs||[])) if(norm(s)===n||n.includes(norm(s))) return s;
  return subPorAlias(catId,palabra);
}

/** Interpreta una frase y devuelve borradores editables. */
function interpretar(frase){
  const crudo=String(frase||"").trim(); if(!crudo) return [];
  const base=normNum(crudo), plano=norm(crudo);
  const tipoGlobal=INV_RE.test(plano)?"inv":(ING_RE.test(plano)?"ing":"gasto");

  const NUMW=Object.keys(UNIDADES).join("|");
  /* el dictado de Android escribe "738 000" o "1 500 000" con espacios: se unen */
  const unido=base.replace(/\b(\d{1,3})((?: \d{3}){2,}|(?: 000)+)\b/g,(m,a,b)=>a+b.replace(/ /g,""));
  const prot=unido.replace(/(\d),(\d)/g,"$1\u0001$2")
    .replace(new RegExp("\\b("+NUMW+")\\s+y\\s+(?="+NUMW+"\\b)","g"),"$1\u0002");
  const segs=prot.split(/\s*[,;]\s*|\s+y\s+|\s+mas\s+|\s+ademas\s+/)
    .map(s=>s.replace(/\u0001/g,",").replace(/\u0002/g," y ").trim()).filter(Boolean);

  let multHeredado=null; const out=[], pend=[];
  const marcaDe=s=>INV_RE.test(s)?"inv":(ING_RE.test(s)?"ing":null);

  for(const seg of segs){
    const toks=seg.split(/\s+/).flatMap(romper).filter(Boolean);

    /* todos los bloques numéricos del tramo: dictado de corrido sin "y" ni comas
       ("259.970 de visa 46.566 de mastercard 327.018 de mercado pago") */
    const bloques=[];
    for(let i=0;i<toks.length;){
      if(esTokenNumerico(toks[i])&&toks[i]!=="y"){
        let j=i;
        while(j+1<toks.length&&esTokenNumerico(toks[j+1])){
          if(toks[j+1]==="y"&&!(j+2<toks.length&&esTokenNumerico(toks[j+2])&&toks[j+2]!=="y")) break;
          j++;
        }
        bloques.push([i,j]); i=j+1;
      } else i++;
    }
    if(!bloques.length) continue;

    /* cada monto se lleva las palabras que le siguen hasta el próximo monto; el primero
       se lleva además las que estaban antes ("gasté", "carne 50 lucas"). Los verbos que
       abren un ítem ("cobré", "puse", "gasté") van con el monto que les sigue, no con el anterior. */
    const regiones=bloques.map(([ini,fin],b)=>toks.slice(fin+1, b+1<bloques.length?bloques[b+1][0]:toks.length));
    regiones[0]=toks.slice(0,bloques[0][0]).concat(regiones[0]);
    for(let b=0;b+1<bloques.length;b++){
      const r=regiones[b], carry=[];
      while(r.length&&(VERBOS_ARRANQUE.has(r[r.length-1])||(r[r.length-1]==="me"&&carry.length))) carry.unshift(r.pop());
      if(carry.length) regiones[b+1]=carry.concat(regiones[b+1]);
    }

    for(let b=0;b<bloques.length;b++){
      const [ini,fin]=bloques[b];
      const numToks=toks.slice(ini,fin+1);
      let monto=evaluarNumero(numToks);
      if(monto===null||monto<=0) continue;

      const mult=numToks.map(t=>MULT[t]).filter(Boolean).sort((a,b)=>b-a)[0]||null;
      if(mult&&mult>=1000) multHeredado=mult;
      else if(multHeredado&&monto<1000) monto=monto*multHeredado;

      const region=regiones[b];
      const regionTxt=region.join(" ");
      const resto=region.map(t=>t.replace(/[.,$]/g,"")).filter(t=>t&&!STOP.has(t)&&!/^\d+$/.test(t));
      pend.push({monto,concepto:resto.join(" ").trim(),regionTxt,marca:marcaDe(regionTxt)});
    }
  }

  /* tipo de cada ítem: su propia marca ("cobré", "puse en plazo fijo"); si no tiene y algún
     otro ítem sí, es gasto; si ninguno tiene, manda la marca global de la frase */
  const algunoMarcado=pend.length>1&&pend.some(p=>p.marca);
  for(const p of pend){
    const tipo=p.marca||(algunoMarcado?"gasto":tipoGlobal);
    const item={id:uid(),tipo,monto:p.monto,concepto:titulizar(p.concepto),cat:null,fuente:null,instrumento:null,
      dudoso:false,recordar:false};
    if(tipo==="gasto"){
      const d=buscarDestino(p.concepto);
      if(d.cat){ item.cat=d.cat; if(d.sub) item.concepto=d.sub; }
      else { item.cat=(store.config.cats[store.config.cats.length-1]||{id:"otros"}).id; item.dudoso=true; item.recordar=true; }
      if(!item.concepto) item.concepto="Sin detalle";
    }else if(tipo==="ing"){
      item.fuente=buscarFuente(p.regionTxt)||(pend.length===1?buscarFuente(plano):null)||store.config.fuentes[0]||"Sueldo";
      if(!item.concepto) item.concepto=item.fuente;
    }else{
      item.instrumento=buscarInstrumento(p.regionTxt)||(pend.length===1?buscarInstrumento(plano):null)||"";
      if(!item.concepto) item.concepto="";
    }
    out.push(item);
  }
  return out;
}

function buscarFuente(seg){
  const n=norm(seg);
  for(const f of store.config.fuentes) if(n.includes(norm(f))) return f;
  if(/\bsueldo|aguinaldo|salario\b/.test(n)) return "Sueldo";
  if(/\bganancia|ganancias|rendimiento|interes|dividendo\b/.test(n)) return "Ganancias";
  return null;
}
function buscarInstrumento(seg){
  const n=norm(seg);
  const map=[["plazo fijo","Plazo fijo"],["dolar","Dólares"],["dolares","Dólares"],["usd","Dólares"],["mep","Dólares"],
    ["cripto","Cripto"],["bitcoin","Cripto"],["usdt","Cripto"],["cedear","Acciones / CEDEARs"],
    ["acciones","Acciones / CEDEARs"],["fci","Fondo común"],["fondo","Fondo común"]];
  for(const[k,v]of map) if(n.includes(k)) return v;
  return null;
}

/* ============================ bloqueo (huella / PIN) ============================
   Es una traba de pantalla por dispositivo: el PIN y la huella viven en este
   teléfono (localStorage), nunca en la base compartida. */

const lock={
  KEY:"bp_lock",
  intentos:0, hastaCuando:0,

  leer(){ try{ return JSON.parse(localStorage.getItem(this.KEY)||"null"); }catch(e){ return null; } },
  escribir(o){ try{ if(o) localStorage.setItem(this.KEY,JSON.stringify(o)); else localStorage.removeItem(this.KEY); }catch(e){} },
  activo(){ const c=this.leer(); return !!(c&&c.hash); },
  tieneHuella(){ const c=this.leer(); return !!(c&&c.cred); },

  rand(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return a; },
  b64(u8){ return btoa(String.fromCharCode(...u8)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  deb64(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); },

  async derivar(pin,saltB64){
    const enc=new TextEncoder();
    const key=await crypto.subtle.importKey("raw",enc.encode(String(pin)),"PBKDF2",false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:this.deb64(saltB64),iterations:120000},key,256);
    return this.b64(new Uint8Array(bits));
  },

  async configurarPin(pin){
    const prev=this.leer()||{};
    const salt=this.b64(this.rand(16));
    const hash=await this.derivar(pin,salt);
    this.escribir({...prev,salt,hash,creado:Date.now()});
  },
  async verificarPin(pin){
    const c=this.leer(); if(!c||!c.hash) return true;
    return (await this.derivar(pin,c.salt))===c.hash;
  },
  desactivar(){ this.escribir(null); },

  async huellaDisponible(){
    try{
      if(!window.PublicKeyCredential||!window.isSecureContext) return false;
      /* en algunos visores la consulta nunca responde: se le da 1,5 s */
      const r=await Promise.race([
        PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(),
        new Promise(res=>setTimeout(()=>res(false),1500))
      ]);
      return !!r;
    }catch(e){ return false; }
  },

  /* registra la huella del dispositivo como credencial de esta página */
  async registrarHuella(){
    const cred=await navigator.credentials.create({publicKey:{
      challenge:this.rand(32),
      rp:{name:"Balance Personal"},
      user:{id:this.rand(16),name:"vos",displayName:"Vos"},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"},
      timeout:60000, attestation:"none"
    }});
    const c=this.leer()||{};
    this.escribir({...c,cred:this.b64(new Uint8Array(cred.rawId))});
  },

  async pedirHuella(){
    const c=this.leer(); if(!c||!c.cred) throw new Error("sin huella");
    await navigator.credentials.get({publicKey:{
      challenge:this.rand(32),
      allowCredentials:[{type:"public-key",id:this.deb64(c.cred),transports:["internal"]}],
      userVerification:"required", timeout:60000
    }});
    return true;
  },

  /* mensaje humano para los errores del lector */
  explicar(e){
    const n=(e&&e.name)||"", m=String(e&&e.message||"");
    if(n==="NotAllowedError"&&/permission|policy|feature|iframe|cross-origin/i.test(m)) return "Este visor no deja usar la huella acá. Entrá con el PIN.";
    if(n==="NotAllowedError") return "Se canceló la lectura de la huella.";
    if(n==="SecurityError") return "Este visor no deja usar la huella acá. Entrá con el PIN.";
    if(n==="InvalidStateError") return "La huella ya estaba registrada en este dispositivo.";
    if(n==="NotSupportedError") return "Este dispositivo no tiene lector compatible.";
    return "No se pudo usar la huella. Entrá con el PIN.";
  }
};

  try{ App.toast("Error: "+msg); }catch(_){}
});

  toastAccion(m,etiqueta,fn){
    const t=$("#toast"); t.innerHTML=`${esc(m)} <button type="button" class="btn sm" style="margin-left:8px;background:var(--ground);color:var(--ink)">${esc(etiqueta)}</button>`;
    t.style.pointerEvents="auto"; t.classList.add("on"); clearTimeout(this._tt);
    t.querySelector("button").onclick=()=>{ t.classList.remove("on"); fn(); };
  },

  irMes(d){
    this.mes=keyMas(this.mes,d); this.abiertas={};
    if(!store.mes(this.mes)&&this.mes<=mesKey(new Date())) store.ensureMes(this.mes);
    this.render(); window.scrollTo({top:0,behavior:"smooth"});
  },

  pintarTabs(){
    const ICON={
      cargar:'<path d="M12 5v14M5 12h14"/>',
      movs:'<path d="M4 6h16M4 12h16M4 18h10"/>',
      resumen:'<path d="M4 19V9M10 19V5M16 19v-7M4 19h16"/>',
      ahorro:'<path d="M12 3v18M17 7.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2.2 2.7 5 3.2 5 1.3 5 3.3-2.2 3-5 3-5-1.1-5-3"/>',
      ajustes:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
    };
    ICON.alertas='<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/>';
    const L={cargar:"Cargar",resumen:"Resumen",ahorro:"Ahorro",alertas:"Alertas",ajustes:"Ajustes"};

      this.tab=b.dataset.tab; this.pintarTabs(); this.render();
