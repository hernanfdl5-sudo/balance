  filaBorrador(d,i){
    const cats=store.config.cats.map(c=>`<option value="${c.id}" ${c.id===d.cat?"selected":""}>${esc(c.nombre)}</option>`).join("");
    const cat=store.cat(d.cat);
    const subs=(cat&&cat.subs||[]).map(s=>`<option value="${esc(s)}"></option>`).join("");
    const fuentes=store.config.fuentes.map(f=>`<option value="${esc(f)}" ${f===d.fuente?"selected":""}>${esc(f)}</option>`).join("");
    const instr=store.config.instrumentos.map(n=>`<option value="${esc(n)}" ${n===d.instrumento?"selected":""}>${esc(n)}</option>`).join("");
    const tipos=[["gasto","Gasto"],["ing","Ingreso"],["inv","Ahorro"]]
      .map(([v,l])=>`<option value="${v}" ${v===d.tipo?"selected":""}>${l}</option>`).join("");

    return `<div class="draft ${d.dudoso?"warnrow":""}" data-i="${i}">
      <div class="l1">
        <input type="text" class="num" value="${money(d.monto)}" data-f="monto" inputmode="numeric"
               aria-label="Monto" style="max-width:132px;font-weight:700">
        <input type="text" value="${esc(d.concepto)}" data-f="concepto" list="subs-${i}"
               placeholder="${d.tipo==="gasto"?"Subcategoría":"Detalle"}" aria-label="Detalle">
        <datalist id="subs-${i}">${subs}</datalist>
        <button class="del" data-del="${i}" aria-label="Quitar">×</button>
      </div>
      <div class="row">
        <select data-f="tipo" aria-label="Tipo">${tipos}</select>
        ${d.tipo==="gasto"?`<select data-f="cat" aria-label="Categoría">${cats}</select>`
          :d.tipo==="ing"?`<select data-f="fuente" aria-label="Fuente">${fuentes}</select>`
          :`<select data-f="instrumento" aria-label="Instrumento">${instr}</select>`}
      </div>
      ${d.tipo==="gasto"?`<label style="display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--ink-2);font-weight:500">
        <input type="checkbox" data-f="recordar" ${d.recordar?"checked":""} style="width:auto;margin:0">
        Recordar que “${esc(d.concepto||"esto")}” va en ${esc(cat?cat.nombre:"")}</label>`:""}
    </div>`;
  },

  bloqueMovimientos(){
    const m=store.mes(this.mes), todos=[];
    if(m){
      m.gastos.forEach(g=>todos.push({...g,_t:"gasto"}));
      m.ingresos.forEach(g=>todos.push({...g,_t:"ing"}));
      m.inversiones.forEach(g=>todos.push({...g,_t:"inv"}));
    }
    todos.sort((a,b)=>String(b.fecha||"").localeCompare(String(a.fecha||""))||String(b.id).localeCompare(String(a.id)));

    const f=this.filtroMov||"todos";
    const movs=f==="todos"?todos:todos.filter(x=>x._t===f);
    const cuenta=t=>todos.filter(x=>x._t===t).length;
    const total=movs.reduce((s,x)=>s+(Number(x.monto)||0),0);
    const nombreF={todos:"Todos",gasto:"Gastos",ing:"Ingresos",inv:"Ahorro"};

    let h=`<section class="card"><div class="sechead"><h2 class="sec">Movimientos del mes</h2>
      <span class="eyebrow">${movs.length}${f==="todos"?"":" de "+todos.length}</span></div>
      <div class="segs" role="tablist" style="margin-bottom:12px">
        <button role="tab" data-fmov="todos" aria-selected="${f==="todos"}">Todos</button>
        <button role="tab" data-fmov="gasto" aria-selected="${f==="gasto"}">Gastos${cuenta("gasto")?` <small>${cuenta("gasto")}</small>`:""}</button>
        <button role="tab" data-fmov="ing" aria-selected="${f==="ing"}">Ingresos${cuenta("ing")?` <small>${cuenta("ing")}</small>`:""}</button>
        <button role="tab" data-fmov="inv" aria-selected="${f==="inv"}">Ahorro${cuenta("inv")?` <small>${cuenta("inv")}</small>`:""}</button>
      </div>`;
    if(!todos.length){
      h+=`<div class="empty"><b>Todavía no cargaste nada</b>Dictá o escribí tu primer gasto arriba y aparece acá.</div>`;
    }else if(!movs.length){
      h+=`<div class="empty"><b>Sin ${nombreF[f].toLowerCase()} este mes</b>Cargá uno desde el bloque de arriba.</div>`;
    }else{
      h+=`<div class="movs">`+movs.map(mv=>{
        const c=store.cat(mv.cat);
        const color=mv._t==="gasto"?(c?colorDe(c.color):"var(--c12)"):mv._t==="ing"?"var(--good)":"var(--brand)";
        const sub=mv._t==="gasto"?(c?c.nombre:"Sin categoría")
          :mv._t==="ing"?("Ingreso · "+(mv.fuente||"Sin fuente")):("Ahorro · "+(mv.instrumento||"Sin destino"));
        const chips=(mv.fijo?`<span class="chip">fijo</span>`:"")+(mv.cuotaId?`<span class="chip">cuota ${mv.cuotaN}/${mv.cuotaTot}</span>`:"");
        return `<button type="button" class="mov" data-edit="${mv._t}:${mv.id}">
          <span class="bar" style="background:${color}"></span>
          <span class="txt"><b>${esc(mv.concepto||"—")}${chips}</b><span>${esc(sub)} · ${esc(fechaCorta(mv.fecha))}</span></span>
          <span class="amt num ${mv._t==="ing"?"in":""}">${mv._t==="ing"?"+":""}${money(mv.monto)}</span></button>`;
      }).join("")+`</div>`;
    }
    if(movs.length) h+=`<div class="tot"><span>Total ${f==="todos"?"del mes":nombreF[f].toLowerCase()}</span><b class="num">${money(total)}</b></div>`;
    return h+`</section>`;
  },

  /* --------------------------------------------------------------- RESUMEN */
  vistaResumen(){
    const key=this.mes;
    const ing=calc.ingresos(key),gas=calc.gastado(key),inv=calc.invertido(key);
    const arr=calc.arrastre(key),neto=ing-gas-inv,final=neto+arr;
    const acc=final>=0?"var(--good-ink)":"var(--crit-ink)";

    let h=`<section class="hero" style="--hero-accent:${acc}">
      <div class="lbl">${final>=0?"Te sobró":"Estás en rojo por"}</div>
      <div class="big num">${money(Math.abs(final))}</div>
      <div class="sub">${store.config.arrastre&&arr!==0
        ? `${money(neto)} de este mes ${arr>=0?"+":"−"} ${money(Math.abs(arr))} que venías arrastrando`
        : `Ingresos menos gastos y ahorro de ${MESES[Number(key.split("-")[1])-1].toLowerCase()}`}</div>
      <div class="miniflow">
        <div><span class="k">Ingresos</span><span class="v num" style="color:var(--good-ink)">${money(ing)}</span></div>
        <div><span class="k">Gastos</span><span class="v num">${money(gas)}</span></div>
        <div><span class="k">Ahorro</span><span class="v num" style="color:var(--brand-ink)">${money(inv)}</span></div>
      </div></section>

      <div class="segs" role="tablist">
        <button role="tab" data-sub="egresos" aria-selected="${this.sub==="egresos"}">Egresos</button>
        <button role="tab" data-sub="ingresos" aria-selected="${this.sub==="ingresos"}">Ingresos</button>
      </div>`;

    return h + (this.sub==="egresos"?this.panelEgresos(key):this.panelIngresos(key));
  },

  panelEgresos(key){
    const gas=calc.gastado(key),presup=calc.presupuesto(key);
    const cats=calc.porCategoria(key);
    /* todas las categorías creadas, siempre: con gasto primero, después con tope, después el resto */
    const ordenCfg=Object.fromEntries(store.config.cats.map((c,i)=>[c.id,i]));
    const lista=Object.values(cats).sort((a,b)=>(b.gastado-a.gastado)||(b.presup-a.presup)||((ordenCfg[a.cat.id]??99)-(ordenCfg[b.cat.id]??99)));
    const conGasto=lista.filter(c=>c.gastado>0);

    const ve=this.vistaEgr||"detalle";
    let h=`<div class="segs mini" role="tablist" style="margin-top:-4px">
      <button role="tab" data-vegr="detalle" aria-selected="${ve==="detalle"}">Detalle</button>
      <button role="tab" data-vegr="torta" aria-selected="${ve==="torta"}">Proyectado vs real</button>
    </div>`;
    if(ve==="torta") return h+this.panelProyectadoReal(key,lista,gas,presup);

    if(conGasto.length){
      const items=conGasto.map(c=>({id:c.cat.id,nombre:c.cat.nombre,monto:c.gastado,color:colorDe(c.cat.color)}));
      h+=`<section class="card">
        <div class="sechead"><h2 class="sec">En qué se fue</h2>
          <span class="eyebrow">${conGasto.length} categoría${conGasto.length===1?"":"s"}</span></div>
        ${this.donut(items,gas,"Gastado",money(gas),MESES[Number(key.split("-")[1])-1])}
        <p class="hint" style="text-align:center;margin:2px 0 0">Tocá una porción para abrir el desglose.</p>
      </section>`;
    }

    if(presup>0){
      const p=gas/presup*100, est=p>100?"crit":(p>=85?"warn":"ok");
      h+=`<section class="card">
        <div class="sechead"><h2 class="sec">Presupuesto del mes</h2>
          <span class="eyebrow num">${money(gas)} de ${money(presup)}</span></div>
        <div class="meter" style="height:13px;margin-top:0">
          <i style="width:${Math.min(p,100)}%;background:${est==="crit"?"var(--crit)":est==="warn"?"var(--warn)":"var(--brand)"}"></i></div>
        <span class="metertag tag-${est}">${pct(p)} usado${p>100?` · ${money(gas-presup)} de más`:` · te quedan ${money(presup-gas)}`}</span>
      </section>`;
    }

    h+=`<section class="card">
      <div class="sechead"><h2 class="sec">Categorías</h2>
        <button class="btn out sm" data-irpresup="1">Presupuestos</button></div>
      ${!gas&&!presup?`<p class="hint" style="margin:-4px 0 10px">Todavía no hay gastos ni topes este mes. Cargá desde <b>Cargar</b> o poné los presupuestos.</p>`:""}
      <div class="catlist">${lista.map(c=>this.filaCategoria(c,gas)).join("")}</div>
      <div class="tot"><span>Total gastado</span><b class="num">${money(gas)}</b></div></section>`;

    const serie=calc.serie(key,6,k=>calc.gastado(k));
    if(serie.some(s=>s.valor>0)){
      h+=`<section class="card"><div class="sechead"><h2 class="sec">Gasto por mes</h2>
        <span class="eyebrow">últimos 6</span></div>${this.barrasVerticales(serie,key,"var(--c2)")}</section>`;
    }
    return h;
  },

  /* dos tortas con los mismos colores: cómo pensabas repartir la plata y cómo la repartiste */
  panelProyectadoReal(key,lista,gas,presup){
    const mesN=MESES[Number(key.split("-")[1])-1];
    const orden=lista.slice().sort((a,b)=>(b.presup||b.gastado)-(a.presup||a.gastado));
    const proy=orden.filter(c=>c.presup>0).map(c=>({id:c.cat.id,nombre:c.cat.nombre,monto:c.presup,color:colorDe(c.cat.color)}));
    const real=orden.filter(c=>c.gastado>0).map(c=>({id:c.cat.id,nombre:c.cat.nombre,monto:c.gastado,color:colorDe(c.cat.color)}));

    let h=`<section class="card">
      <div class="sechead"><h2 class="sec">Proyectado vs real</h2><span class="eyebrow">${mesN}</span></div>`;
    if(!proy.length){
      h+=`<div class="empty"><b>Todavía no proyectaste nada</b>Ponele topes a las categorías y acá vas a ver cómo pensabas repartir la plata al lado de cómo la repartiste.</div>
        <button class="btn pri full" data-irpresup="1">Poner presupuestos del mes</button>`;
    }else{
      const dif=gas-presup;
      h+=`<div class="dosdonuts">
        <div>${this.donut(proy,presup,"Proyectado",money(presup),"")}<div class="cap">Proyectado</div></div>
        <div>${real.length?this.donut(real,gas,"Real",money(gas),""):`<div class="donutwrap" style="aspect-ratio:1;display:grid;place-items:center;color:var(--ink-3);font-size:12px;text-align:center">Sin gastos<br>todavía</div>`}<div class="cap">Real</div></div>
      </div>
      <span class="metertag tag-${dif>0?"crit":dif<0?"ok":"none"}" style="margin-top:12px">
        ${dif>0?`Vas ${money(dif)} por encima de lo proyectado`:dif<0?`Vas ${money(-dif)} por debajo de lo proyectado`:"Justo en lo proyectado"}
        ${presup>0?` · ${pct(gas/presup*100)}`:""}</span>`;
    }

    h+=`<div class="cmp">
      <span class="hd">Categoría</span><span class="hd">Proy.</span><span class="hd">Real</span><span class="hd">Dif.</span>`;
    for(const c of orden){
      const d=c.gastado-c.presup;
      const cls=c.presup>0?(d>0?"crit":"ok"):"none";
      const txt=c.presup>0?((d>0?"+":"−")+moneyShort(Math.abs(d))):"—";
      h+=`<button type="button" class="nm" data-cat="${esc(c.cat.id)}" style="text-align:left;padding:0">
          <i class="dot" style="background:${colorDe(c.cat.color)}"></i><b>${esc(c.cat.nombre)}</b></button>
        <span class="n num">${c.presup>0?moneyShort(c.presup):"—"}</span>
        <span class="n num">${c.gastado>0?moneyShort(c.gastado):"—"}</span>
        <span class="d num ${cls}">${txt}</span>`;
    }
    const dt=gas-presup;
    h+=`<span class="tt">Total</span><span class="tt n num">${moneyShort(presup)}</span><span class="tt n num">${moneyShort(gas)}</span>
        <span class="tt d num ${presup>0?(dt>0?"crit":"ok"):"none"}">${presup>0?((dt>0?"+":"−")+moneyShort(Math.abs(dt))):"—"}</span>
      </div>
      <p class="hint" style="margin:12px 0 0">Los montos están abreviados (k = mil, M = millón). Tocá una categoría para ver el detalle completo.</p>
    </section>`;
    return h;
  },

  filaCategoria(c,totalMes){
    const abierta=!!this.abiertas[c.cat.id], color=colorDe(c.cat.color);
    const p=c.presup>0?c.gastado/c.presup*100:null;
    const est=p===null?"none":(p>100?"crit":p>=85?"warn":"ok");
    const fill=p===null?color:(est==="crit"?"var(--crit)":est==="warn"?"var(--warn)":color);
    const share=totalMes>0?c.gastado/totalMes*100:0;

    const tag = p===null ? `<span class="metertag tag-none">Sin presupuesto</span>`
      : p>100 ? `<span class="metertag tag-crit">${pct(p)} · ${money(c.gastado-c.presup)} de más</span>`
      : `<span class="metertag tag-${est}">${pct(p)} · te quedan ${money(c.presup-c.gastado)}</span>`;

    let subs="";
    if(abierta){
      let cuerpo="";
      if(c.lista.length){
        const maxGasto=Math.max(...c.lista.map(s=>s.monto),1);
        cuerpo=c.lista.map((s,i)=>{
          if(s.tope>0){
            const sp=s.monto/s.tope*100;
            const sest=sp>100?"crit":sp>=85?"warn":"ok";
            const sfill=sest==="crit"?"var(--crit)":sest==="warn"?"var(--warn)":color;
            return `<div class="subrow">
              <div class="top"><span>${esc(s.nombre)}</span>
                <span class="num">${money(s.monto)}<em>de ${money(s.tope)}</em></span></div>
              <div class="subbar"><i style="width:${Math.min(sp,100)}%;background:${sfill}"></i></div>
              <div class="subtag ${sest}">${pct(sp)}${sp>100?` · ${money(s.monto-s.tope)} de más`
                :` · te quedan ${money(s.tope-s.monto)}`}</div></div>`;
          }
          return `<div class="subrow">
            <div class="top"><span>${esc(s.nombre)}${s.definida?"":`<i class="libre" title="No está en la lista de subcategorías">libre</i>`}</span>
              <span class="num">${money(s.monto)}<em>${c.gastado>0?pct(s.monto/c.gastado*100):""}</em></span></div>
            <div class="subbar"><i style="width:${Math.max(s.monto/maxGasto*100,3)}%;background:${color};opacity:${Math.max(1-i*.12,.4)}"></i></div>
          </div>`;
        }).join("");
      }else{
        cuerpo=`<div class="hint">Sin gastos cargados en esta categoría.</div>`;
      }
      if(c.porSubs)
        cuerpo+=`<div class="sinusar">El tope de ${esc(c.cat.nombre)} (${money(c.presup)}) es la suma de estas subcategorías.</div>`;
      if(c.sinUsar&&c.sinUsar.length)
        cuerpo+=`<div class="sinusar">Sin tope ni gastos: ${c.sinUsar.map(esc).join(" · ")}</div>`;
      subs=`<div class="subs">${cuerpo}</div>`;
    }

    return `<div class="catrow ${abierta?"open":""}">
      <button type="button" class="cathead" data-cat="${esc(c.cat.id)}" aria-expanded="${abierta}">
        <span class="catname"><i class="dot" style="background:${color}"></i><b>${esc(c.cat.nombre)}</b></span>
        <span class="catnums"><span class="a num">${money(c.gastado)}</span>
          <span class="b num">${c.gastado>0?pct(share)+" del mes":"sin gastos"}</span></span>
      </button>
      <div class="meter"><i style="width:${p===null?0:Math.min(p,100)}%;background:${fill}"></i></div>
      ${tag}${subs}</div>`;
  },

  panelIngresos(key){
    const m=store.mes(key), ing=calc.ingresos(key), fuentes=calc.porFuente(key);
    if(!ing){
      return `<section class="card"><div class="empty"><b>Sin ingresos cargados</b>
        Cargá tu sueldo o lo que te haya entrado este mes.</div>
        <button class="btn pri full" data-nuevo="ing">+ Cargar ingreso</button></section>`;
    }

    const items=fuentes.map((f,i)=>({id:null,nombre:f.nombre,monto:f.monto,color:colorDe(i)}));
    let h=`<section class="card">
      <div class="sechead"><h2 class="sec">De dónde vino</h2>
        <span class="eyebrow">${fuentes.length} fuente${fuentes.length===1?"":"s"}</span></div>
      ${this.donut(items,ing,"Ingresó",money(ing),MESES[Number(key.split("-")[1])-1])}
      <div class="catlist" style="margin-top:8px">`
      + fuentes.map((f,i)=>`<div class="catrow">
          <div class="cathead">
            <span class="catname"><i class="dot" style="background:${colorDe(i)}"></i><b>${esc(f.nombre)}</b></span>
            <span class="catnums"><span class="a num">${money(f.monto)}</span>
              <span class="b num">${pct(f.monto/ing*100)}</span></span></div>
          <div class="meter"><i style="width:${f.monto/fuentes[0].monto*100}%;background:${colorDe(i)}"></i></div>
        </div>`).join("")
      + `</div><div class="tot"><span>Total ingresado</span><b class="num" style="color:var(--good-ink)">${money(ing)}</b></div></section>`;

    h+=`<section class="card"><div class="sechead"><h2 class="sec">Movimientos</h2>
      <span class="eyebrow">${m.ingresos.length}</span></div><div class="movs">`
      + m.ingresos.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))).map(i=>
        `<button type="button" class="mov" data-edit="ing:${i.id}">
          <span class="bar" style="background:var(--good)"></span>
          <span class="txt"><b>${esc(i.concepto||i.fuente||"Ingreso")}</b>
            <span>${esc(i.fuente||"Sin fuente")} · ${esc(fechaCorta(i.fecha))}</span></span>
          <span class="amt num in">+${money(i.monto)}</span></button>`).join("")
      + `</div><button class="btn pri full" data-nuevo="ing" style="margin-top:12px">+ Cargar ingreso</button></section>`;

    const serie=calc.serie(key,6,k=>calc.ingresos(k));
    if(serie.filter(s=>s.valor>0).length>1){
      h+=`<section class="card"><div class="sechead"><h2 class="sec">Ingresos por mes</h2>
        <span class="eyebrow">últimos 6</span></div>${this.barrasVerticales(serie,key,"var(--good)")}</section>`;
    }
    return h;
  },

  /* ---------------------------------------------------------------- AHORRO */
  vistaAhorro(){
    const key=this.mes, mesInv=calc.invertido(key), acum=calc.ahorroAcumulado();
    const instr=calc.porInstrumento(), serie=calc.serie(key,12,k=>calc.invertido(k));
    const ing=calc.ingresos(key), tasa=ing>0?mesInv/ing*100:null;

    let h=`<section class="hero" style="--hero-accent:var(--brand-ink)">
      <div class="lbl">Ahorraste este mes</div>
      <div class="big num">${money(mesInv)}</div>
      <div class="sub">${tasa!==null?`${pct(tasa)} de tus ingresos de ${MESES[Number(key.split("-")[1])-1].toLowerCase()}`
        :"Cargá tus ingresos para ver qué porcentaje representa"}</div>
      <div class="miniflow">
        <div><span class="k">Acumulado</span><span class="v num">${money(acum)}</span></div>
        <div><span class="k">Destinos</span><span class="v num">${instr.length}</span></div>
        <div><span class="k">Promedio</span><span class="v num">${money(this.promedioAhorro())}</span></div>
      </div></section>`;

    if(serie.some(s=>s.valor>0))
      h+=`<section class="card"><div class="sechead"><h2 class="sec">Ahorro mes a mes</h2>
        <span class="eyebrow">últimos 12</span></div>${this.barrasVerticales(serie,key,"var(--brand)")}</section>`;

    if(instr.length){
      const tot=instr.reduce((s,i)=>s+i.monto,0);
      const items=instr.map((s,i)=>({id:null,nombre:s.nombre,monto:s.monto,color:colorDe(i)}));
      h+=`<section class="card"><div class="sechead"><h2 class="sec">Dónde está la plata</h2>
          <span class="eyebrow">acumulado</span></div>
        ${this.donut(items,tot,"Ahorrado",money(tot),"desde el inicio")}
        <div class="catlist" style="margin-top:8px">`
        + instr.map((s,i)=>`<div class="catrow"><div class="cathead">
            <span class="catname"><i class="dot" style="background:${colorDe(i)}"></i><b>${esc(s.nombre)}</b></span>
            <span class="catnums"><span class="a num">${money(s.monto)}</span>
              <span class="b num">${pct(s.monto/tot*100)}</span></span></div>
          <div class="meter"><i style="width:${s.monto/instr[0].monto*100}%;background:${colorDe(i)}"></i></div>
        </div>`).join("")+`</div></section>`;
    }

    const m=store.mes(key);
    h+=`<section class="card"><div class="sechead"><h2 class="sec">Movimientos de ahorro</h2>
      <span class="eyebrow">${MESES[Number(key.split("-")[1])-1]}</span></div>`;
    h += (!m||!m.inversiones.length)
      ? `<div class="empty"><b>Nada guardado este mes</b>Cargá lo que apartaste y en qué lo pusiste.</div>`
      : `<div class="movs">`+m.inversiones.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))).map(i=>
          `<button type="button" class="mov" data-edit="inv:${i.id}">
            <span class="bar" style="background:var(--brand)"></span>
            <span class="txt"><b>${esc(i.instrumento||"Sin destino")}</b>
              <span>${esc(i.concepto||"")}${i.concepto?" · ":""}${esc(fechaCorta(i.fecha))}</span></span>
            <span class="amt num">${money(i.monto)}</span></button>`).join("")+`</div>`;
    return h+`<button class="btn pri full" data-nuevo="inv" style="margin-top:12px">+ Cargar ahorro</button></section>`;
  },

  promedioAhorro(){
    const con=Object.keys(store.meses).filter(k=>calc.invertido(k)>0||calc.gastado(k)>0);
    return con.length?calc.ahorroAcumulado()/con.length:0;
  },

  /* --------------------------------------------------------------- AJUSTES */
  vistaAjustes(){
    const c=store.config, m=store.mes(this.mes)||MES_DEF();
    const base=diccionarioBase(c.cats);
    const propios=Object.entries(c.aprendidas||{});

    return `
    <section class="card" style="display:flex;flex-direction:column;gap:11px">
      <div class="sechead" style="margin:0"><h2 class="sec">Ajustes</h2></div>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:500;cursor:pointer">

        <span>Arrastrar el saldo al mes siguiente
          <span style="display:block;font-size:12px;color:var(--ink-3);font-weight:400;margin-top:2px">
            Lo que te sobra o debés se suma al resultado del mes que sigue.</span></span></label>
      <div style="font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:11px">
        ${store.usaDb?"Tus datos se guardan en tu cuenta y te siguen entre dispositivos."
                     :"Tus datos se guardan en este teléfono. Hacé un respaldo de vez en cuando."}</div>

    <details class="set"><summary>Bloqueo con huella o PIN
      <span class="eyebrow">${lock.activo()?"activo":"apagado"}</span></summary>
      <div class="body">
        ${lock.activo()?`
          <p class="hint">Al abrir la app, o al volver después de 2 minutos en segundo plano, pide ${lock.tieneHuella()?"la huella (o el PIN)":"el PIN"}.
            Vale para este dispositivo.</p>
          ${lock.tieneHuella()?`<div class="kv"><span class="g">Huella registrada en este dispositivo</span></div>`
            :`<button class="btn out sm" id="regHuella">Registrar huella</button>`}
          <div class="row">
            <button class="btn out sm" id="cambiarPin">Cambiar PIN</button>
            <button class="btn dan sm" id="desactivarLock">Desactivar</button>
          </div>`
        :`
          <p class="hint">Para que nadie que agarre tu celular vea tus cuentas. Elegís un PIN y, si el celular lo permite, usás la huella para entrar.</p>
          <button class="btn pri sm" id="activarLock">Activar bloqueo</button>`}
      </div></details>

    <details class="set" id="setPresup"><summary>Presupuestos de ${MESES[Number(this.mes.split("-")[1])-1]}
      <span class="eyebrow num">${money(calc.presupuesto(this.mes))}</span></summary>
      <div class="body">
        <p class="hint">Lo que pensás gastar. En las categorías con subcategorías el tope va en cada una,
          y la categoría es la suma.</p>
        ${c.cats.map(cat=>{
          const tiene=cat.subs&&cat.subs.length;
          if(!tiene) return `<div class="pgrupo">
            <div class="psub"><span><i class="dot" style="background:${colorDe(cat.color)}"></i>
              <b style="font-weight:600;margin-left:7px">${esc(cat.nombre)}</b></span>
              <input type="text" class="num" data-presup-cat="${esc(cat.id)}" inputmode="numeric"
                value="${(m.presupuestos&&m.presupuestos[cat.id])?money(m.presupuestos[cat.id]):""}"
                placeholder="Sin tope" aria-label="Tope de ${esc(cat.nombre)}"></div></div>`;
          const t=calc.topeCat(m,cat);
          return `<div class="pgrupo" data-grupo="${esc(cat.id)}">
            <div class="phead"><b><i class="dot" style="background:${colorDe(cat.color)}"></i>${esc(cat.nombre)}</b>
              <span class="tt"><small>Total</small><span class="num" data-total="${esc(cat.id)}">${money(t.monto)}</span></span></div>
            ${cat.subs.map(s=>{
              const v=calc.topeSub(m,cat.id,s);
              return `<div class="psub"><span>${esc(s)}</span>
                <input type="text" class="num" data-presup-sub="${esc(cat.id)}" data-sub="${esc(s)}"
                  inputmode="numeric" value="${v?money(v):""}" placeholder="Sin tope"
                  aria-label="Tope de ${esc(s)}"></div>`;
            }).join("")}
          </div>`;
        }).join("")}
        <button class="btn pri" id="guardarPresup">Guardar presupuestos</button>
        <button class="btn out sm" id="copiarPresup">Copiar los del mes anterior</button>
      </div></details>

    <details class="set"><summary>Categorías y subcategorías <span class="eyebrow">${c.cats.length}</span></summary>
      <div class="body">
        <p class="hint">Tocá el lápiz para cambiarle el nombre, el color y sus subcategorías.</p>
        <div class="kvlist">${c.cats.map(cat=>`
          <div class="kv"><i class="dot" style="background:${colorDe(cat.color)}"></i>
            <span class="g">${esc(cat.nombre)}
              <small>${(cat.subs&&cat.subs.length)?cat.subs.map(esc).join(" · "):"sin subcategorías"}</small></span>
            <button class="x" data-edcat="${esc(cat.id)}" aria-label="Editar ${esc(cat.nombre)}">✎</button>
            <button class="x d" data-delcat="${esc(cat.id)}" aria-label="Borrar ${esc(cat.nombre)}">×</button>
          </div>`).join("")}</div>
        <button class="btn pri sm" id="addCat">+ Nueva categoría</button>
      </div></details>

    <details class="set"><summary>Fuentes de ingreso <span class="eyebrow">${c.fuentes.length}</span></summary>
      <div class="body">
        <p class="hint">De dónde te entra la plata. Es lo que desglosa la pestaña Ingresos.</p>
        <div class="kvlist">${c.fuentes.map((f,i)=>`
          <div class="kv"><span class="g">${esc(f)}</span>
            <button class="x" data-edfuente="${i}" aria-label="Renombrar">✎</button>
            <button class="x d" data-delfuente="${i}" aria-label="Quitar">×</button></div>`).join("")}</div>
        <button class="btn out sm" id="addFuente">+ Nueva fuente</button>
      </div></details>

    <details class="set"><summary>Destinos de ahorro <span class="eyebrow">${c.instrumentos.length}</span></summary>
      <div class="body">
        <div class="kvlist">${c.instrumentos.map((f,i)=>`
          <div class="kv"><span class="g">${esc(f)}</span>
            <button class="x" data-edinstr="${i}" aria-label="Renombrar">✎</button>
            <button class="x d" data-delinstr="${i}" aria-label="Quitar">×</button></div>`).join("")}</div>
        <button class="btn out sm" id="addInstr">+ Nuevo destino</button>
      </div></details>

    <details class="set"><summary>Gastos fijos <span class="eyebrow">${(c.fijos||[]).length}</span></summary>
      <div class="body">
        <p class="hint">Alquiler, expensas, gimnasio. Se cargan solos cuando se prepara un mes nuevo, y después los editás o borrás.</p>
        <div class="kvlist">${(c.fijos||[]).length?c.fijos.map((f,i)=>{
          const cat=store.cat(f.cat);
          return `<div class="kv"><span class="g">${esc(f.concepto)} · <b class="num">${money(f.monto)}</b>
            <small>${esc(cat?cat.nombre:"—")}</small></span>
            <button class="x d" data-delfijo="${i}" aria-label="Quitar">×</button></div>`;
        }).join(""):`<div class="hint">Todavía no cargaste ninguno.</div>`}</div>
        <button class="btn out sm" id="addFijo">+ Nuevo gasto fijo</button>
      </div></details>

    <details class="set"><summary>Compras en cuotas</summary>
      <div class="body">
        <p class="hint">Cargá el total y la cantidad de cuotas: se imputa una cuota en cada mes, así los meses que vienen ya aparecen con ese gasto comprometido.</p>
        <button class="btn out sm" id="addCuota">+ Nueva compra en cuotas</button>
      </div></details>

    <details class="set"><summary>Palabras que aprendió <span class="eyebrow">${propios.length}</span></summary>
      <div class="body">
        <p class="hint">El dictado entiende <code>50 lucas</code>, <code>50k</code>, <code>medio palo</code>, <code>2 palos</code>
          y números en letras; varios gastos en una frase separados por comas o “y”; y tus subcategorías
          (<code>carne</code> va solo a Comida › Carne). Cuando corregís una categoría al cargar y dejás tildado
          “recordar”, la palabra queda acá.</p>
        <div class="kvlist">${propios.length?propios.map(([k,v])=>{
          const cat=store.cat(v);
          return `<div class="kv"><span class="g">${esc(k)} → ${esc(cat?cat.nombre:v)}</span>
            <button class="x d" data-delpal="${esc(k)}" aria-label="Olvidar">×</button></div>`;
        }).join(""):`<div class="hint">Ninguna todavía. El diccionario base ya reconoce ${Object.keys(base).length} palabras.</div>`}</div>
      </div></details>

    <details class="set"><summary>Respaldo</summary>
      <div class="body">
        <p class="hint">Guardá una copia de todo por las dudas, o traé los datos de otro dispositivo.</p>
        <button class="btn out sm" id="exportar">Descargar respaldo</button>
        <button class="btn out sm" id="copiar">Copiar al portapapeles</button>
        <button class="btn out sm" id="importar">Restaurar desde un respaldo</button>
      </div></details>`;
  },

  /* --------------------------------------------------------- interacciones */
  conectar(){
    const v=$("#view");

    /* cuando el usuario suelta un campo, se aplica el redibujado que quedó esperando */
    v.onfocusout=()=>{ setTimeout(()=>{ if(this._renderDiferido&&!this.editando()){ this._renderDiferido=false; clearTimeout(this._tDiferido); this._tDiferido=null; this.render(); } },0); };

    /* compositor tipo chat: el botón cambia entre micrófono y enviar según haya texto */
    const ta=$("#txtEntrada"), send=$("#sendBtn"), mic=$("#micBtn");
    if(ta){
      const sync=()=>{
        const hay=ta.value.trim().length>0;
        if(send) send.hidden=this.escuchando||(!hay&&!!mic);
        if(send&&!mic) send.disabled=!hay;
        if(mic) mic.hidden=hay&&!this.escuchando;
        ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,140)+"px";
      };
      this._syncComposer=sync;
      ta.addEventListener("input",sync); sync();
      ta.addEventListener("keydown",e=>{
        if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); const t=ta.value.trim(); if(t) this.procesar(t); }
      });
      if(send) send.onclick=()=>{ const t=ta.value.trim(); if(t) this.procesar(t); };
      if(mic) mic.onclick=()=>this.alternarVoz();
    }
    const ia=$("#iaBtn"); if(ia) ia.onclick=()=>{
      const t=this.ultimoTexto||($("#txtEntrada")?$("#txtEntrada").value.trim():"");
      if(!t) return this.toast("No hay nada para interpretar.");
      this.procesarIA(t);
    };

    v.querySelectorAll(".draft").forEach(el=>{
      const i=Number(el.dataset.i);
      el.querySelectorAll("[data-f]").forEach(inp=>{
        const f=inp.dataset.f;
        inp.addEventListener("change",()=>{
          const d=this.borradores[i]; if(!d) return;
          if(f==="monto"){ d.monto=this.leerMonto(inp.value); inp.value=money(d.monto); }
          else if(f==="recordar"){ d.recordar=inp.checked; return; }
          else { d[f]=inp.value; if(f==="cat") d.dudoso=false; }
          if(f==="tipo"){
            /* al cambiar de tipo, que no quede sin categoría / fuente / destino */
            if(d.tipo==="gasto"&&!store.cat(d.cat)){ const dd=buscarDestino(d.concepto); d.cat=dd.cat||store.config.cats[0].id; }
            if(d.tipo==="ing"&&!d.fuente) d.fuente=store.config.fuentes[0];
            if(d.tipo==="inv"&&!d.instrumento) d.instrumento=buscarInstrumento(d.concepto)||store.config.instrumentos[0];
          }
          if(f==="tipo"||f==="cat") this.render();
        });
      });
      const del=el.querySelector("[data-del]");
      if(del) del.onclick=()=>{this.borradores.splice(i,1);this.render();};
    });
    const sd=$("#saveDraft"); if(sd) sd.onclick=()=>this.guardarBorradores();
    const cd=$("#cancelDraft"); if(cd) cd.onclick=()=>{this.borradores=[];this.ultimoTexto="";this.render();};

    v.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{this.sub=b.dataset.sub;this.render();});
    /* desde la vista de tortas, tocar una categoría lleva a su detalle abierto */
    v.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.cat;
      if(this.vistaEgr==="torta"){ this.vistaEgr="detalle"; this.abiertas[id]=true; }
      else this.abiertas[id]=!this.abiertas[id];
      this.render();
      if(this.abiertas[id]){ const el=v.querySelector(`[data-cat="${CSS.escape(id)}"]`); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); }
    });
    v.querySelectorAll("[data-slice]").forEach(s=>s.addEventListener("click",()=>{
      const id=s.dataset.slice;
      if(this.vistaEgr==="torta"){ this.vistaEgr="detalle"; this.abiertas[id]=true; } else this.abiertas[id]=!this.abiertas[id];
      this.render();
      const el=document.querySelector(`[data-cat="${CSS.escape(id)}"]`);
      if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
    }));
    v.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
      const[t,id]=b.dataset.edit.split(":"); this.editar(t,id);
    });
    v.querySelectorAll("[data-nuevo]").forEach(b=>b.onclick=()=>this.editar(b.dataset.nuevo,null));
    v.querySelectorAll("[data-fmov]").forEach(b=>b.onclick=()=>{this.filtroMov=b.dataset.fmov;this.render();});
    v.querySelectorAll("[data-vegr]").forEach(b=>b.onclick=()=>{this.vistaEgr=b.dataset.vegr;this.render();});
    v.querySelectorAll("[data-irpresup]").forEach(b=>b.onclick=()=>{
      this.tab="ajustes"; this.pintarTabs(); this.render();
      const d=$("#setPresup"); if(d){ d.open=true; d.scrollIntoView({behavior:"smooth",block:"start"}); }
    });

    const sw=$("#swArrastre"); if(sw) sw.onchange=()=>{store.config.arrastre=sw.checked;store.guardarConfig();};

    const al=$("#activarLock"); if(al) al.onclick=()=>this.activarBloqueo();
    const cpn=$("#cambiarPin"); if(cpn) cpn.onclick=()=>this.cambiarPin();
    const dl=$("#desactivarLock"); if(dl) dl.onclick=()=>this.desactivarBloqueo();
    const rh=$("#regHuella"); if(rh) rh.onclick=async()=>{
      if(!(await lock.huellaDisponible())) return this.toast("Este dispositivo no ofrece huella acá.");
      try{ await lock.registrarHuella(); this.toast("Huella registrada."); this.render(); }
      catch(e){ this.toast(lock.explicar(e)); }
    };

    /* el total de cada grupo se recalcula mientras escribís */
    v.querySelectorAll("[data-presup-sub]").forEach(inp=>{
      inp.addEventListener("input",()=>{
        const cid=inp.dataset.presupSub; let t=0;
        v.querySelectorAll(`[data-presup-sub="${CSS.escape(cid)}"]`).forEach(x=>{ t+=this.leerMonto(x.value); });
        const out=v.querySelector(`[data-total="${CSS.escape(cid)}"]`); if(out) out.textContent=money(t);
      });
      inp.addEventListener("change",()=>{ const n=this.leerMonto(inp.value); inp.value=n>0?money(n):""; });
    });
    v.querySelectorAll("[data-presup-cat]").forEach(inp=>{
      inp.addEventListener("change",()=>{ const n=this.leerMonto(inp.value); inp.value=n>0?money(n):""; });
    });

    const gp=$("#guardarPresup"); if(gp) gp.onclick=()=>{
      const m=store.ensureMes(this.mes);
      m.presupuestos=m.presupuestos||{}; m.presupuestosSub=m.presupuestosSub||{};
      v.querySelectorAll("[data-presup-cat]").forEach(inp=>{
        const n=this.leerMonto(inp.value);
        if(n>0) m.presupuestos[inp.dataset.presupCat]=n; else delete m.presupuestos[inp.dataset.presupCat];
      });
      v.querySelectorAll("[data-presup-sub]").forEach(inp=>{
        const cid=inp.dataset.presupSub, s=inp.dataset.sub, n=this.leerMonto(inp.value);
        m.presupuestosSub[cid]=m.presupuestosSub[cid]||{};
        if(n>0) m.presupuestosSub[cid][s]=n; else delete m.presupuestosSub[cid][s];
        if(!Object.keys(m.presupuestosSub[cid]).length) delete m.presupuestosSub[cid];
        /* si ahora hay topes por subcategoría, el tope suelto de la categoría sobra */
        if(n>0) delete m.presupuestos[cid];
      });
      store.guardarMes(this.mes); this.toast("Presupuestos guardados.");
    };
    const cp=$("#copiarPresup"); if(cp) cp.onclick=()=>{
      const prev=store.mes(keyMas(this.mes,-1));
      const hay=prev&&(Object.keys(prev.presupuestos||{}).length||Object.keys(prev.presupuestosSub||{}).length);
      if(!hay) return this.toast("El mes anterior no tiene presupuestos.");
      const m=store.ensureMes(this.mes);
      m.presupuestos={...(prev.presupuestos||{})};
      m.presupuestosSub={};
      for(const c in (prev.presupuestosSub||{})) m.presupuestosSub[c]={...prev.presupuestosSub[c]};
      store.guardarMes(this.mes); this.toast("Copiados del mes anterior.");
    };

    const ac=$("#addCat"); if(ac) ac.onclick=()=>this.editarCat(null);
    v.querySelectorAll("[data-edcat]").forEach(b=>b.onclick=()=>this.editarCat(b.dataset.edcat));
    v.querySelectorAll("[data-delcat]").forEach(b=>b.onclick=()=>this.borrarCat(b.dataset.delcat));

    const af=$("#addFuente"); if(af) af.onclick=()=>this.editarLista("fuentes",null,"fuente de ingreso");
    v.querySelectorAll("[data-edfuente]").forEach(b=>b.onclick=()=>this.editarLista("fuentes",Number(b.dataset.edfuente),"fuente de ingreso"));
    v.querySelectorAll("[data-delfuente]").forEach(b=>b.onclick=()=>this.borrarLista("fuentes",Number(b.dataset.delfuente)));
    const ai=$("#addInstr"); if(ai) ai.onclick=()=>this.editarLista("instrumentos",null,"destino de ahorro");
    v.querySelectorAll("[data-edinstr]").forEach(b=>b.onclick=()=>this.editarLista("instrumentos",Number(b.dataset.edinstr),"destino de ahorro"));
    v.querySelectorAll("[data-delinstr]").forEach(b=>b.onclick=()=>this.borrarLista("instrumentos",Number(b.dataset.delinstr)));

    const afi=$("#addFijo"); if(afi) afi.onclick=()=>this.editarFijo();
    v.querySelectorAll("[data-delfijo]").forEach(b=>b.onclick=()=>{
      store.config.fijos.splice(Number(b.dataset.delfijo),1); store.guardarConfig(); this.toast("Gasto fijo quitado.");
    });
    const acu=$("#addCuota"); if(acu) acu.onclick=()=>this.editarCuota();
    v.querySelectorAll("[data-delpal]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.delpal;
      delete (store.config.aprendidas||{})[k];
      store.config.dicc={...diccionarioBase(store.config.cats),...(store.config.aprendidas||{})};
      store.guardarConfig(); this.toast("Palabra olvidada.");
    });

    const ex=$("#exportar"); if(ex) ex.onclick=()=>this.exportar();
    const ry=$("#respaldoYa"); if(ry) ry.onclick=()=>this.exportar();
    const co=$("#copiar"); if(co) co.onclick=()=>this.copiarRespaldo();
    const im=$("#importar"); if(im) im.onclick=()=>this.importar();
  },

  leerMonto(txt){
    const s=String(txt||"").trim(); if(!s) return 0;
    if(!/[a-zñ]/i.test(s)){ const d=parseMonedaAR(s); if(d!==null&&d>0) return d; }
    const n=interpretar("x "+s);
    if(n.length) return n[0].monto;
    return parseMonedaAR(s)||0;
  },

  /* ------------------------------------------------------------------- voz */
  conectarVoz(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
    const r=new SR(); r.lang="es-AR"; r.continuous=false; r.interimResults=true; r.maxAlternatives=1;
    let final="";
    r.onstart=()=>{final="";this.escuchando=true;this.render();};
    r.onresult=e=>{
      let interim="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t=e.results[i][0].transcript;
        if(e.results[i].isFinal) final+=t; else interim+=t;
      }
      const ta=$("#txtEntrada"); if(ta){ ta.value=(final+interim).trim(); if(this._syncComposer) this._syncComposer(); }
    };
    r.onerror=ev=>{
      this.escuchando=false; this.render();
      if(ev.error==="not-allowed") this.toast("Hay que darle permiso al micrófono desde el navegador.");
      else if(ev.error==="no-speech") this.toast("No se escuchó nada. Probá de nuevo.");
      else this.toast("El dictado falló. Escribilo o probá otra vez.");
    };
    r.onend=()=>{
      this.escuchando=false;
      const ta=$("#txtEntrada"), t=(ta?ta.value:final).trim();
      this.render(); if(t) this.procesar(t);
    };
    this.rec=r;
  },

  alternarVoz(){
    if(!this.rec) this.conectarVoz();
    if(!this.rec) return this.toast("Este navegador no tiene dictado. Usá el microfonito del teclado.");
    if(this.escuchando){ try{this.rec.stop();}catch(e){} return; }
    this.borradores=[]; this.ultimoTexto="";
    try{ this.rec.start(); }catch(e){ this.toast("No se pudo abrir el micrófono."); }
  },

  procesar(texto){
    this.ultimoTexto=texto;
    const items=interpretar(texto);
    if(!items.length){ this.render(); return this.toast("No encontré ningún monto. Probá: “50 lucas de carne”."); }
    this.borradores=items;
    const ta=$("#txtEntrada"); if(ta) ta.value="";
    this.render();
    const dud=items.filter(i=>i.dudoso).length;
    this.toast(dud?`${items.length} movimiento${items.length===1?"":"s"} · revisá ${dud} categoría${dud===1?"":"s"}`
                  :`${items.length} movimiento${items.length===1?"":"s"} listo${items.length===1?"":"s"}`);
  },

  async procesarIA(texto){
    if(!this.sample) return this.procesar(texto);
    this.ultimoTexto=texto;
    const btn=$("#iaBtn"); if(btn){btn.disabled=true;btn.textContent="Pensando…";}

    const estructura=store.config.cats.map(c=>
      `- ${c.id} (${c.nombre})${(c.subs&&c.subs.length)?": "+c.subs.join(", "):""}`).join("\n");
    const prompt=
`Sos un intérprete de gastos personales en Argentina. Convertí la frase en JSON.

Frase: "${texto}"

Plata argentina: "luca"/"lucas"/"k" = mil pesos; "palo"/"palos"/"millón"/"melón" = un millón; "medio palo" = 500000; "gamba" = cien. Si la frase arranca con una unidad ("50 lucas de carne, 20 de súper"), los montos siguientes sin unidad heredan esa misma unidad (20 de súper = 20000).

Categorías y sus subcategorías:
${estructura}

Fuentes de ingreso: ${store.config.fuentes.join(", ")}
Destinos de ahorro: ${store.config.instrumentos.join(", ")}

Devolvé SOLO este JSON:
{"items":[{"tipo":"gasto"|"ingreso"|"ahorro","monto":<entero de pesos>,"concepto":"<subcategoría exacta si aplica, si no 1-3 palabras>","cat":"<id de categoría, solo si tipo=gasto>","fuente":"<solo si tipo=ingreso>","instrumento":"<solo si tipo=ahorro>"}]}

Cuando el gasto coincida con una subcategoría de la lista, usá ese nombre EXACTO en "concepto". "cobré"/"sueldo"/"ganancias" es ingreso; "puse"/"ahorré"/"plazo fijo"/"compré dólares" es ahorro; el resto es gasto.`;

    try{
      const r=await this.sample.json(prompt,{modelTier:"quick"});
      const arr=(r&&Array.isArray(r.items))?r.items:[];
      if(!arr.length) throw new Error("vacío");
      this.borradores=arr.map(it=>({
        id:uid(),
        tipo:it.tipo==="ingreso"?"ing":(it.tipo==="ahorro"?"inv":"gasto"),
        monto:Math.round(Number(it.monto)||0),
        concepto:titulizar(String(it.concepto||"").trim()),
        cat:store.config.cats.some(c=>c.id===it.cat)?it.cat:(store.config.cats[store.config.cats.length-1]||{}).id,
        fuente:it.fuente||store.config.fuentes[0]||"",
        instrumento:it.instrumento||"",
        dudoso:false, recordar:false
      })).filter(d=>d.monto>0);
      const ta=$("#txtEntrada"); if(ta) ta.value="";
      this.render();
      const n=this.borradores.length;
      this.toast(n+" movimiento"+(n===1?"":"s")+" interpretado"+(n===1?"":"s")+" con IA");
    }catch(err){
      const c=err&&err.code;
      if(c==="not_granted") this.toast("No diste permiso para usar la IA. Se usaron las reglas.");
      else if(c==="rate_limited") this.toast("La IA está ocupada. Se usaron las reglas.");
      else this.toast("La IA no pudo interpretarlo. Se usaron las reglas.");
      this.procesar(texto);
    }finally{
      const b=$("#iaBtn"); if(b){b.disabled=false;b.textContent="Con IA";}
    }
  },

  guardarBorradores(){
    const m=store.ensureMes(this.mes);
    const hoy=hoyISO(), fecha=hoy.startsWith(this.mes)?hoy:this.mes+"-01";
    let n=0, aprendidas=0;
    for(const d of this.borradores){
      if(!(d.monto>0)) continue;
      if(d.tipo==="gasto"){
        const cat=store.cat(d.cat)?d.cat:store.config.cats[0].id;
        m.gastos.push({id:uid(),fecha,monto:d.monto,cat,concepto:d.concepto||"Sin detalle"});
        if(d.recordar&&d.concepto){
          const k=norm(d.concepto);
          if(k&&store.config.dicc[k]!==cat){
            store.config.aprendidas=store.config.aprendidas||{};
            store.config.aprendidas[k]=cat; store.config.dicc[k]=cat; aprendidas++;
          }
        }
      }else if(d.tipo==="ing"){
        m.ingresos.push({id:uid(),fecha,monto:d.monto,fuente:d.fuente||store.config.fuentes[0]||"Sueldo",
          concepto:d.concepto||d.fuente||"Ingreso"});
      }else{
        m.inversiones.push({id:uid(),fecha,monto:d.monto,instrumento:d.instrumento||"Otro",concepto:d.concepto||""});
      }
      n++;
    }
    this.borradores=[]; this.ultimoTexto="";
    if(aprendidas) store.guardarConfig();
    store.guardarMes(this.mes);
    this.toast(`Guardado: ${n} movimiento${n===1?"":"s"}${aprendidas?` · ${aprendidas} palabra${aprendidas===1?"":"s"} aprendida${aprendidas===1?"":"s"}`:""}`);
  },

  /* ----------------------------------------------------------- formularios */
  hoja(titulo,cuerpo,onGuardar,onBorrar){
    const dlg=$("#sheet"), body=$("#sheetBody");
    body.innerHTML=`<div class="grab"></div><h3>${esc(titulo)}</h3>${cuerpo}
      <div class="row" style="margin-top:4px">
        ${onBorrar?`<button type="button" class="btn dan" id="shDel" style="flex:0 0 auto">Borrar</button>`:""}
        <button type="button" class="btn out" id="shCancel" style="flex:0 0 auto">Cancelar</button>
        <button type="button" class="btn pri" id="shOk">Guardar</button></div>`;
    $("#shCancel").onclick=()=>dlg.close();
    $("#shOk").onclick=()=>{ if(onGuardar(body)!==false) dlg.close(); };
    if(onBorrar) $("#shDel").onclick=()=>{ if(confirm("¿Seguro que querés borrarlo?")){onBorrar();dlg.close();} };
    dlg.showModal();
    const f=body.querySelector("input,select,textarea"); if(f) setTimeout(()=>f.focus(),60);
    return body;
  },

  editar(tipo,id){
    /* se vuelve a buscar el mes y el movimiento en el momento de guardar:
       mientras el formulario está abierto pueden llegar datos nuevos del servidor */
    const col=tipo==="gasto"?"gastos":tipo==="ing"?"ingresos":"inversiones";
    const buscar=()=>{ const mm=store.ensureMes(this.mes); const l=mm[col]; return {m:mm,lista:l,it:id?l.find(x=>x.id===id):null}; };
    const it=buscar().it;
    if(id&&!it) return this.toast("Ese movimiento ya no existe.");
    const nuevo=!it;
    const d=it||{monto:0,fecha:(hoyISO().startsWith(this.mes)?hoyISO():this.mes+"-01"),concepto:"",
      cat:(store.config.cats[0]||{}).id,fuente:store.config.fuentes[0]||"",instrumento:""};
    const t=tipo==="gasto"?"gasto":tipo==="ing"?"ingreso":"ahorro";

    const cats=store.config.cats.map(c=>`<option value="${c.id}" ${c.id===d.cat?"selected":""}>${esc(c.nombre)}</option>`).join("");
    const fuentes=store.config.fuentes.map(f=>`<option value="${esc(f)}" ${f===d.fuente?"selected":""}>${esc(f)}</option>`).join("");
    const instr=store.config.instrumentos.map(n=>`<option value="${esc(n)}" ${n===d.instrumento?"selected":""}>${esc(n)}</option>`).join("");
    const subsDe=cid=>((store.cat(cid)||{}).subs||[]).map(s=>`<option value="${esc(s)}"></option>`).join("");

    const cuerpo=`
      <label class="f" for="fMonto">Monto
        <input type="text" id="fMonto" class="num" inputmode="numeric" value="${d.monto?money(d.monto):""}"
          placeholder="50 lucas / 50000" style="font-size:20px;font-weight:700"></label>
      ${tipo==="gasto"?`<label class="f" for="fCat">Categoría<select id="fCat">${cats}</select></label>`:""}
      <label class="f" for="fConcepto">${tipo==="gasto"?"Subcategoría":tipo==="ing"?"Detalle":"Detalle (opcional)"}
        <input type="text" id="fConcepto" value="${esc(d.concepto||"")}" list="fSubs"
          placeholder="${tipo==="gasto"?"Elegí una o escribí la tuya":tipo==="ing"?"Sueldo de septiembre":"De dónde salió"}">
        <datalist id="fSubs">${tipo==="gasto"?subsDe(d.cat):""}</datalist></label>
      ${tipo==="ing"?`<label class="f" for="fFuente">Fuente<select id="fFuente">${fuentes}</select></label>`:""}
      ${tipo==="inv"?`<label class="f" for="fInstr">Dónde lo pusiste<select id="fInstr">${instr}</select></label>`:""}
      <label class="f" for="fFecha">Fecha<input type="date" id="fFecha" value="${esc(d.fecha||"")}"></label>
      ${(it&&it.fijo)?`<div class="banner">Este gasto viene de tus gastos fijos. Podés cambiarle el monto sólo para este mes.</div>`:""}
      ${(it&&it.cuotaId)?`<div class="banner">Cuota ${it.cuotaN} de ${it.cuotaTot}. Borrarla acá sólo la saca de este mes.</div>`:""}`;

    const body=this.hoja((nuevo?"Nuevo ":"")+titulizar(t),cuerpo,(b)=>{
      const monto=this.leerMonto($("#fMonto",b).value);
      if(!(monto>0)){ this.toast("Poné un monto mayor a cero."); return false; }
      const obj={id:it?it.id:uid(),monto,fecha:$("#fFecha",b).value||this.mes+"-01",
        concepto:$("#fConcepto",b).value.trim()};
      if(it&&it.fijo) obj.fijo=true;
      if(it&&it.cuotaId){obj.cuotaId=it.cuotaId;obj.cuotaN=it.cuotaN;obj.cuotaTot=it.cuotaTot;}
      if(tipo==="gasto"){ obj.cat=$("#fCat",b).value; if(!obj.concepto) obj.concepto="Sin detalle"; }
      if(tipo==="ing"){ obj.fuente=$("#fFuente",b).value; if(!obj.concepto) obj.concepto=obj.fuente; }
      if(tipo==="inv") obj.instrumento=$("#fInstr",b).value;

      const destino=String(obj.fecha).slice(0,7);
      const f=buscar();
      if(f.it) f.lista.splice(f.lista.indexOf(f.it),1);
      if(destino!==this.mes){
        const dm=store.ensureMes(destino);
        dm[col].push(obj);
        store.guardarMes(destino);
        this.toast("Movido a "+MESES[Number(destino.split("-")[1])-1]+".");
      }else{
        f.lista.push(obj);
        this.toast(nuevo?"Cargado.":"Cambios guardados.");
      }
      store.guardarMes(this.mes);
    }, it?()=>{
      const f=buscar();
      if(f.it) f.lista.splice(f.lista.indexOf(f.it),1);
      store.guardarMes(this.mes); this.toast("Borrado.");
    }:null);

    // al cambiar de categoría, cambia la lista de subcategorías sugeridas
    const selCat=$("#fCat",body);
    if(selCat) selCat.onchange=()=>{ $("#fSubs",body).innerHTML=subsDe(selCat.value); };
  },

  /* ------------------------------------------- categorías y subcategorías */
  editarCat(id){
    const cat=id?store.cat(id):null;
    const color=cat?cat.color:(store.config.cats.length%PALETA.length);
    let subs=cat?[...(cat.subs||[])]:[];

    const pintarSubs=()=>subs.map((s,i)=>`
      <div class="kv"><span class="g">${esc(s)}</span>
        <button class="x" data-subed="${i}" aria-label="Renombrar">✎</button>
        <button class="x d" data-subdel="${i}" aria-label="Quitar">×</button></div>`).join("")
      ||`<div class="hint">Sin subcategorías. Son opcionales — sirven para desglosar (Comida › Carne, Súper…).</div>`;

    const cuerpo=`
      <label class="f" for="fNom">Nombre<input type="text" id="fNom" value="${esc(cat?cat.nombre:"")}" placeholder="Mascotas"></label>
      <div class="f">Color<div class="swatches" id="sw">${PALETA.map((_,i)=>
        `<button type="button" data-c="${i}" aria-pressed="${i===color}" style="background:${colorDe(i)}" aria-label="Color ${i+1}"></button>`).join("")}</div></div>
      <div class="f">Subcategorías (opcional)
        <div class="kvlist" id="subList">${pintarSubs()}</div>
        <div class="subedit" style="margin-top:6px">
          <input type="text" id="subNew" placeholder="Agregar subcategoría">
          <button type="button" class="btn out sm" id="subAdd" style="flex:0 0 auto">Agregar</button>
        </div></div>`;

    const renombres=[]; // [viejo, nuevo] para arrastrar gastos y topes ya cargados
    const body=this.hoja(cat?"Editar categoría":"Nueva categoría",cuerpo,(b)=>{
      const nom=$("#fNom",b).value.trim();
      if(!nom){ this.toast("Ponele un nombre."); return false; }
      const c=Number(b.querySelector("[data-c][aria-pressed=true]").dataset.c);
      if(cat){
        cat.nombre=nom; cat.color=c; cat.subs=subs;
        if(renombres.length) for(const k in store.meses){
          const mm=store.meses[k]; let toco=false;
          for(const [viejo,nuevo] of renombres){
            mm.gastos.forEach(g=>{ if(g.cat===cat.id&&norm(g.concepto)===norm(viejo)){g.concepto=nuevo;toco=true;} });
            const ps=(mm.presupuestosSub||{})[cat.id];
            if(ps&&ps[viejo]!==undefined){ ps[nuevo]=ps[viejo]; delete ps[viejo]; toco=true; }
          }
          if(toco) store.guardarMes(k);
        }
      }
      else{
        let nid=norm(nom).replace(/\s/g,"-")||("cat"+uid());
        while(store.config.cats.some(x=>x.id===nid)) nid+="-2";
        store.config.cats.push({id:nid,nombre:nom,color:c,subs});
      }
      store.guardarConfig();
      this.toast(cat?"Categoría actualizada.":"Categoría creada.");
    },null);

    const sw=$("#sw",body);
    sw.onclick=e=>{
      const b=e.target.closest("[data-c]"); if(!b) return;
      sw.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
    };

    const refrescar=()=>{ $("#subList",body).innerHTML=pintarSubs(); enlazarSubs(); };
    const enlazarSubs=()=>{
      body.querySelectorAll("[data-subdel]").forEach(b=>b.onclick=()=>{
        subs.splice(Number(b.dataset.subdel),1); refrescar();
      });
      body.querySelectorAll("[data-subed]").forEach(b=>b.onclick=()=>{
        const i=Number(b.dataset.subed);
        const n=prompt("Nombre de la subcategoría:",subs[i]);
        if(n&&n.trim()&&n.trim()!==subs[i]){ renombres.push([subs[i],titulizar(n.trim())]); subs[i]=titulizar(n.trim()); refrescar(); }
      });
    };
    enlazarSubs();

    const agregar=()=>{
      const inp=$("#subNew",body), t=inp.value.trim();
      if(!t) return;
      if(subs.some(s=>norm(s)===norm(t))){ this.toast("Esa subcategoría ya está."); return; }
      subs.push(titulizar(t)); inp.value=""; refrescar(); inp.focus();
    };
    $("#subAdd",body).onclick=agregar;
    $("#subNew",body).onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); agregar(); } };
  },

  borrarCat(id){
    const cat=store.cat(id); if(!cat) return;
    if(store.config.cats.length<=1) return this.toast("Tiene que quedar al menos una categoría.");
    let usos=0;
    for(const k in store.meses) usos+=store.meses[k].gastos.filter(g=>g.cat===id).length;
    const destino=store.config.cats.find(c=>c.id!==id);
    if(usos && !confirm(`"${cat.nombre}" tiene ${usos} gasto${usos===1?"":"s"} cargado${usos===1?"":"s"}. Si la borrás pasan a "${destino.nombre}". ¿Seguimos?`)) return;
    if(!usos && !confirm(`¿Borrar la categoría "${cat.nombre}"?`)) return;

    for(const k in store.meses){
      let toco=false;
      store.meses[k].gastos.forEach(g=>{ if(g.cat===id){g.cat=destino.id;toco=true;} });
      if(store.meses[k].presupuestos&&store.meses[k].presupuestos[id]!==undefined){
        delete store.meses[k].presupuestos[id]; toco=true;
      }
      if(toco) store.guardarMes(k);
    }
    for(const w in store.config.dicc) if(store.config.dicc[w]===id) store.config.dicc[w]=destino.id;
    store.config.fijos=(store.config.fijos||[]).map(f=>f.cat===id?{...f,cat:destino.id}:f);
    store.config.cats=store.config.cats.filter(c=>c.id!==id);
    store.guardarConfig();
    this.toast("Categoría borrada.");
  },

  editarLista(campo,i,etiqueta){
    const actual=i===null?"":store.config[campo][i];
    const cuerpo=`<label class="f" for="fL">Nombre
      <input type="text" id="fL" value="${esc(actual)}" placeholder="${esc(titulizar(etiqueta))}"></label>`;
    this.hoja(i===null?("Nueva "+etiqueta):("Editar "+etiqueta),cuerpo,(b)=>{
      const t=$("#fL",b).value.trim();
      if(!t){ this.toast("Ponele un nombre."); return false; }
      if(store.config[campo].some((x,j)=>j!==i&&norm(x)===norm(t))){ this.toast("Ya existe."); return false; }
      if(i===null) store.config[campo].push(t);
      else{
        const viejo=store.config[campo][i];
        store.config[campo][i]=t;
        // renombrar en los movimientos ya cargados
        const prop=campo==="fuentes"?"fuente":"instrumento";
        const col=campo==="fuentes"?"ingresos":"inversiones";
        for(const k in store.meses){
          let toco=false;
          store.meses[k][col].forEach(x=>{ if(x[prop]===viejo){x[prop]=t;toco=true;} });
          if(toco) store.guardarMes(k);
        }
      }
      store.guardarConfig();
      this.toast(i===null?"Agregado.":"Renombrado.");
    },null);
  },

  borrarLista(campo,i){
    if(store.config[campo].length<=1) return this.toast("Tiene que quedar al menos uno.");
    const nombre=store.config[campo][i];
    const prop=campo==="fuentes"?"fuente":"instrumento";
    const col=campo==="fuentes"?"ingresos":"inversiones";
    let usos=0;
    for(const k in store.meses) usos+=store.meses[k][col].filter(x=>x[prop]===nombre).length;
    if(usos && !confirm(`"${nombre}" está usado en ${usos} movimiento${usos===1?"":"s"}. Se van a quedar con ese nombre igual. ¿Lo quitamos de la lista?`)) return;
    store.config[campo].splice(i,1);
    store.guardarConfig();
    this.toast("Quitado.");
  },

  editarFijo(){
    const cats=store.config.cats.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join("");
    const cuerpo=`
      <label class="f" for="fCon">Qué es<input type="text" id="fCon" placeholder="Alquiler, expensas, gimnasio"></label>
      <label class="f" for="fMon">Monto por mes<input type="text" id="fMon" class="num" inputmode="numeric" placeholder="350 lucas"></label>
      <label class="f" for="fCa">Categoría<select id="fCa">${cats}</select></label>
      <p class="hint">Se agrega automáticamente a cada mes nuevo que se prepare.</p>`;
    this.hoja("Nuevo gasto fijo",cuerpo,(b)=>{
      const con=$("#fCon",b).value.trim(), mon=this.leerMonto($("#fMon",b).value);
      if(!con||!(mon>0)){ this.toast("Completá el nombre y el monto."); return false; }
      store.config.fijos=store.config.fijos||[];
      store.config.fijos.push({concepto:titulizar(con),monto:mon,cat:$("#fCa",b).value});
      store.guardarConfig(); this.toast("Gasto fijo guardado.");
    },null);
  },

  editarCuota(){
    const cats=store.config.cats.map(c=>`<option value="${c.id}">${esc(c.nombre)}</option>`).join("");
    const cuerpo=`
      <label class="f" for="qCon">Qué compraste<input type="text" id="qCon" placeholder="Heladera"></label>
      <div class="row">
        <label class="f" for="qTot">Total<input type="text" id="qTot" class="num" inputmode="numeric" placeholder="600 lucas"></label>
        <label class="f" for="qN">Cuotas<input type="number" id="qN" value="6" min="1" max="60"></label>
      </div>
      <label class="f" for="qCa">Categoría<select id="qCa">${cats}</select></label>
      <p class="hint">La primera cuota cae en ${MESES[Number(this.mes.split("-")[1])-1]} y el resto en los meses que siguen.</p>`;
    this.hoja("Compra en cuotas",cuerpo,(b)=>{
      const con=$("#qCon",b).value.trim(), tot=this.leerMonto($("#qTot",b).value);
      const n=Math.max(1,Math.min(60,Number($("#qN",b).value)||1));
      if(!con||!(tot>0)){ this.toast("Completá qué compraste y el total."); return false; }
      const cuota=Math.round(tot/n), cid=uid(), cat=$("#qCa",b).value;
      for(let i=0;i<n;i++){
        const k=keyMas(this.mes,i), m=store.ensureMes(k);
        m.gastos.push({id:uid(),fecha:k+"-01",monto:cuota,cat,concepto:titulizar(con),cuotaId:cid,cuotaN:i+1,cuotaTot:n});
        store.guardarMes(k);
      }
      this.toast(`${n} cuotas de ${money(cuota)} imputadas.`);
    },null);
  },

  /* ---------------------------------------------------------------- backup */
  respaldo(){
    return JSON.stringify({app:"plata-del-mes",v:2,fecha:new Date().toISOString(),
      config:store.config,meses:store.meses},null,2);
  },
  async exportar(){
    const nombre="balance-personal-"+hoyISO()+".json";
    const texto=this.respaldo();
    if(this.modoPropio){
      /* app propia: compartir (Drive, WhatsApp, mail…) y si no, descargar */
      try{
        const archivo=new File([texto],nombre,{type:"application/json"});
        if(navigator.canShare&&navigator.canShare({files:[archivo]})){
          await navigator.share({files:[archivo],title:"Respaldo Balance Personal"});
          this.marcarRespaldo(); this.toast("Respaldo compartido."); return;
        }
      }catch(e){ if(e&&e.name==="AbortError") return; }
      try{
        const url=URL.createObjectURL(new Blob([texto],{type:"application/json"}));
        const a=document.createElement("a"); a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),4000);
        this.marcarRespaldo(); this.toast("Respaldo descargado."); return;
      }catch(e){}
      return this.copiarRespaldo();
    }
    try{
      const dl=await ((window.claude&&window.claude.use)?window.claude.use("downloads"):null);
      if(dl){ await dl.save({filename:nombre,data:texto}); this.marcarRespaldo(); this.toast("Respaldo descargado."); return; }
    }catch(e){
      if(e&&e.code){ this.toast("No se pudo descargar. Probá copiarlo al portapapeles."); return; }
    }
    this.copiarRespaldo();
  },
  async copiarRespaldo(){
    try{ await navigator.clipboard.writeText(this.respaldo()); this.marcarRespaldo(); this.toast("Respaldo copiado. Pegalo en una nota o un mail."); }
    catch(e){ this.toast("No se pudo copiar. Probá con el botón de descargar."); }
  },
  importar(){
    const cuerpo=`<label class="f" for="impTxt">Pegá acá el respaldo
        <textarea id="impTxt" style="min-height:140px;font-size:12px" placeholder='{"app":"plata-del-mes",...}'></textarea></label>
      <div class="banner">Restaurar reemplaza todo lo que tenés cargado ahora. Hacé un respaldo antes por las dudas.</div>`;
    this.hoja("Restaurar respaldo",cuerpo,(b)=>{
      let d;
      try{ d=JSON.parse($("#impTxt",b).value); }catch(e){ this.toast("Eso no es un respaldo válido."); return false; }
      if(!d||!d.config||!d.meses){ this.toast("Al archivo le faltan datos."); return false; }
      if(!confirm("Esto reemplaza todos tus datos actuales. ¿Seguimos?")) return false;
      store.config=store.migrar({...CONFIG_DEF(),...d.config});
      store.meses={};
      for(const k in d.meses) store.meses[k]={...MES_DEF(),...d.meses[k]};
      store.guardarConfig();
      for(const k in store.meses) store.guardarMes(k);
      this.toast("Datos restaurados.");
    },null);
  }
};

App.start();
</script>
