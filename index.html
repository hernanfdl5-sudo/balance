  /* ------------------------------------------------- app propia (offline) */
  iniciarPWA(){
    /* pedirle al navegador que no borre los datos si le falta espacio */
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
    if(!("serviceWorker" in navigator)||location.protocol!=="https:") return;
    navigator.serviceWorker.register("./sw.js").then(reg=>{
      const avisar=()=>this.toastAccion("Hay una versión nueva de la app.","Actualizar",()=>location.reload());
      if(reg.waiting&&navigator.serviceWorker.controller) avisar();
      reg.addEventListener("updatefound",()=>{
        const nw=reg.installing; if(!nw) return;
        nw.addEventListener("statechange",()=>{ if(nw.state==="installed"&&navigator.serviceWorker.controller) avisar(); });
      });
      /* busca actualizaciones cada vez que volvés a la app */
      document.addEventListener("visibilitychange",()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
    }).catch(()=>{});
  },
  ultimoRespaldo(){ try{ return Number(localStorage.getItem("bp_respaldo")||0); }catch(e){ return 0; } },
  marcarRespaldo(){ try{ localStorage.setItem("bp_respaldo",String(Date.now())); }catch(e){} this.render(); },
  hayDatos(){ return Object.values(store.meses).some(m=>m.gastos.length||m.ingresos.length||m.inversiones.length); },
  bannerRespaldo(){
    if(!this.modoPropio||!this.hayDatos()) return "";
    const dias=(Date.now()-this.ultimoRespaldo())/86400000;
    if(dias<30) return "";
    return `<div class="banner" style="display:flex;align-items:center;gap:10px;justify-content:space-between">
      <span>${this.ultimoRespaldo()?"Hace más de un mes que no hacés un respaldo.":"Tus datos viven sólo en este celular. Hacé un respaldo."}</span>
      <button type="button" class="btn sm" id="respaldoYa" style="flex:none;background:var(--warn);color:#2a1d00">Respaldar</button></div>`;
  },

  /* ------------------------------------------------------------ bloqueo */
  bloquear(){
    this.bloqueado=true; this.pin=""; this.borradores=[];
    const dlg=$("#sheet"); if(dlg&&dlg.open) dlg.close();
    $("#shell").setAttribute("aria-hidden","true"); $("#tabs").hidden=true; $("#composerBar").hidden=true;
    $("#view").innerHTML="";
    this.pintarLock();
    if(lock.tieneHuella()) setTimeout(()=>this.probarHuella(true),350);
  },
  desbloquear(){
    this.bloqueado=false; this.pin=""; lock.intentos=0;
    $("#lock").hidden=true; $("#shell").removeAttribute("aria-hidden"); $("#tabs").hidden=false;
    this.render();
  },
  pintarLock(msg,mal){
    const L=$("#lock"); L.hidden=false;
    const largo=4, dots=Array.from({length:largo},(_,i)=>`<i class="${i<this.pin.length?"on":""}"></i>`).join("");
    const bloqueadoHasta=lock.hastaCuando>Date.now()?Math.ceil((lock.hastaCuando-Date.now())/1000):0;
    L.innerHTML=`
      <div class="brand">Balance Personal</div>
      <div class="st">${bloqueadoHasta?"Esperá "+bloqueadoHasta+" s":"Ingresá tu PIN"}</div>
      <div class="pindots ${mal?"bad":""}" aria-label="PIN">${dots}</div>
      <div class="lockmsg">${esc(msg||"")}</div>
      <div class="pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}" ${bloqueadoHasta?"disabled":""}>${n}</button>`).join("")}
        ${lock.tieneHuella()?`<button type="button" class="ghost" data-k="huella">Huella</button>`:`<span></span>`}
        <button type="button" data-k="0" ${bloqueadoHasta?"disabled":""}>0</button>
        <button type="button" class="ghost" data-k="borrar">Borrar</button>
      </div>
      ${lock.tieneHuella()?`<button type="button" class="huella" data-k="huella" aria-label="Usar huella">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a8 8 0 0 0-8 8c0 2.5.5 4.4 1.3 6.2"/><path d="M17.7 6.4A8 8 0 0 1 20 11c0 3-.6 5.5-1.5 7.6"/><path d="M12 7a4 4 0 0 0-4 4c0 3.2.6 6 1.8 8.5"/><path d="M15.6 9a4 4 0 0 1 .4 2c0 3.5-.6 6.6-1.7 9"/><path d="M12 11c0 3.8-.7 7-2 9.6"/></svg>Usar huella</button>`:""}`;
    L.onclick=e=>{ const b=e.target.closest("[data-k]"); if(b&&!b.disabled) this.teclaPin(b.dataset.k); };
    if(bloqueadoHasta) setTimeout(()=>{ if(this.bloqueado) this.pintarLock(); },1000);
  },
  async teclaPin(k){
    if(k==="huella") return this.probarHuella(false);
    if(k==="borrar"){ this.pin=this.pin.slice(0,-1); return this.pintarLock(); }
    if(lock.hastaCuando>Date.now()) return;
    if(this.pin.length>=4) return;
    this.pin+=k; this.pintarLock();
    if(this.pin.length===4){
      const ok=await lock.verificarPin(this.pin);
      if(ok) return this.desbloquear();
      lock.intentos++; this.pin="";
      if(lock.intentos>=5){ lock.hastaCuando=Date.now()+30000; lock.intentos=0; this.pintarLock("Demasiados intentos.",true); }
      else this.pintarLock("PIN incorrecto.",true);
    }
  },
  async probarHuella(silencioso){
    try{ await lock.pedirHuella(); this.desbloquear(); }
    catch(e){ if(!silencioso) this.pintarLock(lock.explicar(e),false); }
  },

  /* activación desde Ajustes: PIN primero, huella después si se puede */
  activarBloqueo(){
    const cuerpo=`
      <p class="hint">Elegí un PIN de 4 números. Es lo que te pide al entrar si la huella no está disponible.</p>
      <label class="f" for="pin1">PIN<input type="password" id="pin1" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" style="letter-spacing:.4em;font-size:22px;text-align:center"></label>
      <label class="f" for="pin2">Repetilo<input type="password" id="pin2" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" style="letter-spacing:.4em;font-size:22px;text-align:center"></label>
      <div class="banner">Si te olvidás el PIN, la única salida es borrar los datos de sitio del navegador — eso saca la traba pero no borra tus gastos, que están en tu cuenta.</div>`;
    this.hoja("Activar bloqueo",cuerpo,(b)=>{
      const p1=$("#pin1",b).value.trim(), p2=$("#pin2",b).value.trim();
      if(!/^\d{4}$/.test(p1)){ this.toast("El PIN son 4 números."); return false; }
      if(p1!==p2){ this.toast("Los PIN no coinciden."); return false; }
      (async()=>{
        await lock.configurarPin(p1);
        this.render();
        if(await lock.huellaDisponible()){
          try{ await lock.registrarHuella(); this.toast("Bloqueo activado con huella y PIN."); }
          catch(e){ this.toast("Bloqueo activado con PIN. "+lock.explicar(e)); }
        }else this.toast("Bloqueo activado con PIN. Este dispositivo no ofrece huella acá.");
        this.render();
      })();
    },null);
  },
  cambiarPin(){
    const cuerpo=`
      <label class="f" for="pinA">PIN actual<input type="password" id="pinA" inputmode="numeric" maxlength="4" autocomplete="off" style="letter-spacing:.4em;font-size:22px;text-align:center"></label>
      <label class="f" for="pinN">PIN nuevo<input type="password" id="pinN" inputmode="numeric" maxlength="4" autocomplete="off" style="letter-spacing:.4em;font-size:22px;text-align:center"></label>`;
    this.hoja("Cambiar PIN",cuerpo,(b)=>{
      const a=$("#pinA",b).value.trim(), n=$("#pinN",b).value.trim();
      if(!/^\d{4}$/.test(n)){ this.toast("El PIN nuevo son 4 números."); return false; }
      (async()=>{
        if(!(await lock.verificarPin(a))) return this.toast("El PIN actual no es correcto.");
        await lock.configurarPin(n); this.toast("PIN cambiado."); this.render();
      })();
    },null);
  },
  desactivarBloqueo(){
    const cuerpo=`<label class="f" for="pinD">Confirmá con tu PIN<input type="password" id="pinD" inputmode="numeric" maxlength="4" autocomplete="off" style="letter-spacing:.4em;font-size:22px;text-align:center"></label>`;
    this.hoja("Desactivar bloqueo",cuerpo,(b)=>{
      const p=$("#pinD",b).value.trim();
      (async()=>{
        if(!(await lock.verificarPin(p))) return this.toast("PIN incorrecto.");
        lock.desactivar(); this.toast("Bloqueo desactivado en este dispositivo."); this.render();
      })();
    },null);
  },

  /* ¿hay un campo de texto con el foco dentro de la vista o del compositor? */
  editando(){
    const a=document.activeElement, v=$("#view"), cb=$("#composerBar");
    return !!(a&&((v&&v.contains(a))||(cb&&cb.contains(a)))&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&a.type!=="checkbox");
  },

  /* el compositor se construye una sola vez y sobrevive a los redibujados */
  pintarComposer(){
    const bar=$("#composerBar"); if(bar.dataset.listo) return;
    const voz=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
    const icoSend=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>`;
    bar.innerHTML=`<div class="inner">
      <div class="atajos">
        <button type="button" data-nuevo="gasto">+ Gasto</button>
        <button type="button" data-nuevo="ing">+ Ingreso</button>
        <button type="button" data-nuevo="inv">+ Ahorro</button>
      </div>
      <div class="composer">
        <textarea id="txtEntrada" rows="1" placeholder="50 lucas de carne, 20 de súper…" aria-label="Gasto a cargar"></textarea>
        <button type="button" class="cbtn" id="sendBtn" aria-label="Interpretar" hidden>${icoSend}</button>
        ${voz?`<button type="button" class="cbtn" id="micBtn" aria-label="Dictar"></button>`:""}
      </div></div>`;
    bar.dataset.listo="1";
    bar.querySelectorAll("[data-nuevo]").forEach(b=>b.onclick=()=>this.editar(b.dataset.nuevo,null));
    const ta=$("#txtEntrada"), send=$("#sendBtn"), mic=$("#micBtn");
    const sync=()=>{
      const hay=ta.value.trim().length>0;
      if(send) send.hidden=this.escuchando||(!hay&&!!mic);
      if(send&&!mic) send.disabled=!hay;
      if(mic) mic.hidden=hay&&!this.escuchando;
      ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,140)+"px";
      this.ubicarComposer();
    };
    this._syncComposer=sync;
    ta.addEventListener("input",sync);
    ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); const t=ta.value.trim(); if(t) this.procesar(t); } });
    if(send) send.onclick=()=>{ const t=ta.value.trim(); if(t) this.procesar(t); };
    if(mic) mic.onclick=()=>this.alternarVoz();
    this.actualizarComposer();
  },
  actualizarComposer(){
    const ta=$("#txtEntrada"), mic=$("#micBtn"); if(!ta) return;
    const icoMic=`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>`;
    const icoStop=`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg>`;
    ta.placeholder=this.escuchando?"Escuchando…":"50 lucas de carne, 20 de súper…";
    if(mic){ mic.classList.toggle("rec",!!this.escuchando); mic.setAttribute("aria-label",this.escuchando?"Terminar dictado":"Dictar"); mic.innerHTML=this.escuchando?icoStop:icoMic; }
    if(this._syncComposer) this._syncComposer();
  },
  /* el compositor va pegado arriba de las pestañas; el contenido deja lugar para los dos */
  ubicarComposer(){
    const bar=$("#composerBar"), tabs=$("#tabs"), shell=$("#shell");
    const th=tabs.hidden?0:tabs.offsetHeight;
    bar.style.bottom=th+"px";
    shell.style.paddingBottom=(th+(bar.hidden?0:bar.offsetHeight)+16)+"px";
  },

  /* agrupa varios pedidos de render en uno solo por cuadro; si el usuario está
     escribiendo en un campo, el redibujado espera a que lo suelte */
  pedirRender(){
    if(this._rafRender) return;
    this._rafRender=requestAnimationFrame(()=>{
      this._rafRender=null;
      if(this.editando()){
        this._renderDiferido=true;
        /* red de seguridad: se aplica igual a los 2,5 s (el campo con foco conserva valor y cursor) */
        if(!this._tDiferido) this._tDiferido=setTimeout(()=>{ this._tDiferido=null; if(this._renderDiferido){ this._renderDiferido=false; this.render(); } },2500);
        return;
      }
      this.render();
    });
  },

  /* clave estable para reencontrar el campo con foco después de redibujar */
  claveCampo(el){
    if(!el) return null;
    if(el.id) return "#"+CSS.escape(el.id);
    if(el.dataset.presupSub!==undefined) return `[data-presup-sub="${CSS.escape(el.dataset.presupSub)}"][data-sub="${CSS.escape(el.dataset.sub||"")}"]`;
    if(el.dataset.presupCat!==undefined) return `[data-presup-cat="${CSS.escape(el.dataset.presupCat)}"]`;
    if(el.dataset.f!==undefined){ const d=el.closest(".draft"); if(d) return `.draft[data-i="${d.dataset.i}"] [data-f="${CSS.escape(el.dataset.f)}"]`; }
    return null;
  },

  render(){
    const[y,m]=this.mes.split("-").map(Number);
    $("#mesNom").textContent=MESES[m-1]; $("#mesAnio").textContent=y;
    const hoy=mesKey(new Date());
    $("#hoyBtn").hidden=(this.mes===hoy);
    $("#hoyBtn").onclick=()=>{this.mes=hoy;this.abiertas={};this.render();};
    $("#prevM").onclick=()=>this.irMes(-1);
    $("#nextM").onclick=()=>this.irMes(1);

    const v=$("#view");
    if(this.bloqueado){ v.innerHTML=""; return; }
    if(!store.listos){
      v.innerHTML=`<section class="card"><div class="empty"><b>Cargando tus datos…</b>Un segundo.</div></section>`;
      return;
    }

    /* lo que el usuario tenía a medio hacer sobrevive al redibujado */
    const abiertos=[...v.querySelectorAll("details.set")].map(d=>d.open);
    const act=document.activeElement;
    let foco=null;
    if(act&&v.contains(act)){
      const esTexto=(act.tagName==="INPUT"||act.tagName==="TEXTAREA")&&act.type!=="checkbox";
      foco={key:this.claveCampo(act), value:esTexto?act.value:null, s:act.selectionStart, e:act.selectionEnd};
    }
    const scrollY=window.scrollY;

    v.innerHTML = this.tab==="cargar"?this.vistaCargar()
      : this.tab==="movs"?this.bloqueMovimientos()
      : this.tab==="alertas"?this.vistaAlertas()
      : this.tab==="resumen"?this.vistaResumen()
      : this.tab==="ahorro"?this.vistaAhorro()
      : this.vistaAjustes();
    this.conectar();
    this.pintarTabs();

    const bar=$("#composerBar");
    if(this.tab==="cargar"&&!this.bloqueado){ this.pintarComposer(); bar.hidden=false; this.actualizarComposer(); }
    else bar.hidden=true;
    this.ubicarComposer();
    if(abiertos.length) v.querySelectorAll("details.set").forEach((d,i)=>{ if(abiertos[i]!==undefined) d.open=abiertos[i]; });
    if(foco&&foco.key){
      const el=v.querySelector(foco.key);
      if(el){
        if(foco.value!==null&&el.value!==foco.value) el.value=foco.value;
        el.focus({preventScroll:true});
        if(foco.value!==null&&typeof foco.s==="number"){ try{ el.setSelectionRange(foco.s,foco.e); }catch(_){} }
      }
    }
    if(Math.abs(window.scrollY-scrollY)>2) window.scrollTo(0,scrollY);
  },

  /* --------------------------------------------------------------- gráficos */
  donut(items,total,centroK,centroV,centroS){
    if(!items.length||total<=0) return "";
    const R=54,W=24,C=2*Math.PI*R,GAP=items.length>1?2.5:0;
    let off=0;
    const segs=items.map((it,i)=>{
      const frac=it.monto/total, arc=frac*C, len=Math.max(arc-GAP,1.2);
      const s=`<circle class="dseg" cx="70" cy="70" r="${R}" fill="none" stroke="${it.color}" stroke-width="${W}"
        stroke-linecap="butt" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}"
        stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"
        data-slice="${i}" ${it.id?`data-slice-cat="${esc(it.id)}"`:""} data-nombre="${esc(it.nombre)}"
        data-monto="${it.monto}" data-pct="${pct(frac*100)}" data-color="${esc(it.color)}" role="listitem" tabindex="0"
        ><title>${esc(it.nombre)}: ${money(it.monto)} · ${pct(frac*100)}</title></circle>`;
      off+=arc; return s;
    }).join("");
    return `<div class="donutwrap">
      <svg viewBox="0 0 140 140" role="list" aria-label="Reparto por ${esc(centroK)}">
        <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--track)" stroke-width="${W}"></circle>
        ${segs}
      </svg>
      <div class="donutmid">
        <span class="k">${esc(centroK)}</span>
        <span class="v num">${esc(centroV)}</span>
        ${centroS?`<span class="s">${esc(centroS)}</span>`:""}
      </div></div>
      <div class="slicebox" hidden></div>`;
  },

  /* recuadro debajo de la torta con la porción tocada */
  mostrarPorcion(seg){
    const wrap=seg.closest(".donutwrap"); if(!wrap) return;
    const box=wrap.nextElementSibling; if(!box||!box.classList.contains("slicebox")) return;
    const yaSel=seg.classList.contains("sel");
    wrap.querySelectorAll(".dseg").forEach(s=>s.classList.remove("sel","off"));
    if(yaSel){ box.hidden=true; return; }
    wrap.querySelectorAll(".dseg").forEach(s=>{ if(s!==seg) s.classList.add("off"); });
    seg.classList.add("sel");
    const cat=seg.dataset.sliceCat;
    box.innerHTML=`<i class="dot" style="background:${seg.dataset.color}"></i>
      <span class="nm">${esc(seg.dataset.nombre)}</span>
      <span class="num v">${money(seg.dataset.monto)}</span>
      <span class="num p">${esc(seg.dataset.pct)}</span>
      ${cat?`<button type="button" class="btn out sm" data-cat="${esc(cat)}" style="grid-column:1/-1;justify-self:start">Ver desglose ›</button>`:""}`;
    box.hidden=false;
    const b=box.querySelector("[data-cat]");
    if(b) b.onclick=()=>{ const id=b.dataset.cat; this.vistaEgr="detalle"; this.abiertas[id]=true; this.render();
      const el=$("#view").querySelector(`[data-cat="${CSS.escape(id)}"]`); if(el) el.scrollIntoView({behavior:"smooth",block:"center"}); };
  },

  barrasVerticales(serie,keyActual,color){
    const max=Math.max(...serie.map(s=>s.valor),1);
    const iMax=serie.reduce((b,s,i)=>s.valor>serie[b].valor?i:b,0);
    const cols=serie.map((s,i)=>{
      const h=Math.max(s.valor/max*100,s.valor>0?3:0), act=s.key===keyActual;
      const et=(i===iMax||act)&&s.valor>0?`<span class="val num">${moneyShort(s.valor)}</span>`:"";
      return `<div class="vcol" title="${MESES[s.mes-1]}: ${money(s.valor)}">${et}
        <div class="bar ${act?"":"dim"}" style="height:${h}%;background:${color}"></div></div>`;
    }).join("");
    return `<div class="vchart" role="img" aria-label="Barras por mes">
        <div class="gridline" style="top:18px"></div>
        <div class="gridline" style="top:calc(18px + (100% - 18px) / 2)"></div>${cols}</div>
      <div class="vaxis">${serie.map(s=>`<span class="${s.key===keyActual?"now":""}">${MESES_CORTO[s.mes-1]}</span>`).join("")}</div>`;
  },

  /* ---------------------------------------------------------------- CARGAR */
  vistaCargar(){
    const b=this.borradores;
    let h=this.bannerRespaldo();
    if(this.ultimoTexto) h+=`<div class="heard">“${esc(this.ultimoTexto)}”</div>`;
    if(!b.length&&!this.ultimoTexto)
      h+=`<div class="empty" style="padding-top:34px"><b>Dictá o escribí un gasto abajo</b>Por ejemplo: “50 lucas de carne, 20 de súper”.</div>`;

    if(b.length){
      h+=`<section class="card" style="display:flex;flex-direction:column;gap:11px">
        <div class="sechead" style="margin:0"><h2 class="sec">Revisá antes de guardar</h2></div>`;
      if(b.some(x=>x.dudoso)) h+=`<div class="banner">Hay conceptos que no reconocí. Elegí dónde van y dejá tildado “recordar” para que la próxima salga solo.
        ${this.sample?`<div style="margin-top:8px"><button type="button" class="btn out sm" id="iaBtn">Probar con IA</button></div>`:""}</div>`;
      h+=b.map((d,i)=>this.filaBorrador(d,i)).join("");
      h+=`<div class="row" style="margin-top:3px">
        <button class="btn out" id="cancelDraft" style="flex:0 0 auto">Descartar</button>
        <button class="btn pri" id="saveDraft">Guardar ${b.length} movimiento${b.length===1?"":"s"}</button>
      </div></section>`;
    }
    return h;
  },

  filaBorrador(d,i){
    const cats=store.config.cats.map(c=>`<option value="${c.id}" ${c.id===d.cat?"selected":""}>${esc(c.nombre)}</option>`).join("");
    const cat=store.cat(d.cat);
    const subs=(cat&&cat.subs||[]).map(s=>`<option value="${esc(s)}"></option>`).join("");
    const fuentes=store.config.fuentes.map(f=>`<option value="${esc(f)}" ${f===d.fuente?"selected":""}>${esc(f)}</option>`).join("");
    const instr=store.config.instrumentos.map(n=>`<option value="${esc(n)}" ${n===d.instrumento?"selected":""}>${esc(n)}</option>`).join("");
    const tipos=[["gasto","Gasto"],["ing","Ingreso"],["inv","Ahorro"]]
      .map(([v,l])=>`<option value="${v}" ${v===d.tipo?"selected":""}>${l}</option>`).join("");

    return `<div class="draft ${d.dudoso?"warnrow":""}" data-i="${i}">
      <div class="l1">
        <input type="text" class="num" value="${money(d.monto)}" data-f="monto" inputmode="numeric"
               aria-label="Monto" style="max-width:132px;font-weight:700">
        <input type="text" value="${esc(d.concepto)}" data-f="concepto" list="subs-${i}"
               placeholder="${d.tipo==="gasto"?"Subcategoría":"Detalle"}" aria-label="Detalle">
        <datalist id="subs-${i}">${subs}</datalist>
        <button class="del" data-del="${i}" aria-label="Quitar">×</button>
      </div>
      <div class="row">
        <select data-f="tipo" aria-label="Tipo">${tipos}</select>
        ${d.tipo==="gasto"?`<select data-f="cat" aria-label="Categoría">${cats}</select>`
          :d.tipo==="ing"?`<select data-f="fuente" aria-label="Fuente">${fuentes}</select>`
          :`<select data-f="instrumento" aria-label="Instrumento">${instr}</select>`}
      </div>
      ${d.tipo==="gasto"?`<label style="display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--ink-2);font-weight:500">
        <input type="checkbox" data-f="recordar" ${d.recordar?"checked":""} style="width:auto;margin:0">
        Recordar que “${esc(d.concepto||"esto")}” va en ${esc(cat?cat.nombre:"")}</label>`:""}
    </div>`;
  },

  bloqueMovimientos(interno){
    const m=store.mes(this.mes), todos=[];
    if(m){
      m.gastos.forEach(g=>todos.push({...g,_t:"gasto"}));
      m.ingresos.forEach(g=>todos.push({...g,_t:"ing"}));
      m.inversiones.forEach(g=>todos.push({...g,_t:"inv"}));
    }
    todos.sort((a,b)=>String(b.fecha||"").localeCompare(String(a.fecha||""))||String(b.id).localeCompare(String(a.id)));

    const f=this.filtroMov||"todos";
    const movs=f==="todos"?todos:todos.filter(x=>x._t===f);
    const cuenta=t=>todos.filter(x=>x._t===t).length;
    const total=movs.reduce((s,x)=>s+(Number(x.monto)||0),0);
    const nombreF={todos:"Todos",gasto:"Gastos",ing:"Ingresos",inv:"Ahorro"};

    let h=interno?"":`<section class="card"><div class="sechead"><h2 class="sec">Movimientos del mes</h2>
      <span class="eyebrow">${movs.length}${f==="todos"?"":" de "+todos.length}</span></div>`;
    h+=`<div class="segs" role="tablist" style="margin-bottom:12px">
        <button role="tab" data-fmov="todos" aria-selected="${f==="todos"}">Todos</button>
        <button role="tab" data-fmov="gasto" aria-selected="${f==="gasto"}">Gastos${cuenta("gasto")?` <small>${cuenta("gasto")}</small>`:""}</button>
        <button role="tab" data-fmov="ing" aria-selected="${f==="ing"}">Ingresos${cuenta("ing")?` <small>${cuenta("ing")}</small>`:""}</button>
        <button role="tab" data-fmov="inv" aria-selected="${f==="inv"}">Ahorro${cuenta("inv")?` <small>${cuenta("inv")}</small>`:""}</button>
      </div>`;
    if(!todos.length){
      h+=`<div class="empty"><b>Todavía no cargaste nada</b>Dictá o escribí tu primer gasto arriba y aparece acá.</div>`;
    }else if(!movs.length){
      h+=`<div class="empty"><b>Sin ${nombreF[f].toLowerCase()} este mes</b>Cargá uno desde el bloque de arriba.</div>`;
    }else{
      h+=`<div class="movs">`+movs.map(mv=>{
        const c=store.cat(mv.cat);
        const color=mv._t==="gasto"?(c?colorDe(c.color):"var(--c12)"):mv._t==="ing"?"var(--good)":"var(--brand)";
        const sub=mv._t==="gasto"?(c?c.nombre:"Sin categoría")
          :mv._t==="ing"?("Ingreso · "+(mv.fuente||"Sin fuente")):("Ahorro · "+(mv.instrumento||"Sin destino"));
        const chips=(mv.fijo?`<span class="chip">fijo</span>`:"")+(mv.cuotaId?`<span class="chip">cuota ${mv.cuotaN}/${mv.cuotaTot}</span>`:"");
        return `<button type="button" class="mov" data-edit="${mv._t}:${mv.id}">
          <span class="bar" style="background:${color}"></span>
          <span class="txt"><b>${esc(mv.concepto||"—")}${chips}</b><span>${esc(sub)} · ${esc(fechaCorta(mv.fecha))}</span></span>
          <span class="amt num ${mv._t==="ing"?"in":""}">${mv._t==="ing"?"+":""}${money(mv.monto)}</span></button>`;
      }).join("")+`</div>`;
    }
    if(movs.length) h+=`<div class="tot"><span>Total ${f==="todos"?"del mes":nombreF[f].toLowerCase()}</span><b class="num">${money(total)}</b></div>`;
    return h+(interno?"":`</section>`);
  },

  /* --------------------------------------------------------------- RESUMEN */
  vistaResumen(){
    const key=this.mes, mesN=MESES[Number(key.split("-")[1])-1].toLowerCase();
    const modo=this.heroModo||"real", proy=modo==="proy", est=modo==="est";
    const inv=calc.invertido(key), ingReal=calc.ingresos(key), ingEsp=calc.ingEsperado(key);
    /* Real: lo gastado y lo cobrado. Proyectado: topes e ingresos esperados (un mes normal).
       Estimado: por rubro, lo mayor entre lo previsto y lo que ya pasó */
    const ing=proy?(ingEsp>0?ingEsp:ingReal):est?calc.ingEstimado(key):ingReal;
    const gas=proy?calc.presupuesto(key):est?calc.estimado(key):calc.gastado(key);
    const lblIng=proy&&ingEsp>0?"Ingresos esperados":est?"Ingresos estimados":"Ingresos";
    const arr=calc.arrastre(key),neto=ing-gas-inv,final=neto+arr;
    const acc=final>=0?"var(--good-ink)":"var(--crit-ink)";
    const lbl=(proy||est)?(final>=0?"Te sobraría":"Te faltarían"):(final>=0?"Te sobró":"Estás en rojo por");
    const sinTopes=calc.presupuesto(key)===0;

    let h=`<section class="hero" style="--hero-accent:${acc}">
      <div class="segs mini" role="tablist" style="margin-bottom:14px">
        <button role="tab" data-hero="real" aria-selected="${modo==="real"}">Real</button>
        <button role="tab" data-hero="proy" aria-selected="${proy}">Proyectado</button>
        <button role="tab" data-hero="est" aria-selected="${est}">Estimado</button>
      </div>
      <div class="lbl">${lbl}</div>
      <div class="big num">${money(Math.abs(final))}</div>
      <div class="sub">${proy
        ? (sinTopes?`Todavía no pusiste topes en ${mesN}`:`${ingEsp>0?"Ingresos esperados":"Ingresos"} menos tus topes`)
        : est
        ? (sinTopes?`Sin topes en ${mesN}, es igual al real`:`Lo ya gastado más lo que falta gastar de cada tope`)
        : (store.config.arrastre&&arr!==0
          ? `${money(neto)} de este mes ${arr>=0?"+":"−"} ${money(Math.abs(arr))} que venías arrastrando`
          : `Ingresos menos gastos y ahorro de ${mesN}`)}</div>
      <div class="miniflow">
        <div><span class="k">${lblIng}</span><span class="v num" style="color:var(--good-ink)">${money(ing)}</span></div>
        <div><span class="k">${proy?"Gastos proyectados":est?"Gastos estimados":"Gastos"}</span><span class="v num">${money(gas)}</span></div>
        <div><span class="k">Ahorro</span><span class="v num" style="color:var(--brand-ink)">${money(inv)}</span></div>
      </div></section>

      <div class="segs" role="tablist">
        <button role="tab" data-sub="egresos" aria-selected="${this.sub==="egresos"}">Egresos</button>
        <button role="tab" data-sub="ingresos" aria-selected="${this.sub==="ingresos"}">Ingresos</button>
      </div>`;

    return h + (this.sub==="egresos"?this.panelEgresos(key):this.panelIngresos(key));
  },

  panelEgresos(key){
    const gas=calc.gastado(key),presup=calc.presupuesto(key);
    const cats=calc.porCategoria(key);
    /* todas las categorías creadas, siempre: con gasto primero, después con tope, después el resto */
    const ordenCfg=Object.fromEntries(store.config.cats.map((c,i)=>[c.id,i]));
    const lista=Object.values(cats).sort((a,b)=>(b.gastado-a.gastado)||(b.presup-a.presup)||((ordenCfg[a.cat.id]??99)-(ordenCfg[b.cat.id]??99)));
    const conGasto=lista.filter(c=>c.gastado>0);

    const ve=this.vistaEgr||"detalle";
    let h=`<div class="segs mini" role="tablist" style="margin-top:-4px">
      <button role="tab" data-vegr="detalle" aria-selected="${ve==="detalle"}">Detalle</button>
      <button role="tab" data-vegr="torta" aria-selected="${ve==="torta"}">Proyectado vs real</button>
    </div>`;
    if(ve==="torta") return h+this.panelProyectadoReal(key,lista,gas,presup);

    const ahorroMes=calc.invertido(key);
    if(conGasto.length||ahorroMes>0){
      /* el ahorro no es un gasto, pero sí plata que salió: va como una porción más */
      const items=conGasto.map(c=>({id:c.cat.id,nombre:c.cat.nombre,monto:c.gastado,color:colorDe(c.cat.color)}));
      if(ahorroMes>0) items.push({id:null,nombre:"Ahorro",monto:ahorroMes,color:"var(--brand)"});
      const salio=gas+ahorroMes;
      h+=`<section class="card">
        <div class="sechead"><h2 class="sec">En qué se fue</h2>
          <span class="eyebrow">${conGasto.length} categoría${conGasto.length===1?"":"s"}${ahorroMes>0?" + ahorro":""}</span></div>
        ${this.donut(items,salio,"Salió",money(salio),ahorroMes>0?`${money(gas)} gastos · ${money(ahorroMes)} ahorro`:MESES[Number(key.split("-")[1])-1])}
        ${presup>0?this.lineaProyectado("Proyectado",presup,"Gastado",gas,"por debajo de lo proyectado","por encima de lo proyectado")
          :`<p class="hint" style="text-align:center;margin:6px 0 0">Tocá una porción para ver cuánto es.</p>`}
      </section>`;
    }

    h+=`<section class="card">
      <div class="sechead"><h2 class="sec">Categorías</h2>
        <button class="btn out sm" data-irpresup="1">Presupuestos</button></div>
      ${!gas&&!presup?`<p class="hint" style="margin:-4px 0 10px">Todavía no hay gastos ni topes este mes. Cargá desde <b>Cargar</b> o poné los presupuestos.</p>`:""}
      <div class="catlist">${lista.map(c=>this.filaCategoria(c,gas)).join("")}</div>
      <div class="tot"><span>Total gastado</span><b class="num">${money(gas)}</b></div></section>`;

    const serie=calc.serie(key,6,k=>calc.gastado(k));
    if(serie.some(s=>s.valor>0)){
      h+=`<section class="card"><div class="sechead"><h2 class="sec">Gasto por mes</h2>
        <span class="eyebrow">últimos 6</span></div>${this.barrasVerticales(serie,key,"var(--c2)")}</section>`;
    }
    return h;
  },

  /* dos tortas con los mismos colores: cómo pensabas repartir la plata y cómo la repartiste */
  panelProyectadoReal(key,lista,gas,presup){
    const mesN=MESES[Number(key.split("-")[1])-1];
    const orden=lista.slice().sort((a,b)=>(b.presup||b.gastado)-(a.presup||a.gastado));
    const proy=orden.filter(c=>c.presup>0).map(c=>({id:c.cat.id,nombre:c.cat.nombre,monto:c.presup,color:colorDe(c.cat.color)}));
    const real=orden.filter(c=>c.gastado>0).map(c=>({id:c.cat.id,nombre:c.cat.nombre,monto:c.gastado,color:colorDe(c.cat.color)}));

    let h=`<section class="card">
      <div class="sechead"><h2 class="sec">Proyectado vs real</h2><span class="eyebrow">${mesN}</span></div>`;
    if(!proy.length){
      h+=`<div class="empty"><b>Todavía no proyectaste nada</b>Ponele topes a las categorías y acá vas a ver cómo pensabas repartir la plata al lado de cómo la repartiste.</div>
        <button class="btn pri full" data-irpresup="1">Poner presupuestos del mes</button>`;
    }else{
      const dif=gas-presup;
      h+=`<div class="dosdonuts">
        <div>${this.donut(proy,presup,"Proyectado",money(presup),"")}<div class="cap">Proyectado</div></div>
        <div>${real.length?this.donut(real,gas,"Real",money(gas),""):`<div class="donutwrap" style="aspect-ratio:1;display:grid;place-items:center;color:var(--ink-3);font-size:12px;text-align:center">Sin gastos<br>todavía</div>`}<div class="cap">Real</div></div>
      </div>
      <span class="metertag tag-${dif>0?"crit":dif<0?"ok":"none"}" style="margin-top:12px">
        ${dif>0?`Vas ${money(dif)} por encima de lo proyectado`:dif<0?`Vas ${money(-dif)} por debajo de lo proyectado`:"Justo en lo proyectado"}
        ${presup>0?` · ${pct(gas/presup*100)}`:""}</span>`;
    }

    h+=`<div class="cmp">
      <span class="hd">Categoría</span><span class="hd">Proy.</span><span class="hd">Real</span><span class="hd">Dif.</span>`;
    for(const c of orden){
      const d=c.gastado-c.presup;
      const cls=c.presup>0?(d>0?"crit":"ok"):"none";
      const txt=c.presup>0?((d>0?"+":"−")+moneyShort(Math.abs(d))):"—";
      h+=`<button type="button" class="nm" data-cat="${esc(c.cat.id)}" style="text-align:left;padding:0">
          <i class="dot" style="background:${colorDe(c.cat.color)}"></i><b>${esc(c.cat.nombre)}</b></button>
        <span class="n num">${c.presup>0?moneyShort(c.presup):"—"}</span>
        <span class="n num">${c.gastado>0?moneyShort(c.gastado):"—"}</span>
        <span class="d num ${cls}">${txt}</span>`;
    }
    const dt=gas-presup;
    h+=`<span class="tt">Total</span><span class="tt n num">${moneyShort(presup)}</span><span class="tt n num">${moneyShort(gas)}</span>
        <span class="tt d num ${presup>0?(dt>0?"crit":"ok"):"none"}">${presup>0?((dt>0?"+":"−")+moneyShort(Math.abs(dt))):"—"}</span>
      </div>
      <p class="hint" style="margin:12px 0 0">Los montos están abreviados (k = mil, M = millón). Tocá una categoría para ver el detalle completo.</p>
    </section>`;
    return h;
  },

  /* dos cifras y una frase debajo de una torta: proyectado vs real, sin barra */
  lineaProyectado(k1,v1,k2,v2,txtMenos,txtMas){
    const est=estadoTope(v2,v1);
    const frase=v2>v1*1.01?`Vas ${money(v2-v1)} ${txtMas} · ${pct(v2/v1*100)}`
      :v2<v1*0.99?`Vas ${money(v1-v2)} ${txtMenos} · ${pct(v2/v1*100)}`:"Justo en lo proyectado";
    return `<div class="proyline">
        <div><span class="k">${esc(k1)}</span><b class="num">${money(v1)}</b></div>
        <div><span class="k">${esc(k2)}</span><b class="num">${money(v2)}</b></div>
      </div>
      <div style="text-align:center"><span class="metertag tag-${est}" style="margin-top:8px">${frase}</span></div>`;
  },

  filaCategoria(c,totalMes){
    const abierta=!!this.abiertas[c.cat.id], color=colorDe(c.cat.color);
    const p=c.presup>0?c.gastado/c.presup*100:null;
    const est=estadoTope(c.gastado,c.presup);
    const fill=colorEstado(est,color);
    const share=totalMes>0?c.gastado/totalMes*100:0;
    const tag=`<span class="metertag tag-${est}">${textoEstado(est,c.gastado,c.presup)}</span>`;

    let subs="";
    if(abierta){
      let cuerpo="";
      if(c.lista.length){
        const maxGasto=Math.max(...c.lista.map(s=>s.monto),1);
        cuerpo=c.lista.map((s,i)=>{
          if(s.tope>0){
            const sp=s.monto/s.tope*100, sest=estadoTope(s.monto,s.tope), sfill=colorEstado(sest,color);
            return `<div class="subrow">
              <div class="top"><span>${esc(s.nombre)}</span>
                <span class="num">${money(s.monto)}<em>de ${money(s.tope)}</em></span></div>
              <div class="subbar"><i style="width:${Math.min(sp,100)}%;background:${sfill}"></i></div>
              <div class="subtag ${sest}">${textoEstado(sest,s.monto,s.tope)}</div></div>`;
          }
          return `<div class="subrow">
            <div class="top"><span>${esc(s.nombre)}${s.definida?"":`<i class="libre" title="No está en la lista de subcategorías">libre</i>`}</span>
              <span class="num">${money(s.monto)}<em>${c.gastado>0?pct(s.monto/c.gastado*100):""}</em></span></div>
            <div class="subbar"><i style="width:${Math.max(s.monto/maxGasto*100,3)}%;background:${color};opacity:${Math.max(1-i*.12,.4)}"></i></div>
          </div>`;
        }).join("");
      }else{
        cuerpo=`<div class="hint">Sin gastos cargados en esta categoría.</div>`;
      }
      if(c.porSubs)
        cuerpo+=`<div class="sinusar">El tope de ${esc(c.cat.nombre)} (${money(c.presup)}) es la suma de estas subcategorías.</div>`;
      if(c.sinUsar&&c.sinUsar.length)
        cuerpo+=`<div class="sinusar">Sin tope ni gastos: ${c.sinUsar.map(esc).join(" · ")}</div>`;
      subs=`<div class="subs">${cuerpo}</div>`;
    }

    return `<div class="catrow ${abierta?"open":""}">
      <button type="button" class="cathead" data-cat="${esc(c.cat.id)}" aria-expanded="${abierta}">
        <span class="catname"><i class="dot" style="background:${color}"></i><b>${esc(c.cat.nombre)}</b></span>
        <span class="catnums"><span class="a num">${money(c.gastado)}</span>
          <span class="b num">${c.gastado>0?pct(share)+" del mes":"sin gastos"}</span></span>
      </button>
      <div class="meter"><i style="width:${p===null?0:Math.min(p,100)}%;background:${fill}"></i></div>
      ${tag}${subs}</div>`;
  },

  panelIngresos(key){
    const m=store.mes(key), ing=calc.ingresos(key), fuentes=calc.porFuente(key), mesN=MESES[Number(key.split("-")[1])-1];
    const esperado=calc.ingEsperado(key);
    if(!ing&&!esperado){
      return `<section class="card"><div class="empty"><b>Sin ingresos cargados</b>
        Cargá tu sueldo o lo que te haya entrado este mes.</div>
        <button class="btn pri full" data-nuevo="ing">+ Cargar ingreso</button></section>`;
    }

    const items=fuentes.filter(f=>f.monto>0).map(f=>({id:null,nombre:f.nombre,monto:f.monto,color:colorDe(fuentes.indexOf(f))}));
    let h=`<section class="card">
      <div class="sechead"><h2 class="sec">De dónde vino</h2>
        <span class="eyebrow">${fuentes.length} fuente${fuentes.length===1?"":"s"}</span></div>
      ${ing>0?this.donut(items,ing,"Ingresó",money(ing),mesN):""}
      ${esperado>0?this.lineaProyectado("Esperado",esperado,"Cobrado",ing,"por debajo de lo esperado","por encima de lo esperado"):""}
      <div class="catlist" style="margin-top:8px">`
      + fuentes.map((f,i)=>this.filaFuente(f,i,ing)).join("")
      + `</div><div class="tot"><span>Total ingresado</span><b class="num" style="color:var(--good-ink)">${money(ing)}</b></div></section>`;

    h+=`<section class="card"><div class="sechead"><h2 class="sec">Movimientos</h2>
      <span class="eyebrow">${m.ingresos.length}</span></div><div class="movs">`
      + m.ingresos.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))).map(i=>
        `<button type="button" class="mov" data-edit="ing:${i.id}">
          <span class="bar" style="background:var(--good)"></span>
          <span class="txt"><b>${esc(i.concepto||i.fuente||"Ingreso")}</b>
            <span>${esc(i.fuente||"Sin fuente")} · ${esc(fechaCorta(i.fecha))}</span></span>
          <span class="amt num in">+${money(i.monto)}</span></button>`).join("")
      + `</div><button class="btn pri full" data-nuevo="ing" style="margin-top:12px">+ Cargar ingreso</button></section>`;

    const serie=calc.serie(key,6,k=>calc.ingresos(k));
    if(serie.filter(s=>s.valor>0).length>1){
      h+=`<section class="card"><div class="sechead"><h2 class="sec">Ingresos por mes</h2>
        <span class="eyebrow">últimos 6</span></div>${this.barrasVerticales(serie,key,"var(--good)")}</section>`;
    }
    return h;
  },

  /* una fuente de ingreso: barra contra lo esperado y desglose por detalle al tocarla */
  filaFuente(f,i,total){
    const clave="ing:"+f.nombre, abierta=!!this.abiertas[clave], color=colorDe(i);
    const est=estadoTope(f.monto,f.esperado), fill=colorEstado(est,color);
    const p=f.esperado>0?Math.min(f.monto/f.esperado*100,100):(total>0?f.monto/total*100:0);
    const tag=f.esperado>0?`<span class="metertag tag-${est}">${textoEstado(est,f.monto,f.esperado)}</span>`
      :`<span class="metertag tag-none">Sin esperado</span>`;
    let subs="";
    if(abierta){
      const max=f.lista.length?f.lista[0].monto:1;
      const cuerpo=f.lista.length?f.lista.map((s,j)=>`<div class="subrow">
          <div class="top"><span>${esc(s.nombre)}</span><span class="num">${money(s.monto)}<em>${f.monto>0?pct(s.monto/f.monto*100):""}</em></span></div>
          <div class="subbar"><i style="width:${Math.max(s.monto/max*100,3)}%;background:${color};opacity:${Math.max(1-j*.12,.4)}"></i></div>
        </div>`).join(""):`<div class="hint">Todavía no cobraste nada de esta fuente.</div>`;
      subs=`<div class="subs">${cuerpo}</div>`;
    }
    return `<div class="catrow ${abierta?"open":""}">
      <button type="button" class="cathead" data-fuente="${esc(f.nombre)}" aria-expanded="${abierta}">
        <span class="catname"><i class="dot" style="background:${color}"></i><b>${esc(f.nombre)}</b></span>
        <span class="catnums"><span class="a num">${money(f.monto)}</span>
          <span class="b num">${f.esperado>0?"de "+money(f.esperado):(total>0&&f.monto>0?pct(f.monto/total*100)+" del total":"")}</span></span>
      </button>
      <div class="meter"><i style="width:${p}%;background:${fill}"></i></div>${tag}${subs}</div>`;
  },

  /* --------------------------------------------------------------- ALERTAS */
  vistaAlertas(){
    const key=this.mes, mesN=MESES[Number(key.split("-")[1])-1];
    const a=calc.alertas(key);
    const fila=(f,derecha,est)=>`<div class="alrow">
        <i class="dot" style="background:${f.ing?"var(--good)":colorDe(f.cat.color)}"></i>
        <span class="g"><b>${esc(f.nombre||f.cat.nombre)}</b>${f.nombre?`<small>${esc(f.cat.nombre)}</small>`:""}</span>
        <span class="num r ${est}">${derecha}</span></div>`;

    if(!a.sinCargar.length&&!a.conSaldo.length&&!a.pasados.length){
      return `<section class="card"><div class="empty"><b>Sin topes en ${mesN}</b>
        Las alertas salen de los topes que pongas en Presupuestos: te avisan qué falta cargar y cuánto te queda.</div>
        <button class="btn pri full" data-irpresup="1">Poner presupuestos</button></section>`;
    }

    const disponible=a.conSaldo.filter(f=>!f.ing).reduce((s,f)=>s+(f.tope-f.gastado),0)+a.sinCargar.filter(f=>!f.ing).reduce((s,f)=>s+f.tope,0);
    let h=`<section class="hero" style="--hero-accent:var(--brand-ink)">
      <div class="lbl">Te queda por gastar dentro de los topes</div>
      <div class="big num">${money(disponible)}</div>
      <div class="sub">${a.sinCargar.length} sin cargar · ${a.conSaldo.length} con saldo · ${a.pasados.length} pasado${a.pasados.length===1?"":"s"}</div>
    </section>`;

    h+=`<section class="card"><div class="sechead"><h2 class="sec">Todavía sin cargar</h2><span class="eyebrow">${a.sinCargar.length}</span></div>`;
    h+= a.sinCargar.length
      ? `<p class="hint" style="margin:-4px 0 10px">Tienen tope pero nada cargado en ${mesN}. Si ya pasó, cargalo.</p><div class="allist">${a.sinCargar.map(f=>fila(f,(f.ing?"esperado ":"tope ")+money(f.tope),"none")).join("")}</div>`
      : `<div class="empty">Todo lo que tiene tope ya tiene algo cargado.</div>`;
    h+=`</section>`;

    if(a.conSaldo.length) h+=`<section class="card"><div class="sechead"><h2 class="sec">Con saldo disponible</h2><span class="eyebrow">${a.conSaldo.length}</span></div>
      <div class="allist">${a.conSaldo.map(f=>fila(f,(f.ing?"faltan ":"quedan ")+money(f.tope-f.gastado),"ok")).join("")}</div></section>`;

    if(a.pasados.length) h+=`<section class="card"><div class="sechead"><h2 class="sec">Pasados del tope</h2><span class="eyebrow">${a.pasados.length}</span></div>
      <div class="allist">${a.pasados.map(f=>fila(f,"+"+money(f.gastado-f.tope),"crit")).join("")}</div></section>`;
    return h;
  },

  /* ---------------------------------------------------------------- AHORRO */
  /* ojito: con los montos ocultos, todo lo que sea plata se muestra tapado */
  get priv(){ if(this._priv===undefined){ try{ this._priv=localStorage.getItem("bp_priv")==="1"; }catch(e){ this._priv=false; } } return this._priv; },
  set priv(v){ this._priv=!!v; try{ localStorage.setItem("bp_priv",v?"1":"0"); }catch(e){} },
  ocultable(){
    const p=this.priv;
    return { money:v=>p?"$ ••••":money(v), usd:v=>p?"US$ ••••":usd(v), moneyD:v=>p?"$ ••••":moneyD(v),
      cantidad:v=>p?"••••":cantidad(v), signo:(v,f)=>p?"••••":signo(v,f), pct:v=>p?"••":pctSigno(v) };
  },
  botonOjo(){
    return `<button type="button" class="ojo" id="ojoPriv" aria-label="${this.priv?"Mostrar montos":"Ocultar montos"}" title="${this.priv?"Mostrar montos":"Ocultar montos"}">
      ${this.priv?`<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A10.4 10.4 0 0 1 12 5c5 0 9 4 10 7a11.6 11.6 0 0 1-2.6 3.9M6.6 6.6C4.4 8 2.8 10 2 12c1 3 5 7 10 7 1.6 0 3.1-.4 4.4-1"/></svg>`
        :`<svg viewBox="0 0 24 24"><path d="M2 12c1-3 5-7 10-7s9 4 10 7c-1 3-5 7-10 7S3 15 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`}</button>`;
  },

  vistaAhorro(){
    const key=this.mes;
    const P=cartera.posiciones(), V=cartera.valuar(P), D=V.dolar;
    const cls=v=>v==null?"":v>=0?"gain":"loss";
    const O=this.ocultable(), money=O.money, usd=O.usd, moneyD=O.moneyD, cantidad=O.cantidad, signo=O.signo, pctS=O.pct;
    const hay=Object.keys(V.secciones).length>0||P.cerradas.length>0;

    if(this.ahorroSec&&V.secciones[this.ahorroSec]) return this.vistaSeccionAhorro(this.ahorroSec,P,V);
    this.ahorroSec=null;

    let h="";
    if(!hay){
      h+=`<section class="hero" style="--hero-accent:var(--brand-ink)"><div class="lbl">Tu cartera</div><div class="big num">${money(0)}</div>
        <div class="sub">Todavía no cargaste ninguna operación.</div></section>
        <section class="card"><div class="empty"><b>Empezá por la primera compra</b>Lo habitual: comprás dólares con pesos y con esos dólares comprás cripto. Cada paso es una operación.</div>
        <button class="btn pri full" id="nuevaOp">+ Nueva operación</button></section>`;
    }else{
      const gan=V.ganArs, acc=gan==null?"var(--brand-ink)":gan>=0?"var(--good-ink)":"var(--crit-ink)";

        ${D?`<div class="big2 num">${usd(V.totalUsd)}</div>`:""}

        <div class="miniflow tres">
          <div><span class="k">Invertiste</span><span class="v num">${money(V.costoArs)}</span><span class="s num">en pesos</span></div>
          <div><span class="k">Si vendieras hoy</span><span class="v num ${cls(gan)}">${gan==null?"—":signo(gan,window.money)}</span>
            ${gan!=null&&V.costoArs>0?`<span class="s num ${cls(gan)}">${pctS(gan/V.costoArs*100)} en pesos</span>`:""}</div>
          <div><span class="k">La cripto te dio</span><span class="v num ${cls(ganU)}">${ganU==null?"—":signo(ganU,window.usd)}</span>
            ${ganU!=null&&V.secciones.cripto.costoUsd>0?`<span class="s num ${cls(ganU)}">${pctS(ganU/V.secciones.cripto.costoUsd*100)} en dólares</span>`:""}</div>
        </div></section>`;
      if(V.sinPrecio.length) h+=`<div class="banner">Sin precio para ${V.sinPrecio.map(esc).join(", ")}. ${navigator.onLine?"Tocá “actualizado” para reintentar, o revisá el nombre de la moneda en la operación.":"Cuando tengas internet se actualiza solo."}</div>`;
      if(cartera.precios.error&&!D) h+=`<div class="banner">No pude traer las cotizaciones (${esc(cartera.precios.error)}). Los valores se muestran al costo.</div>`;
      h+=this.graficoEvolucion("ars");

      const colorSec={cripto:"var(--c2)",usd:"var(--c3)",pesos:"var(--c4)"};
      const itemsPf=["cripto","usd","pesos"].filter(k=>V.secciones[k]).map(k=>({id:null,nombre:V.secciones[k].nombre,monto:D?(V.secciones[k].valArs||0):(V.secciones[k].valUsd||0),color:colorSec[k]}));
      h+=`<section class="card"><div class="sechead"><h2 class="sec">Portfolio</h2><button class="btn pri sm" id="nuevaOp">+ Operación</button></div>
        ${this.donut(itemsPf,D?V.totalArs:V.totalUsd,"Portfolio",D?money(V.totalArs):usd(V.totalUsd),"")}
        <div class="catlist" style="margin-top:6px">`;
      for(const k of ["cripto","usd","pesos"]){
        const s=V.secciones[k]; if(!s) continue;
        const g=k==="pesos"?null:s.ganArs, share=V.totalArs>0&&s.valArs!=null?s.valArs/V.totalArs*100:0;
        const sub=k==="cripto"?`${s.filas.length} moneda${s.filas.length===1?"":"s"}`:k==="usd"?cantidad(s.cant)+" US$"+(s.pendientes.length?" · falta una cotización":""):s.filas.map(f=>f.nombre).join(" · ");
        h+=`<button type="button" class="catrow secrow" data-sec="${k}">
          <span class="cathead"><span class="catname"><i class="dot" style="background:${colorSec[k]}"></i><span><b>${s.nombre}</b><small class="secsub">${esc(sub)}</small></span></span>
            <span class="catnums"><span class="a num">${s.valArs!=null?money(s.valArs):usd(s.valUsd)}</span>

          <span class="meter"><i style="width:${share}%;background:${colorSec[k]}"></i></span>
          <span class="secmeta"><b class="num">${this.priv?"••":pct(share)}</b> del portfolio${g!=null?` · <span class="num ${cls(g)}">${signo(g,window.money)}</span>`:""}</span></button>`;
      }
      h+=`</div></section>`;
    }

    const serie=calc.serie(key,12,k=>calc.invertido(k));
    if(serie.some(s=>s.valor>0))
      h+=`<section class="card"><div class="sechead"><h2 class="sec">Apartado mes a mes</h2><span class="eyebrow">últimos 12</span></div>
        ${this.barrasVerticales(serie,key,"var(--brand)")}
        <p class="hint" style="margin:8px 0 0">Lo que sacaste del presupuesto de cada mes para la cartera.</p></section>`;

    if(P.cerradas.length) h+=this.bloqueCerradas(P,V);
    if(hay) h+=this.bloqueOperaciones(P,null);
    return h;
  },

  vistaSeccionAhorro(sec,P,V){
    const D=V.dolar, s=V.secciones[sec], cls=v=>v==null?"":v>=0?"gain":"loss";
    const O=this.ocultable(), money=O.money, usd=O.usd, moneyD=O.moneyD, cantidad=O.cantidad, signo=O.signo, pctS=O.pct;
    let h=`<div style="display:flex;justify-content:space-between;align-items:center"><button type="button" class="volver" id="volverAhorro">‹ Ahorro</button>${this.botonOjo()}</div>`;

    if(sec==="cripto"){
      const fx=D?s.costoUsd*D-s.costoArs:null, g=s.ganArs;
      const per=this.periodoCripto||"24h", PER={"24h":"24 h","7d":"7 días","30d":"30 días","1y":"1 año"};
      /* variación del período: cuánto se movió el valor actual según el cambio de precio de cada moneda */
      let vP=0, baseP=0, hayP=false;
      for(const f of s.filas){ const ch=f.chs?f.chs[per]:null; if(f.px!=null&&ch!=null){ const antes=f.valUsd/(1+ch/100); vP+=f.valUsd-antes; baseP+=antes; hayP=true; } }

        <div class="lbl">Cripto</div><div class="big num">${usd(s.valUsd)}</div>
        ${D?`<div class="big2 num">${money(s.valArs)}</div>`:""}
        <div class="sub">${hayP?`${PER[per]}: <b class="${cls(vP)}">${signo(vP,window.usd)}${baseP>0?" ("+pctS(vP/baseP*100)+")":""}</b> · `:""}actualizado ${cartera.hace(cartera.precios.ts)}</div>
        <div class="segs mini" role="tablist" style="margin-top:10px">${Object.keys(PER).map(k=>`<button role="tab" data-per="${k}" aria-selected="${k===per}">${PER[k]}</button>`).join("")}</div>
        <div class="miniflow tres">
          <div><span class="k">Invertiste</span><span class="v num">${usd(s.costoUsd)}</span>${D?`<span class="s num">${money(s.costoArs)} en pesos</span>`:""}</div>
          <div><span class="k">La cripto te dio</span><span class="v num ${cls(s.ganUsd)}">${s.ganUsd==null?"—":signo(s.ganUsd,window.usd)}</span>${s.ganUsd!=null&&s.costoUsd>0?`<span class="s num ${cls(s.ganUsd)}">${pctS(s.ganUsd/s.costoUsd*100)} de precio</span>`:""}</div>
          <div><span class="k">El dólar te dio</span><span class="v num ${cls(fx)}">${fx==null?"—":signo(fx,window.money)}</span>${D&&s.costoUsd>0?`<span class="s num">compraste a ${O.moneyD(s.costoArs/s.costoUsd)} · hoy ${O.moneyD(D)}</span>`:""}</div>
        </div>
        ${g!=null?`<div class="cointotal ${cls(g)}"><span>Si vendieras hoy, en pesos</span><b class="num">${signo(g,window.money)}${s.costoArs>0?` (${pctS(g/s.costoArs*100)})`:""}</b></div>`:""}
      </section>`;
      h+=this.graficoEvolucion("usd");

      /* composición + tabla de monedas */
      const filasOrd=s.filas.slice().sort((a,b)=>b.valUsd-a.valUsd);
      const itemsC=filasOrd.map((f,i)=>({id:null,nombre:f.sym,monto:f.valUsd,color:colorDe(i)}));
      h+=`<section class="card"><div class="sechead"><h2 class="sec">Monedas</h2><span class="eyebrow">${s.filas.length}</span></div>
        ${this.donut(itemsC,s.valUsd,"Cripto",usd(s.valUsd),"")}
        <div class="tabla" style="margin-top:8px">`
        + filasOrd.map((f,i)=>{
          const abierta=!!this.abiertas["coin:"+f.sym], chP=f.chs?f.chs[per]:null;
          return `<button type="button" class="tr" data-coin="${esc(f.sym)}" aria-expanded="${abierta}">
            <span class="l"><span class="nom"><i class="dot" style="background:${colorDe(i)}"></i><b>${esc(f.sym)}</b>${s.valUsd>0?`<em class="pill">${pct(f.valUsd/s.valUsd*100)}</em>`:""}</span>
              <small class="num">${f.px!=null?usdPrecio(f.px):"sin precio"}${chP!=null?` <span class="${cls(chP)}">${pctSigno(chP)}</span>`:""}</small></span>
            <span class="r num"><b>${usd(f.valUsd)}</b><small>${cantidad(f.cant)} ${esc(f.sym)}</small>
              <small class="${cls(f.ganUsd)}">${f.ganUsd==null?"":signo(f.ganUsd,window.usd)+(f.costoUsd>0?" ("+pctS(f.ganUsd/f.costoUsd*100)+")":"")}</small></span>
          </button>
          ${abierta?`<div class="coindet">
            <div class="kpis tres">
              <div><span class="k">Pagaste c/u</span><span class="num">${f.cant>0?usdPrecio(f.costoUsd/f.cant):"—"}</span><span class="num s">hoy ${f.px!=null?usdPrecio(f.px):"—"}</span></div>
              <div><span class="k">Invertiste</span><span class="num">${usd(f.costoUsd)}</span><span class="num s">${money(f.costoArs)} en pesos</span></div>
              <div><span class="k">Vale hoy</span><span class="num">${usd(f.valUsd)}</span><span class="num s">${D?money(f.valArs):"—"}</span></div>
              <div><span class="k">La cripto te dio</span><span class="num ${cls(f.ganUsd)}">${f.ganUsd==null?"—":signo(f.ganUsd,window.usd)}</span><span class="num s ${cls(f.ganUsd)}">${f.costoUsd>0&&f.ganUsd!=null?pctS(f.ganUsd/f.costoUsd*100):""}</span></div>
              <div><span class="k">El dólar te dio</span><span class="num ${cls(f.ganFx)}">${f.ganFx==null?"—":signo(f.ganFx,window.money)}</span></div>
              <div><span class="k">Si vendieras hoy</span><span class="num ${cls(f.ganArs)}">${f.ganArs==null?"—":signo(f.ganArs,window.money)}</span><span class="num s ${cls(f.ganArs)}">${f.costoArs>0&&f.ganArs!=null?pctS(f.ganArs/f.costoArs*100):""}</span></div>
            </div></div>`:""}`;
        }).join("")+`</div></section>`;
    }
    else if(sec==="usd"){
      const g=s.ganArs;
      h+=`<section class="hero" style="--hero-accent:${g==null?"var(--brand-ink)":g>=0?"var(--good-ink)":"var(--crit-ink)"}">
        <div class="lbl">Dólares sin invertir</div><div class="big num">${usd(s.cant)}</div>
        ${D?`<div class="big2 num">${money(s.valArs)}</div>`:""}
        <div class="sub">${D?`Al dólar de hoy (${O.moneyD(D)})`:"Sin cotización del dólar"}</div>
        <div class="miniflow tres">
          <div><span class="k">Te costaron</span><span class="v num">${money(s.costoArs)}</span></div>
          <div><span class="k">Compraste a</span><span class="v num">${s.tcProm?O.moneyD(s.tcProm):"—"}</span>${D?`<span class="s num">hoy ${O.moneyD(D)}</span>`:""}</div>
          <div><span class="k">Si vendieras hoy</span><span class="v num ${cls(g)}">${g==null?"—":signo(g,window.money)}</span>${g!=null&&s.costoArs>0?`<span class="s num ${cls(g)}">${pctS(g/s.costoArs*100)}</span>`:""}</div>
        </div></section>`;
      if(s.pendientes.length) h+=`<section class="card"><div class="banner">Hay compras de dólares sin cotización. Sin ese dato no sé cuántos dólares son.</div>
        <div class="movs">${s.pendientes.map(o=>`<button type="button" class="mov" data-op="${o.id}"><span class="bar" style="background:var(--warn)"></span>
          <span class="txt"><b>${money(o.ars)} del ${esc(fechaCorta(o.fecha))}</b><span>Tocá para completar cuántos dólares fueron</span></span><span class="amt">›</span></button>`).join("")}</div></section>`;
    }
    else{
      h+=`<section class="hero" style="--hero-accent:var(--brand-ink)"><div class="lbl">En pesos</div><div class="big num">${money(s.valArs)}</div>
        ${D?`<div class="big2 num">${usd(s.valUsd)}</div>`:""}
        <div class="sub">Plazo fijo, efectivo guardado y similares, al valor que cargaste.</div></section>
        <section class="card"><div class="catlist">${s.filas.map((f,i)=>`<div class="catrow"><div class="cathead">
          <span class="catname"><i class="dot" style="background:${colorDe(i+3)}"></i><b>${esc(f.nombre)}</b></span>
          <span class="catnums"><span class="a num">${money(f.ars)}</span><span class="b num">${s.valArs>0?pct(f.ars/s.valArs*100):""}</span></span></div></div>`).join("")}</div></section>`;
    }
    h+=this.bloqueOperaciones(P,sec);
    return h;
  },

  /* evolución del valor de la cartera: un punto por día, guardado al actualizar precios */
  graficoEvolucion(moneda){
    const hist=(cartera.d.hist||[]).slice(-180);
    if(hist.length<2) return "";
    const vals=hist.map(p=>moneda==="usd"?p.usd:p.ars).map(Number);
    const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
    const W=320,H=110,PL=6,PR=6,PT=10,PB=18;
    const x=i=>PL+(W-PL-PR)*(hist.length===1?0:i/(hist.length-1)), y=v=>PT+(H-PT-PB)*(1-(v-min)/span);
    const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const area=`M${x(0).toFixed(1)},${(H-PB).toFixed(1)} L${pts.replace(/ /g," L")} L${x(vals.length-1).toFixed(1)},${(H-PB).toFixed(1)} Z`;
    const ult=vals[vals.length-1], pri=vals[0], dif=ult-pri, sube=dif>=0, col=sube?"var(--good)":"var(--crit)";
    const f=moneda==="usd"?usd:money, O=this.ocultable();
    const fecha=d=>{ const p=String(d).split("-"); return Number(p[2])+" "+MESES_CORTO[Number(p[1])-1]; };
    return `<section class="card"><div class="sechead"><h2 class="sec">Evolución</h2>
        <span class="eyebrow num ${sube?"gain":"loss"}">${this.priv?"••••":signo(dif,f)}${pri>0&&!this.priv?" · "+pctSigno(dif/pri*100):""}</span></div>
      <svg viewBox="0 0 ${W} ${H}" class="evo" role="img" aria-label="Evolución de la cartera">
        <line x1="${PL}" y1="${PT}" x2="${W-PR}" y2="${PT}" class="g"/><line x1="${PL}" y1="${(H-PB)}" x2="${W-PR}" y2="${(H-PB)}" class="g"/>
        <path d="${area}" fill="${col}" opacity=".12"/>
        <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${x(vals.length-1)}" cy="${y(ult)}" r="3.5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
        <text x="${PL}" y="${H-4}" class="t">${fecha(hist[0].d)}</text><text x="${W-PR}" y="${H-4}" class="t" text-anchor="end">${fecha(hist[hist.length-1].d)}</text>
        <text x="${W-PR}" y="${PT-2}" class="t" text-anchor="end">${this.priv?"••••":f(max)}</text>
      </svg>
      <p class="hint" style="margin:6px 0 0">Un punto por día desde que empezaste a usar la cartera. ${hist.length} día${hist.length===1?"":"s"}.</p></section>`;
  },

  bloqueCerradas(P,V){
    const D=V.dolar, cls=v=>v==null?"":v>=0?"gain":"loss";
    const O=this.ocultable(), money=O.money, usd=O.usd, signo=O.signo, pctSigno=O.pct;
    const lista=P.cerradas.slice().reverse();
    return `<section class="card"><div class="sechead"><h2 class="sec">Operaciones cerradas</h2><span class="eyebrow">${lista.length}</span></div>
      <p class="hint" style="margin:-4px 0 10px">Ganancia de cada venta contra tu costo promedio en ese momento.</p>
      <div class="movs">${lista.map(c=>{
        const g=c.gananciaUsd!=null?c.gananciaUsd:c.gananciaArs, f=c.gananciaUsd!=null?usd:money;
        const p=c.base>0?pctSigno(g/c.base*100):"";
        const extra=c.gananciaUsd!=null&&D?` · en $ hoy ${signo(c.gananciaUsd*D,money)}`:"";
        return `<button type="button" class="mov" data-op="${c.op.id}"><span class="bar" style="background:${g>=0?"var(--good)":"var(--crit)"}"></span>
          <span class="txt"><b>${esc(c.det)}</b><span>${esc(fechaCorta(c.op.fecha))}${extra}</span></span>
          <span class="amt num ${cls(g)}">${signo(g,f)}${p?` <small>${p}</small>`:""}</span></button>`;
      }).join("")}</div></section>`;
  },

  bloqueOperaciones(P,sec){
    const O=this.ocultable(), money=O.money, usd=O.usd, moneyD=O.moneyD, cantidad=O.cantidad;
    const filtro={cripto:["usd_cripto","cripto_usd"],usd:["ars_usd","usd_ars"],pesos:["ars_pesos","pesos_ars"]}[sec]||null;
    const ops=cartera.opsOrdenadas().reverse().filter(o=>!filtro||filtro.includes(o.tipo));
    const res=o=>{
      const ars=Number(o.ars)||0,u=Number(o.usd)||0,q=Number(o.cant)||0;
      switch(o.tipo){
        case "ars_usd": return [money(ars)+" → "+(u>0?usd(u):"¿cuántos dólares?"), u>0?"a "+moneyD(ars/u)+" · "+fechaCorta(o.fecha):"falta la cotización · "+fechaCorta(o.fecha)];
        case "usd_cripto": return [usd(u)+" → "+cantidad(q)+" "+o.activo, (q>0?"a "+usd(u/q)+" c/u · ":"")+fechaCorta(o.fecha)];
        case "cripto_usd": return [cantidad(q)+" "+o.activo+" → "+usd(u), (q>0?"a "+usd(u/q)+" c/u · ":"")+fechaCorta(o.fecha)];
        case "usd_ars": return [usd(u)+" → "+money(ars), (u>0?"a "+moneyD(ars/u)+" · ":"")+fechaCorta(o.fecha)];
        case "ars_pesos": return [money(ars)+" → "+o.activo, fechaCorta(o.fecha)];
        case "pesos_ars": return [o.activo+" → "+money(ars), fechaCorta(o.fecha)];
      } return [o.tipo,""]; };
    const color={ars_usd:"var(--c3)",usd_ars:"var(--c3)",usd_cripto:"var(--c2)",cripto_usd:"var(--c2)",ars_pesos:"var(--c4)",pesos_ars:"var(--c4)"};
    return `<section class="card"><div class="sechead"><h2 class="sec">Operaciones</h2><button class="btn pri sm" id="nuevaOp">+ Operación</button></div>
      ${ops.length?`<div class="movs">${ops.map(o=>{ const [a,b]=res(o); return `<button type="button" class="mov" data-op="${o.id}"><span class="bar" style="background:${color[o.tipo]||"var(--brand)"}"></span>
        <span class="txt"><b>${esc(a)}</b><span>${esc(TIPOS_OP[o.tipo]||o.tipo)} · ${esc(b)}</span></span><span class="amt">›</span></button>`; }).join("")}</div>`
      :`<div class="empty">Sin operaciones${sec?" en esta sección":""} todavía.</div>`}</section>`;
  },

  refrescarPrecios(forzar){
    if(this.tab!=="ahorro"&&!forzar) return;
    cartera.actualizar(forzar).then(cambio=>{ if(cambio||forzar) this.pedirRender(); });
    if(forzar) this.pedirRender();
  },

  /* ------------------------------------------------- operaciones de cartera */
  numDec(v){
    v=String(v||"").replace(/[^\d.,-]/g,""); if(!v) return 0;
    const lc=v.lastIndexOf(","), ld=v.lastIndexOf("."); const dec=lc>ld?",":(ld>-1?".":null);
    if(dec){ const i=v.lastIndexOf(dec); v=v.slice(0,i).replace(/[.,]/g,"")+"."+v.slice(i+1).replace(/[.,]/g,""); }
    return parseFloat(v)||0;
  },
  fmtDec(n,max){ n=Number(n)||0; return n?n.toLocaleString("es-AR",{maximumFractionDigits:max==null?8:max,useGrouping:false}):""; },

  formOperacion(op){
    const nuevo=!op, o=op?{...op}:{tipo:this.ultimoTipoOp||"ars_usd",fecha:hoyISO()};
    const P=cartera.posiciones();
    const tipos=Object.entries(TIPOS_OP).map(([v,l])=>`<option value="${v}" ${v===o.tipo?"selected":""}>${l}</option>`).join("");
    const cuerpo=`<label class="f" for="opTipo">Qué hiciste<select id="opTipo">${tipos}</select></label>
      <div id="opCampos" style="display:flex;flex-direction:column;gap:13px"></div>
      <div id="opAyuda" class="hint"></div>
      <label class="f" for="opFecha">Fecha<input type="date" id="opFecha" value="${esc(o.fecha||hoyISO())}"></label>`;

    const body=this.hoja(nuevo?"Nueva operación":"Editar operación",cuerpo,(b)=>{
      const tipo=$("#opTipo",b).value, g=id=>{ const el=$("#"+id,b); return el?el.value.trim():""; };
      const n={id:op?op.id:uid(),tipo,fecha:$("#opFecha",b).value||hoyISO()};
      const ars=this.leerMonto(g("opArs")), u=this.numDec(g("opUsd")), q=this.numDec(g("opCant")), act=g("opActivo");
      if(tipo==="ars_usd"){ if(!(ars>0)) return this.toast("Poné cuántos pesos pusiste."),false; n.ars=ars; if(u>0){ n.usd=u; n.tc=ars/u; } }
      if(tipo==="usd_ars"){ if(!(u>0)||!(ars>0)) return this.toast("Faltan los dólares o los pesos."),false; n.usd=u; n.ars=ars; n.tc=ars/u; }
      if(tipo==="usd_cripto"||tipo==="cripto_usd"){
        if(!act) return this.toast("¿Qué moneda?"),false; if(!(u>0)||!(q>0)) return this.toast("Faltan los dólares o la cantidad."),false;
        n.activo=act.toUpperCase(); n.usd=u; n.cant=q; n.precio=u/q;
        if(tipo==="usd_cripto"&&cartera.precios.dolar) n.tc=cartera.precios.dolar;
      }
      if(tipo==="ars_pesos"||tipo==="pesos_ars"){ if(!act) return this.toast("¿Dónde?"),false; if(!(ars>0)) return this.toast("Poné el monto."),false; n.activo=act; n.ars=ars; }
      this.ultimoTipoOp=tipo;
      this.guardarOp(n,op);
    }, op?()=>this.borrarOp(op.id):null);

    const campos=$("#opCampos",body), ayuda=$("#opAyuda",body), sel=$("#opTipo",body);
    const usdDisp=P.usd.cant, monedas=[...new Set([...Object.keys(P.cripto),...Object.keys(cartera.d.monedas),"BTC","ETH","USDT","USDC","SOL"])];
    const inp=(id,label,ph,val,mode)=>`<label class="f" for="${id}">${label}<input type="text" id="${id}" class="num" inputmode="${mode||"decimal"}" placeholder="${ph}" value="${esc(val==null?"":val)}" autocomplete="off"></label>`;
    const trio=(prodId,aId,bId)=>{ /* prod = a × b: se completa el que falte según los dos últimos tocados */
      const tocados=[]; const el=id=>$("#"+id,body); const val=id=>id==="opArs"?this.leerMonto(el(id).value):this.numDec(el(id).value);
      const poner=(id,v)=>{ el(id).value=id==="opArs"?(v>0?money(Math.round(v)):""):this.fmtDec(v,id==="opCant"?8:2); };
      [prodId,aId,bId].forEach(id=>el(id)&&el(id).addEventListener("input",()=>{
        const i=tocados.indexOf(id); if(i>-1) tocados.splice(i,1); tocados.push(id); if(tocados.length>2) tocados.shift();
        if(tocados.length<2) return;
        const falta=[prodId,aId,bId].find(x=>!tocados.includes(x));
        const p=val(prodId),a=val(aId),b=val(bId);
        if(falta===prodId&&a>0&&b>0) poner(prodId,a*b);
        else if(falta===aId&&p>0&&b>0) poner(aId,p/b);
        else if(falta===bId&&p>0&&a>0) poner(bId,p/a);
      }));
    };
    const pintar=()=>{
      const t=sel.value; let h="", ay="";
      if(t==="ars_usd"){ h=inp("opArs","Pesos que pusiste","710.000",o.ars?money(o.ars):"","numeric")+inp("opUsd","Dólares que recibiste","440,51",o.usd?this.fmtDec(o.usd,2):"")+inp("opTc","Cotización (pesos por dólar)","1.611,49",o.usd&&o.ars?this.fmtDec(o.ars/o.usd,2):(cartera.precios.dolar?this.fmtDec(cartera.precios.dolar,2):"")); ay="Cargá dos de los tres y el otro se calcula solo. Esta compra sale del presupuesto del mes."; }
      if(t==="usd_ars"){ h=inp("opUsd","Dólares que vendiste","440,51",o.usd?this.fmtDec(o.usd,2):"")+inp("opArs","Pesos que recibiste","720.000",o.ars?money(o.ars):"","numeric")+inp("opTc","Cotización","1.640",o.usd&&o.ars?this.fmtDec(o.ars/o.usd,2):""); ay=`Tenés ${usd(usdDisp)} disponibles.`; }
      if(t==="usd_cripto"){ h=`<label class="f" for="opActivo">Moneda<input type="text" id="opActivo" list="opMonedas" placeholder="BTC" value="${esc(o.activo||"")}" autocomplete="off" style="text-transform:uppercase"><datalist id="opMonedas">${monedas.map(m=>`<option value="${esc(m)}">`).join("")}</datalist></label>`
          +inp("opUsd","Dólares que usaste","440",o.usd?this.fmtDec(o.usd,2):"")+inp("opCant","Cantidad que compraste","0,0042",o.cant?this.fmtDec(o.cant,8):"")+inp("opPx","Precio por unidad (US$)","104.000",o.usd&&o.cant?this.fmtDec(o.usd/o.cant,2):""); ay=`Tenés ${usd(usdDisp)} disponibles. Cargá dos de los tres campos.`; }
      if(t==="cripto_usd"){ const ten=Object.values(P.cripto); h=`<label class="f" for="opActivo">Moneda<select id="opActivo">${ten.length?ten.map(c=>`<option value="${esc(c.sym)}" ${c.sym===o.activo?"selected":""}>${esc(c.sym)} · tenés ${cantidad(c.cant)}</option>`).join(""):`<option value="">No tenés cripto</option>`}</select></label>`
          +inp("opCant","Cantidad que vendiste","0,0042",o.cant?this.fmtDec(o.cant,8):"")+inp("opUsd","Dólares que recibiste","460",o.usd?this.fmtDec(o.usd,2):"")+inp("opPx","Precio por unidad (US$)","109.500",o.usd&&o.cant?this.fmtDec(o.usd/o.cant,2):"")
          +`<button type="button" class="btn out sm" id="opTodo" style="align-self:flex-start">Vendí todo</button>`; ay="Al guardar te digo cuánto ganaste en esa venta."; }
      if(t==="ars_pesos"){ h=`<label class="f" for="opActivo">Dónde<input type="text" id="opActivo" list="opDest" placeholder="Plazo fijo" value="${esc(o.activo||"")}"><datalist id="opDest">${["Plazo fijo","Efectivo guardado","Fondo común","Caja de ahorro"].map(x=>`<option value="${x}">`).join("")}</datalist></label>`+inp("opArs","Pesos","100.000",o.ars?money(o.ars):"","numeric"); ay="Sale del presupuesto del mes."; }
      if(t==="pesos_ars"){ const ten=Object.values(P.pesos); h=`<label class="f" for="opActivo">De dónde<select id="opActivo">${ten.length?ten.map(p=>`<option value="${esc(p.nombre)}" ${p.nombre===o.activo?"selected":""}>${esc(p.nombre)} · ${money(p.ars)}</option>`).join(""):`<option value="">No tenés pesos guardados</option>`}</select></label>`+inp("opArs","Pesos que retiraste","100.000",o.ars?money(o.ars):"","numeric"); }
      campos.innerHTML=h; ayuda.textContent=ay;
      if(t==="ars_usd"||t==="usd_ars") trio("opArs","opUsd","opTc");
      if(t==="usd_cripto"||t==="cripto_usd"){
        trio("opUsd","opCant","opPx");
        const a=$("#opActivo",body), px=$("#opPx",body);
        const sugerir=()=>{ const p=cartera.precioDe(a.value); if(p&&!px.value&&!o.usd) px.value=this.fmtDec(p,2); };
        a.addEventListener("change",sugerir); a.addEventListener("input",()=>{ a.value=a.value.toUpperCase(); }); sugerir();
        const todo=$("#opTodo",body); if(todo) todo.onclick=()=>{ const c=P.cripto[a.value]; if(c){ $("#opCant",body).value=this.fmtDec(c.cant,8); $("#opCant",body).dispatchEvent(new Event("input")); } };
      }
      const ars=$("#opArs",body); if(ars) ars.addEventListener("change",()=>{ const n=this.leerMonto(ars.value); if(n>0) ars.value=money(n); });
    };
    sel.onchange=pintar; pintar();
  },

  async guardarOp(n,viejo){
    const ops=cartera.d.ops;
    const i=ops.findIndex(x=>x.id===n.id); if(i>-1) ops[i]=n; else ops.push(n);
    /* moneda nueva: intento encontrar su id para el precio */
    if(n.activo&&(n.tipo==="usd_cripto")&&!cartera.idDe(n.activo)){
      const r=await cartera.buscarMoneda(n.activo); const hit=r.find(x=>x.sym===n.activo)||r[0];
      if(hit) cartera.d.monedas[n.activo]=hit.id;
    }
    this.sincronizarMovimiento(n);
    store.guardarConfig();
    if(n.tipo==="cripto_usd"){
      const c=cartera.posiciones().cerradas.find(x=>x.op.id===n.id);
      if(c) this.toast(`Venta guardada: ${c.gananciaUsd>=0?"ganaste":"perdiste"} ${usd(Math.abs(c.gananciaUsd))}${c.base>0?" ("+pctSigno(c.gananciaUsd/c.base*100)+")":""}`);
    } else if(n.tipo==="usd_ars"){
      const c=cartera.posiciones().cerradas.find(x=>x.op.id===n.id);
      if(c) this.toast(`Venta guardada: ${c.gananciaArs>=0?"ganaste":"perdiste"} ${money(Math.abs(c.gananciaArs))} en pesos`);
    } else this.toast(viejo?"Operación actualizada.":"Operación guardada.");
    this.refrescarPrecios(true);
  },

  borrarOp(id){
    cartera.d.ops=cartera.d.ops.filter(o=>o.id!==id);
    for(const k in store.meses){ const m=store.meses[k]; const antes=m.inversiones.length; m.inversiones=m.inversiones.filter(x=>x.opId!==id); if(m.inversiones.length!==antes) store.guardarMes(k); }
    store.guardarConfig(); this.toast("Operación borrada.");
  },

  /* las operaciones que sacan pesos del presupuesto se reflejan como "ahorro" del mes */
  sincronizarMovimiento(op){
    const sale=op.tipo==="ars_usd"||op.tipo==="ars_pesos";
    const destino=String(op.fecha||"").slice(0,7);
    for(const k in store.meses){
      const m=store.meses[k], it=m.inversiones.find(x=>x.opId===op.id);
      if(it&&(!sale||k!==destino)){ m.inversiones.splice(m.inversiones.indexOf(it),1); store.guardarMes(k); }
    }
    if(!sale) return;
    const m=store.ensureMes(destino);
    let it=m.inversiones.find(x=>x.opId===op.id);
    if(!it){ it={id:uid(),opId:op.id}; m.inversiones.push(it); }
    it.fecha=op.fecha; it.monto=Number(op.ars)||0;
    it.instrumento=op.tipo==="ars_usd"?"Dólares":op.activo;
    it.concepto=op.tipo==="ars_usd"?(op.usd>0?`${cantidad(op.usd)} US$ a ${moneyD(op.ars/op.usd)}`:"sin cotización"):"";
    store.guardarMes(destino);
  },

  /* un movimiento de ahorro cargado por dictado o a mano genera su operación en la cartera */
  opDesdeMovimiento(mov){
    if(mov.opId) return;
    const ins=norm(mov.instrumento||""), D=cartera.precios.dolar||null;
    let op;
    if(/dolar|cripto|usd|bitcoin|btc/.test(ins)){
      op={id:uid(),tipo:"ars_usd",fecha:mov.fecha,ars:Number(mov.monto)||0};
      if(D){ op.usd=op.ars/D; op.tc=D; }
    }else{
      op={id:uid(),tipo:"ars_pesos",fecha:mov.fecha,ars:Number(mov.monto)||0,activo:mov.instrumento||"Otro"};
    }
    cartera.d.ops.push(op); mov.opId=op.id;
    if(op.tipo==="ars_usd"&&op.usd) mov.concepto=mov.concepto||`${cantidad(op.usd)} US$ a ${moneyD(D)}`;
    return op;
  },
  migrarCartera(){
    let toco=false;
    for(const k in store.meses){ let m=false; for(const inv of store.meses[k].inversiones){ if(!inv.opId){ this.opDesdeMovimiento(inv); m=true; } } if(m){ toco=true; store.guardarMes(k); } }
    if(toco) store.guardarConfig();
  },

      <div class="body">

        <div class="pgrupo">
          <div class="phead"><b><i class="dot" style="background:var(--good)"></i>Ingresos esperados</b>
            <span class="tt"><small>Total</small><span class="num" data-total="__ing">${money(calc.ingEsperado(this.mes))}</span></span></div>
          ${c.fuentes.map(f=>`<div class="psub"><span>${esc(f)}</span>
            <input type="text" class="num" data-presup-ing="${esc(f)}" inputmode="numeric"
              value="${esc(((this.presupDraft||{})["i|"+f]!==undefined)?(this.presupDraft||{})["i|"+f]:(calc.ingEsperadoDe(m,f)?money(calc.ingEsperadoDe(m,f)):""))}"
              placeholder="Sin esperado" aria-label="Ingreso esperado de ${esc(f)}"></div>`).join("")}
        </div>

          /* lo tipeado y todavía no guardado se conserva en memoria (presupDraft) */

          const val=(k,guardado)=> dr[k]!==undefined ? dr[k] : (guardado?money(guardado):"");
          if(!tiene) return `<div class="pgrupo">
            <div class="psub"><span><i class="dot" style="background:${colorDe(cat.color)}"></i>

          const t=calc.topeCat(m,cat);

                <input type="text" class="num" data-presup-sub="${esc(cat.id)}" data-sub="${esc(s)}"
                  inputmode="numeric" value="${esc(val("s|"+cat.id+"|"+s,calc.topeSub(m,cat.id,s)))}" placeholder="Sin tope"
                  aria-label="Tope de ${esc(s)}"></div>`).join("")}
          </div>`;
        }).join("")}
